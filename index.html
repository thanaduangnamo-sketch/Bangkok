<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J Community Shop</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0304;
      --card-bg: #140a0c;
      --primary-red: #ff2a4b;
      --primary-red-hover: #e01f3e;
      --discord-blue: #5865f2;
      --discord-blue-hover: #4752c4;
      --text-main: #ffffff;
      --text-muted: #99888c;
      --border-color: #2a181c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Background */
    body::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 42, 75, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Navbar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: rgba(10, 3, 4, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .logo-icon {
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, #ff2a4b, #800015);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255, 42, 75, 0.4);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ปุ่มล็อกอินปกติ */
    .btn-login-discord {
      background: var(--discord-blue);
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
      transition: all 0.2s;
    }

    .btn-login-discord:hover {
      background: var(--discord-blue-hover);
    }

    /* กล่องแสดงโปรไฟล์ Discord บน Navbar หลังล็อกอิน */
    .user-profile-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px 6px 8px;
      border-radius: 30px;
    }

    .user-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--discord-blue);
      object-fit: cover;
    }

    .user-name-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    .btn-logout-icon {
      background: rgba(255, 42, 75, 0.15);
      border: 1px solid rgba(255, 42, 75, 0.3);
      color: var(--primary-red);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 4px;
    }

    .btn-logout-icon:hover {
      background: var(--primary-red);
      color: white;
    }

    /* Hero Section */
    .hero-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .badge {
      background: rgba(255, 42, 75, 0.1);
      border: 1px solid rgba(255, 42, 75, 0.2);
      color: var(--primary-red);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .hero-title span {
      color: var(--primary-red);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .btn-main-cta {
      background: var(--discord-blue);
      color: white;
      text-decoration: none;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 30px rgba(88, 101, 242, 0.5);
      transition: all 0.3s ease;
    }

    .btn-main-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(88, 101, 242, 0.7);
      background: var(--discord-blue-hover);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo">
      <div class="logo-icon">J</div>
      <span>J Community</span>
    </div>
    <div class="nav-links">
      <i data-lucide="home" style="width:16px; height:16px;"></i> หน้าหลัก
    </div>

    <!-- โซนปุ่มล็อกอิน / แสดงโปรไฟล์บน Navbar -->
    <div id="authNavZone">
      <!-- แสดงเมื่อยังไม่ได้ล็อกอิน -->
      <a id="navLoginBtn" href="https://discord.com/oauth2/authorize?client_id=1507932932466282516&response_type=token&redirect_uri=https%3A%2F%2Fsk-six-beryl.vercel.app%2F&scope=identify" class="btn-login-discord">
        <i data-lucide="message-square" style="width:16px; height:16px;"></i> เข้าสู่ระบบด้วย Discord
      </a>

      <!-- แสดงโปรไฟล์ + ปุ่มออก เมื่อล็อกอินแล้ว (ซ่อนไว้เริ่มต้น) -->
      <div id="navProfileZone" class="user-profile-bar" style="display: none;">
        <img id="userAvatar" class="user-avatar-small" src="" alt="Avatar">
        <span id="userName" class="user-name-text">Loading...</span>
        <button class="btn-logout-icon" onclick="logoutDiscord()" title="ออกจากระบบ">
          <i data-lucide="log-out" style="width:14px; height:14px;"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-container">
    <div class="badge">
      <i data-lucide="sparkles" style="width:14px; height:14px;"></i> ยินดีต้อนรับ
    </div>
    <h1 class="hero-title">J Community <span>Shop</span></h1>
    <p class="hero-subtitle" id="heroSubtitle">ร้านของเรา — เข้าสู่ระบบด้วย Discord เพื่อเริ่มใช้งาน</p>

    <!-- ปุ่มใหญ่กลางหน้าจอ -->
    <a id="heroCtaBtn" href="https://discord.com/oauth2/authorize?client_id=1507932932466282516&response_type=token&redirect_uri=https%3A%2F%2Fsk-six-beryl.vercel.app%2F&scope=identify" class="btn-main-cta">
      <i data-lucide="message-square" style="width:20px; height:20px;"></i> เข้าสู่ระบบด้วย Discord
    </a>
  </main>

  <script>
    lucide.createIcons();

    const navLoginBtn = document.getElementById('navLoginBtn');
    const navProfileZone = document.getElementById('navProfileZone');
    const heroCtaBtn = document.getElementById('heroCtaBtn');
    const heroSubtitle = document.getElementById('heroSubtitle');

    async function checkDiscordLogin() {
      // ดึง Token จาก URL Hash หลังล็อกอิน
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      let token = hashParams.get('access_token');

      if (token) {
        localStorage.setItem('discord_token', token);
        window.location.hash = ''; // เคลียร์ Token บนช่องค้นหา
      } else {
        token = localStorage.getItem('discord_token');
      }

      // ถ้ามี Token ให้ยิงไปขอชื่อและรูปจาก Discord API
      if (token) {
        try {
          const response = await fetch('https://discord.com/api/v10/users/@me', {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (!response.ok) throw new Error('Token expired');

          const userData = await response.json();
          
          // 1. ซ่อนปุ่มล็อกอินเดิม แล้วเปิดแสดงโปรไฟล์บน Navbar
          navLoginBtn.style.display = 'none';
          navProfileZone.style.display = 'flex';

          // 2. ตั้งค่าชื่อและรูปโปรไฟล์จริง
          const avatarUrl = userData.avatar
            ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`
            : 'https://cdn.discordapp.com/embed/avatars/0.png';

          document.getElementById('userAvatar').src = avatarUrl;
          document.getElementById('userName').innerText = userData.global_name || userData.username;

          // 3. เปลี่ยนข้อความในหน้าหลัก
          heroSubtitle.innerText = `ยินดีต้อนรับคุณ ${userData.global_name || userData.username} เข้าสู่ระบบแล้ว!`;
          heroCtaBtn.style.display = 'none'; // ซ่อนปุ่มล็อกอินกลางหน้าจอ

          lucide.createIcons();

        } catch (err) {
          console.error('Login Error:', err);
          logoutDiscord();
        }
      }
    }

    // ฟังก์ชันออกจากระบบ
    function logoutDiscord() {
      localStorage.removeItem('discord_token');
      window.location.href = window.location.origin + window.location.pathname;
    }

    checkDiscordLogin();
  </script>
</body>
</html>
