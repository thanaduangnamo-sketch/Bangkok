<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | สมัครสมาชิก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0d13;
            --card-bg: rgba(22, 24, 32, 0.6);
            --border-glow: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8b8e99;
            --primary-purple: #8b5cf6;
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* ไฟ Ambient Glow ฉาบพื้นหลัง */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 45%);
        }

        /* Container หลัก */
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* กล่องกระจกฝ้า */
        .auth-box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* เอฟเฟกต์ไล่สีบนขอบบน */
        .auth-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-gradient);
            opacity: 0.8;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: inline-block;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 300;
        }

        /* ปุ่มสลับหน้า Login / Register */
        .tab-switcher {
            display: flex;
            background: var(--input-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 30px;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }

        .tab-btn.active {
            color: white;
        }

        /* แถบเลื่อนใต้ปุ่ม */
        .tab-indicator {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: var(--primary-gradient);
            border-radius: 8px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }

        /* ฟอร์ม */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-purple);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-input::placeholder {
            color: #555;
        }

        /* ลิงก์ลืมรหัสผ่าน */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary-purple);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .forgot-link:hover {
            opacity: 0.8;
        }

        /* ปุ่มหลัก */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* ตัวเลือก หรือ หรือ */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        /* ปุ่ม Social */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ซ่อนฟอร์ม */
        .hidden {
            display: none;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-area">
                <div class="logo-text">FinanceApp</div>
                <div class="auth-subtitle">ยินดีต้อนรับสู่ระบบจัดการการเงิน</div>
            </div>

            <!-- ปุ่มสลับหน้า -->
            <div class="tab-switcher">
                <div class="tab-indicator" id="tabIndicator"></div>
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">เข้าสู่ระบบ</button>
                <button class="tab-btn" id="registerTab" onclick="switchTab('register')">สมัครสมาชิก</button>
            </div>

            <!-- ฟอร์มเข้าสู่ระบบ -->
            <form id="loginForm" class="fade-in" onsubmit="event.preventDefault(); handleAuth('login')">
                <div class="form-group">
                    <label class="form-label">อีเมลหรือชื่อผู้ใช้</label>
                    <input type="text" class="form-input" placeholder="กรอกอีเมลของคุณ" required>
                </div>
                <div class="form-group">
                    <label class="form-label">รหัสผ่าน</label>
                    <input type="password" class="form-input" placeholder="กรอกรหัสผ่าน 6 ตัวขึ้นไป" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" style="accent-color: var(--primary-purple);"> จดจำฉันไว้
                    </label>
                    <a href="#" class="forgot-link">ลืมรหัสผ่าน?</a>
                    <!-- ลิงก์ลืมรหัสผ่าน -->
                </div>
                <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
            </form>

            <!-- ฟอร์มสมัครสมาชิก -->
            <form id="registerForm" class="fade-in hidden" onsubmit="event.preventDefault(); handleAuth('register')">
                <div class="form-group">
                    <label class="form-label">ชื่อเต็ม</label>
                    <input type="text" class="form-input" placeholder="กรอกชื่อ-นามสกุล" required>
                </div>
                <div class="form-group">
                    <label class="form-label">อีเมล</label>
                    <input type="email" class="form-input" placeholder="example@email.com" required>
                </div>
                <div class="ฟอร์ม-group" style="margin-bottom: 20px;">
                    <label class="form-label">รหัสผ่าน</label>
                    <input type="password" class="form-input" placeholder="ตั้งรหัสผ่าน 6 ตัวขึ้นไป" required>
                </div>
                <button type="submit" class="btn-submit">สร้างบัญชี</button>
            </form>

            <!-- แบ่งส่วน -->
            <div class="divider">
                <span>หรือดำเนินการต่อด้วย</span>
            </div>

            <!-- ปุ่ม Social -->
            <div class="social-login">
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.34 1.206-2.98.804-.84 2.103-1.43 3.298-1.45.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.427-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.889.06 4.384 2.19-.113.07-2.425 1.43-2.425 4.34 0 3.64 3.158 4.95 3.158 4.95z"/></svg>
                    Apple
                </button>
            </div>
        </div>
    </div>

    <script>
        // สคริปต์สลับหน้า
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const tabIndicator = document.getElementById('tabIndicator');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                tabIndicator.style.transform = 'translateX(0)';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                tabIndicator.style.transform = 'translateX(100%)';
            }
        }

        // สคริปต์จำลองการกดปุ่ม
        function handleAuth(type) {
            if(type === 'login') {
                alert('เข้าสู่ระบบสำเร็จ! (กำลังไปหน้าเว็บหลัก)');
            } else {
                alert('สมัครสมาชิกสำเร็จ! (กรุณาเข้าสู่ระบบ)');
                switchTab('login');
            }
        }
    </script>

</body>
</html>
