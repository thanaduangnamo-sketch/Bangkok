<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECK INTER - Modern Speed Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 27, 34, 0.75);
      --yellow-primary: #ffe600;
      --yellow-glow: rgba(255, 230, 0, 0.35);
      --text-main: #ffffff;
      --text-sub: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 230, 0, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 230, 0, 0.03) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .header-title {
      font-size: 2.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--yellow-primary);
      text-shadow: 0 0 15px var(--yellow-glow);
      margin-bottom: 25px;
      text-align: center;
    }

    .gauge-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 30px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gauge-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .gauge-bg {
      fill: none;
      stroke: #1f242d;
      stroke-width: 12;
    }

    .gauge-progress {
      fill: none;
      stroke: var(--yellow-primary);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 691;
      stroke-dashoffset: 691;
      transition: stroke-dashoffset 0.3s ease;
      filter: drop-shadow(0 0 8px var(--yellow-primary));
    }

    .gauge-data {
      position: absolute;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .speed-val {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .speed-unit {
      font-size: 1rem;
      color: var(--yellow-primary);
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 230, 0, 0.15);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: border-color 0.3s ease;
    }

    .stat-card:hover {
      border-color: var(--yellow-primary);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-val {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--yellow-primary);
    }

    .btn-start {
      background: linear-gradient(135deg, #ffe600 0%, #b3a200 100%);
      color: #000;
      border: none;
      padding: 16px 45px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px var(--yellow-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 230, 0, 0.6);
    }

    .btn-start:disabled {
      background: #333;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 600px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1 class="header-title">CHECK INTER (Network Checker)</h1>

  <!-- Speedometer Display -->
  <div class="gauge-container">
    <svg class="gauge-svg" viewBox="0 0 240 240">
      <circle class="gauge-bg" cx="120" cy="120" r="110"></circle>
      <circle class="gauge-progress" id="progressCircle" cx="120" cy="120" r="110"></circle>
    </svg>
    <div class="gauge-data">
      <span class="speed-val" id="speedDisplay">0.0</span>
      <span class="speed-unit">Mbps</span>
    </div>
  </div>

  <!-- Status Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">PING</div>
      <div class="stat-val" id="pingDisplay">-- ms</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">JITTER</div>
      <div class="stat-val" id="jitterDisplay">-- ms</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">DOWNLOAD</div>
      <div class="stat-val" id="downloadDisplay">-- Mbps</div>
    </div>
  </div>

  <button class="btn-start" id="startBtn" onclick="startTest()">START CHECK INTER</button>

  <script>
    const maxSpeed = 100; // ความเร็วสูงสุดของสเกลวงกลม (Mbps)
    const circumference = 2 * Math.PI * 110; // เส้นรอบวง r=110

    function setGaugeSpeed(speed) {
      const circle = document.getElementById('progressCircle');
      const speedText = document.getElementById('speedDisplay');
      
      const clampedSpeed = Math.min(Math.max(speed, 0), maxSpeed);
      const offset = circumference - (clampedSpeed / maxSpeed) * circumference;
      
      circle.style.strokeDashoffset = offset;
      speedText.innerText = speed.toFixed(1);
    }

    async function measurePing() {
      const pings = [];
      for (let i = 0; i < 4; i++) {
        const start = performance.now();
        try {
          await fetch('https://www.google.com/favicon.ico?t=' + Date.now() + Math.random(), { mode: 'no-cors', cache: 'no-store' });
          pings.push(performance.now() - start);
        } catch (e) {}
      }
      
      if (pings.length === 0) return { avg: '--', jitter: '--' };
      
      const avgPing = pings.reduce((a, b) => a + b) / pings.length;
      let jitterSum = 0;
      for (let i = 0; i < pings.length - 1; i++) {
        jitterSum += Math.abs(pings[i] - pings[i+1]);
      }
      const jitter = pings.length > 1 ? jitterSum / (pings.length - 1) : 0;
      
      return { avg: Math.round(avgPing), jitter: Math.round(jitter) };
    }

    async function measureDownload() {
      const testFile = 'https://upload.wikimedia.org/wikipedia/commons/3/3d/LARGE_elevation.jpg';
      const startTime = performance.now();
      
      try {
        const response = await fetch(testFile + '?t=' + Date.now(), { cache: 'no-store' });
        const reader = response.body.getReader();
        let loaded = 0;
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          loaded += value.length;
          
          const currentTime = performance.now();
          const duration = (currentTime - startTime) / 1000;
          if (duration > 0) {
            const currentMbps = (loaded * 8) / duration / 1024 / 1024;
            setGaugeSpeed(currentMbps);
          }
        }
        
        const finalDuration = (performance.now() - startTime) / 1000;
        return ((loaded * 8) / finalDuration / 1024 / 1024).toFixed(2);
      } catch (err) {
        return null;
      }
    }

    async function startTest() {
      const btn = document.getElementById('startBtn');
      const pingEl = document.getElementById('pingDisplay');
      const jitterEl = document.getElementById('jitterDisplay');
      const downloadEl = document.getElementById('downloadDisplay');

      btn.disabled = true;
      setGaugeSpeed(0);
      pingEl.innerText = '...';
      jitterEl.innerText = '...';
      downloadEl.innerText = '...';

      // 1. วัด Ping และ Jitter
      const { avg, jitter } = await measurePing();
      pingEl.innerText = `${avg} ms`;
      jitterEl.innerText = `${jitter} ms`;

      // 2. วัด Download Speed แบบ Real-time Gauge
      const finalSpeed = await measureDownload();
      if (finalSpeed) {
        downloadEl.innerText = `${finalSpeed} Mbps`;
        setGaugeSpeed(parseFloat(finalSpeed));
      } else {
        downloadEl.innerText = 'Error';
        setGaugeSpeed(0);
      }

      btn.disabled = false;
    }
  </script>

</body>
</html>
