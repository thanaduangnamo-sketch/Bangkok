<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skey Shop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Inter',sans-serif;background:#09090b;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px 32px;transition:.25s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.15);border-top-color:#a1a1aa;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
.ver{font-size:10.5px;font-family:'SF Mono',Monaco,Consolas,monospace;color:#a1a1aa;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);letter-spacing:.01em;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-btn{font-size:11px;color:#71717a;background:none;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 14px;cursor:pointer;transition:.2s;font-family:inherit;font-weight:600}
.prev-btn:hover{color:#fff;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
</style>
</head>
<body>

<!-- มุมซ้ายบน -->
<div class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-4" style="background:linear-gradient(180deg,rgba(9,9,11,.9),transparent)">
    <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center font-black text-xs text-black">SK</div>
        <span class="text-sm font-bold text-white/80">Skey Shop</span>
    </div>
    <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-500" style="box-shadow:0 0 8px #22c55e80"></div>
        <span class="text-[11px] text-zinc-500 font-medium">Online</span>
    </div>
</div>

<!-- ตรงกลาง -->
<main class="flex-1 flex items-center justify-center px-4">
    <div class="card fade-up max-w-md w-full">

        <!-- หัว Roblox -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-white/[.07] border border-white/10 rounded-xl flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h20M8 4v16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <h2 class="text-base font-extrabold text-white">Roblox</h2>
        </div>

        <!-- Windows -->
        <div class="p-4 rounded-2xl bg-white/[.03] border border-white/[.06] mb-3">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 5.5L12 2l9 3.5v13L12 22l-9-3.5v-13z" stroke="#0078d4" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 2v20M3 5.5l9 3.5 9-3.5" stroke="#0078d4" stroke-width="1.5" stroke-linejoin="round"/></svg>
                    <div class="min-w-0">
                        <p class="text-sm font-bold text-white">Windows</p>
                        <p class="text-[10px] text-zinc-600" id="winTime"><span class="spinner"></span></p>
                    </div>
                </div>
                <span class="ver shrink-0" id="winVer"><span class="spinner"></span></span>
            </div>
            <div class="mt-3 pt-3 border-t border-white/[.05] flex justify-end">
                <button class="prev-btn">Download Previous Version</button>
            </div>
        </div>

        <!-- Mac -->
        <div class="p-4 rounded-2xl bg-white/[.03] border border-white/[.06]">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#a1a1aa" stroke-width="1.5"/><path d="M9 3c0 2.5-2 4-6 4M15 3c0 2.5 2 4 6 4M9 21c0-2.5-2-4-6-4M15 21c0-2.5 2-4 6-4" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <div class="min-w-0">
                        <p class="text-sm font-bold text-white">Mac</p>
                        <p class="text-[10px] text-zinc-600" id="macTime"><span class="spinner"></span></p>
                    </div>
                </div>
                <span class="ver shrink-0" id="macVer"><span class="spinner"></span></span>
            </div>
            <div class="mt-3 pt-3 border-t border-white/[.05] flex justify-end">
                <button class="prev-btn">Download Previous Version</button>
            </div>
        </div>

    </div>
</main>

<script>
async function getVersion(platform) {
    try {
        const r = await fetch('https://clientsettings.roblox.com/v2/client-version/' + platform, { cache: 'no-store' });
        if (!r.ok) throw 0;
        const d = await r.json();
        return { ver: d.versionNumber || d.version || null, time: d.clientVersionUploadTime || null };
    } catch(e) { return null; }
}

function fmtTime(iso) {
    if (!iso) return 'ไม่พบข้อมูลเวลา';
    try {
        const d = new Date(iso);
        return 'Last Updated: ' + d.toLocaleDateString('en-US', { month:'2-digit', day:'2-digit', year:'numeric' }) +
               ', ' + d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true }) + ' UTC';
    } catch(e) { return iso; }
}

(async function() {
    const [w, m] = await Promise.all([getVersion('Windows'), getVersion('Mac')]);

    if (w) {
        document.getElementById('winVer').textContent = 'version - ' + (w.ver || '?');
        document.getElementById('winTime').textContent = fmtTime(w.time);
    } else {
        document.getElementById('winVer').textContent = '—';
        document.getElementById('winTime').textContent = 'ไม่สามารถดึงข้อมูล';
    }

    if (m) {
        document.getElementById('macVer').textContent = 'version - ' + (m.ver || '?');
        document.getElementById('macTime').textContent = fmtTime(m.time);
    } else {
        document.getElementById('macVer').textContent = '—';
        document.getElementById('macTime').textContent = 'ไม่สามารถดึงข้อมูล';
    }
})();
</script>
</body>
</html>
