<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งเตือนหุ้น & แผ่นดินไหว Discord — Stock & Disaster Alert</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50' y='68' font-size='45' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif;background:#030712;color:#fff;min-height:100vh;overflow-x:hidden}
::selection{background:#f59e0b;color:#000}

/* Background Aurora Visual Effects */
.bg-container{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora-1{position:absolute;top:-10%;left:-10%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(245,158,11,0.18) 0%,rgba(0,0,0,0) 70%);filter:blur(80px);animation:float1 18s ease-in-out infinite alternate}
.aurora-2{position:absolute;bottom:-20%;right:-10%;width:70vw;height:70vw;background:radial-gradient(circle,rgba(99,102,241,0.15) 0%,rgba(0,0,0,0) 70%);filter:blur(100px);animation:float2 22s ease-in-out infinite alternate}
.aurora-3{position:absolute;top:30%;right:20%;width:40vw;height:40vw;background:radial-gradient(circle,rgba(239,68,68,0.12) 0%,rgba(0,0,0,0) 70%);filter:blur(90px);animation:float1 14s ease-in-out infinite alternate-reverse}

@keyframes float1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(8%,10%) scale(1.1)}}
@keyframes float2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-10%,-8%) scale(1.15)}}

/* Dot Grid Background Pattern */
.bg-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.07) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%)}

/* Premium Glassmorphism */
.glass-panel{background:rgba(17,24,39,0.55);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 20px 50px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1)}
.glass-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
.glass-card:hover{border-color:rgba(245,158,11,0.3);transform:translateY(-2px)}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .7s cubic-bezier(.16,1,.3,1) both}

.temp-big{font-size:clamp(72px,15vw,110px);font-weight:800;line-height:1;letter-spacing:-.04em;background:linear-gradient(180deg,#ffffff 30%,rgba(255,255,255,0.6) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.detail-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:12px;color:rgba(255,255,255,.45);font-weight:500}
.detail-val{font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}

.hour-bar{width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.hour-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#f59e0b,#fbbf24);transition:width 1s ease}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite}
.spin-active{animation:spin .6s linear infinite}

.search-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;backdrop-filter:blur(12px);transition:.2s}
.search-box:focus{outline:none;border-color:rgba(245,158,11,0.5);box-shadow:0 0 20px rgba(245,158,11,0.15)}
.search-box::placeholder{color:#6b7280}

@keyframes pulseGlow{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(0.95)}}
.pulse-glow{animation:pulseGlow 2s infinite ease-in-out}
</style>
</head>
<body>

<!-- Dynamic Background -->
<div class="bg-container">
    <div class="aurora-1"></div>
    <div class="aurora-2"></div>
    <div class="aurora-3"></div>
    <div class="bg-grid"></div>
</div>

<div class="relative z-10 min-h-screen flex flex-col">

    <!-- Header Controls -->
    <header class="flex items-center justify-between px-5 sm:px-10 py-6 fade-up">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-xl flex items-center justify-center font-black text-xs text-black shadow-lg shadow-amber-500/20">ST</div>
            <div>
                <span class="text-sm font-bold tracking-wide text-white block leading-none">Stock & Quake Alert</span>
                <span class="text-[10px] text-zinc-500 font-medium">Real-time Dashboard</span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="text-right hidden sm:block">
                <div class="text-[11px] text-zinc-300 font-semibold" id="dateDisplay">--/--/----</div>
                <div class="text-[10px] text-zinc-500 font-medium flex items-center justify-end gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="clockDisplay">--:--:--</span>
                </div>
            </div>

            <button onclick="manualRefresh()" id="refreshBtn" title="อัปเดตข้อมูล & ส่ง Discord ทันที" class="glass-card p-2.5 rounded-xl hover:bg-white/10 active:scale-95 transition flex items-center justify-center group">
                <svg id="refreshIcon" class="text-zinc-400 group-hover:text-amber-400 transition" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Search Form -->
    <div class="px-5 sm:px-8 mb-4 fade-up" style="animation-delay:.1s">
        <form onsubmit="doSearch(event)" class="max-w-md mx-auto flex gap-2">
            <input id="searchInput" type="text" placeholder="ค้นหาเมือง เช่น กรุงเทพ, Tokyo, London..." class="search-box flex-1 px-4 py-3 rounded-2xl text-sm font-medium">
            <button type="submit" id="searchBtn" class="bg-amber-500 text-black font-bold px-5 py-3 rounded-2xl text-sm hover:bg-amber-400 active:scale-95 transition shadow-lg shadow-amber-500/20 flex items-center gap-2 shrink-0">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="5"/><path d="m10.5 10.5 3 3"/></svg>
            </button>
        </form>
    </div>

    <!-- Status Banner -->
    <div class="px-5 sm:px-8 mb-5 fade-up" style="animation-delay:.12s">
        <div class="max-w-2xl mx-auto rounded-2xl bg-amber-950/20 border border-amber-500/20 backdrop-blur-md px-4 py-3 flex items-center justify-between text-[11px] text-amber-200/90 shadow-lg">
            <div class="flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span>ระบบรายงานอัตโนมัติเข้า Discord (แท็ก @everyone เฉพาะเหตุแผ่นดินไหวใหญ่)</span>
            </div>
            <div class="font-mono text-amber-400 font-bold bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20" id="webhookTimer">รอบต่อไป: 60:00</div>
        </div>
    </div>

    <!-- Earthquake Alert -->
    <div class="px-5 sm:px-8 mb-6 fade-up" style="animation-delay:.15s">
        <div class="max-w-2xl mx-auto rounded-2xl border border-red-500/20 bg-red-950/15 backdrop-blur-md p-4 text-xs shadow-xl" id="quakeBox">
            <div class="flex items-center justify-between mb-2.5 pb-2 border-b border-red-500/10">
                <div class="flex items-center gap-2 font-bold text-red-400">
                    <span class="w-2 h-2 rounded-full bg-red-500 pulse-glow"></span>
                    <span>ศูนย์เฝ้าระวังแผ่นดินไหวโลก (USGS Real-time)</span>
                </div>
                <span class="text-[10px] text-zinc-400 font-mono" id="quakeLastUpdate">อัปเดตล่าสุด: --:--</span>
            </div>
            <div id="quakeContent" class="text-zinc-300 leading-relaxed">
                กำลังดึงข้อมูลแผ่นดินไหวล่าสุด...
            </div>
        </div>
    </div>

    <!-- Weather Content -->
    <div class="flex-1 px-5 sm:px-8 pb-12" id="content">
        <div class="flex flex-col items-center justify-center py-32 gap-3">
            <div class="spinner"></div>
            <p class="text-xs text-zinc-500 font-medium">กำลังโหลดข้อมูลสภาพอากาศ...</p>
        </div>
    </div>

</div>

<script>
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1541796417025351743/WWiN2oYSEHZHAG81RvyynyxhNZHbXa7mHR2Oc-9_u651BGY4yXrP0KhxzTNdaSnPjfBo";

let lastLat = 13.7563;
let lastLon = 100.5018;
let lastCityName = 'กรุงเทพมหานคร';
let lastCountryCode = 'TH';
let latestWeatherData = null;
let latestQuakeData = null;

// กำหนดระยะเวลาวนรอบ (3600 วินาที = 1 ชั่วโมง)
const TOTAL_INTERVAL_SECONDS = 3600;
let nextUpdateSeconds = TOTAL_INTERVAL_SECONDS;

function updateClock() {
    const now = new Date();
    document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('th-TH');
    document.getElementById('dateDisplay').textContent = now.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}
setInterval(updateClock, 1000);
updateClock();

// ลูปนับถอยหลังทุก 1 วินาที และเรียกทำงานทันทีเมื่อครบ 1 ชม.
setInterval(async () => {
    nextUpdateSeconds--;
    if (nextUpdateSeconds <= 0) {
        nextUpdateSeconds = TOTAL_INTERVAL_SECONDS;
        await autoTriggerUpdate();
    }
    updateTimerUI();
}, 1000);

function updateTimerUI() {
    const mins = Math.floor(nextUpdateSeconds / 60).toString().padStart(2, '0');
    const secs = (nextUpdateSeconds % 60).toString().padStart(2, '0');
    document.getElementById('webhookTimer').textContent = `รอบต่อไป: ${mins}:${secs}`;
}

async function autoTriggerUpdate() {
    await Promise.all([
        loadQuakeAlert(),
        fetchWeatherByCoords(lastLat, lastLon, lastCityName, lastCountryCode)
    ]);
    await sendDiscordNotification();
}

async function loadQuakeAlert() {
    const quakeContent = document.getElementById('quakeContent');
    const quakeLastUpdate = document.getElementById('quakeLastUpdate');
    
    try {
        const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
        const data = await res.json();
        
        if (data.features && data.features.length > 0) {
            const latest = data.features[0];
            const mag = parseFloat(latest.properties.mag.toFixed(1));
            const place = latest.properties.place || 'ไม่ระบุพื้นที่';
            const time = new Date(latest.properties.time).toLocaleString('th-TH', {
                dateStyle: 'short',
                timeStyle: 'medium'
            });
            const depth = latest.geometry.coordinates[2];

            latestQuakeData = { place, mag, depth, time };

            let alertLevel = 'text-amber-400';
            if (mag >= 5.0) alertLevel = 'text-red-400 font-extrabold';

            const now = new Date();
            quakeLastUpdate.textContent = `อัปเดต: ${now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}`;
            
            quakeContent.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                        <span class="font-semibold text-white">ตำแหน่งที่เกิด:</span> <span class="text-zinc-200">${esc(place)}</span>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <span>ขนาด: <strong class="${alertLevel}">${mag} M</strong></span>
                        <span class="text-zinc-400">ลึก: ${depth} กม.</span>
                    </div>
                </div>
                <div class="mt-1 text-[11px] text-zinc-400">
                    ⏱️ วันเวลาที่เกิดเหตุ: <span class="text-zinc-300">${time}</span>
                </div>
            `;
        } else {
            latestQuakeData = null;
            quakeContent.innerHTML = 'ไม่มีรายงานเหตุแผ่นดินไหวรุนแรงใน 24 ชั่วโมงที่ผ่านมา';
        }
    } catch (e) {
        quakeContent.innerHTML = '<span class="text-zinc-500">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์แผ่นดินไหวได้</span>';
    }
}

function parseWMOCode(code, isDay = 1) {
    if (code === 0) return { icon: isDay ? '☀️' : '🌙', text: isDay ? 'ท้องฟ้าแจ่มใส' : 'ท้องฟ้าโปร่ง' };
    if (code >= 1 && code <= 3) return { icon: isDay ? '⛅' : '🌙', text: 'มีเมฆบางส่วน' };
    if (code === 45 || code === 48) return { icon: '🌫️', text: 'หมอกหนา' };
    if (code >= 51 && code <= 55) return { icon: '🌦️', text: 'ฝนตกเล็กน้อย' };
    if (code >= 61 && code <= 65) return { icon: '🌧️', text: 'ฝนตก' };
    if (code >= 71 && code <= 77) return { icon: '🌨️', text: 'หิมะตก' };
    if (code >= 80 && code <= 82) return { icon: '🌧️', text: 'ฝนตกหนัก' };
    if (code >= 95) return { icon: '⛈️', text: 'พายุฝนฟ้าคะนอง' };
    return { icon: '🌡️', text: 'สภาพอากาศทั่วไป' };
}

async function sendDiscordNotification() {
    if (!latestWeatherData) return;

    const current = latestWeatherData.current;
    const daily = latestWeatherData.daily;
    const info = parseWMOCode(current.weather_code, current.is_day);
    const nowStr = new Date().toLocaleString('th-TH', { dateStyle: 'long', timeStyle: 'medium' });

    let quakeMsg = "ไม่มีรายงานเหตุการณ์รุนแรง";
    let isSevereQuake = false;

    if (latestQuakeData) {
        quakeMsg = `🚨 **${latestQuakeData.place}**\n• ขนาด: **${latestQuakeData.mag} M** | ลึก: ${latestQuakeData.depth} กม.\n• เวลา: ${latestQuakeData.time}`;
        if (latestQuakeData.mag >= 5.0) {
            isSevereQuake = true;
        }
    }

    let mentionText = "📢 **รายงานอัปเดตสถานการณ์ประจำชั่วโมง**";
    let embedColor = 16753920; 

    if (isSevereQuake) {
        mentionText = "@everyone 🚨 **[แจ้งเตือนฉุกเฉิน] ตรวจพบเหตุแผ่นดินไหวรุนแรง!**";
        embedColor = 15548927; 
    }

    const payload = {
        content: mentionText,
        username: "Stock & Quake Alert Bot",
        avatar_url: "https://cdn-icons-png.flaticon.com/512/2534/2534204.png",
        embeds: [
            {
                title: isSevereQuake ? `⚠️ รายงานแผ่นดินไหวขนาดใหญ่ & สภาพอากาศ: ${lastCityName}` : `📈 รายงานอัปเดตข้อมูลสภาพแวดล้อม: ${lastCityName}`,
                description: `ประจำวันที่ **${nowStr}**\nสภาวะปัจจุบัน: **${info.text} ${info.icon}**`,
                color: embedColor,
                fields: [
                    { name: "🌡️ อุณหภูมิปัจจุบัน", value: `**${Math.round(current.temperature_2m)}°C** (รู้สึกเหมือน ${Math.round(current.apparent_temperature)}°C)`, inline: true },
                    { name: "💧 ความชื้น", value: `${current.relative_humidity_2m}%`, inline: true },
                    { name: "💨 ความเร็วลม", value: `${current.wind_speed_10m} km/h`, inline: true },
                    { name: "⏲️ ความกดอากาศ", value: `${Math.round(current.surface_pressure)} hPa`, inline: true },
                    { name: "🌅 พระอาทิตย์ขึ้น", value: new Date(daily.sunrise[0]).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}), inline: true },
                    { name: "🌇 พระอาทิตย์ตก", value: new Date(daily.sunset[0]).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}), inline: true },
                    { name: "🌍 พิกัดพื้นที่", value: `${lastLat.toFixed(2)}, ${lastLon.toFixed(2)}`, inline: true },
                    { name: "📌 รายงานแผ่นดินไหวล่าสุด (USGS)", value: quakeMsg, inline: false }
                ],
                footer: { text: "Stock & Disaster Auto Notification System" }
            }
        ]
    };

    try {
        await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } catch (e) {
        console.error("ส่ง Discord ไม่สำเร็จ:", e);
    }
}

async function manualRefresh() {
    const icon = document.getElementById('refreshIcon');
    icon.classList.add('spin-active');
    
    await autoTriggerUpdate();
    
    // รีเซ็ตตัวนับเวลากลับเป็น 3,600 วินาที เมื่อกดปุ่มอัปเดตด้วยตนเอง
    nextUpdateSeconds = TOTAL_INTERVAL_SECONDS;
    updateTimerUI();
    
    setTimeout(() => icon.classList.remove('spin-active'), 600);
}

async function doSearch(e) {
    if (e) e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    const btn = document.getElementById('searchBtn');
    btn.innerHTML = '<div class="spinner" style="width:15px;height:15px;border-width:2px"></div>';
    btn.disabled = true;

    try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=th&format=json`).then(r => r.json());
        
        if (!geoRes.results || geoRes.results.length === 0) {
            document.getElementById('content').innerHTML = errorHTML('ไม่พบข้อมูลเมืองที่คุณค้นหา');
        } else {
            const place = geoRes.results[0];
            lastLat = place.latitude;
            lastLon = place.longitude;
            lastCityName = place.name + (place.admin1 ? `, ${place.admin1}` : '');
            lastCountryCode = place.country_code || 'TH';
            
            await autoTriggerUpdate();
            nextUpdateSeconds = TOTAL_INTERVAL_SECONDS;
            updateTimerUI();
        }
    } catch(err) {
        document.getElementById('content').innerHTML = errorHTML('เกิดข้อผิดพลาดในการเชื่อมต่อ');
    }

    btn.innerHTML = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="5"/><path d="m10.5 10.5 3 3"/></svg>';
    btn.disabled = false;
}

async function fetchWeatherByCoords(lat, lon, cityName, countryCode) {
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        latestWeatherData = data;
        render(data, cityName, countryCode, lat, lon);
    } catch(e) {
        document.getElementById('content').innerHTML = errorHTML('ไม่สามารถดึงข้อมูลได้');
    }
}

function render(data, city, cc, lat, lon) {
    const current = data.current;
    const daily = data.daily;
    const hourly = data.hourly;
    
    const info = parseWMOCode(current.weather_code, current.is_day);
    const temp = Math.round(current.temperature_2m);
    const feels = Math.round(current.apparent_temperature);
    const hum = current.relative_humidity_2m;
    const wind = current.wind_speed_10m;
    const pressure = Math.round(current.surface_pressure);
    
    const sunrise = daily.sunrise[0] ? new Date(daily.sunrise[0]).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '--:--';
    const sunset = daily.sunset[0] ? new Date(daily.sunset[0]).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '--:--';

    const nowIndex = new Date().getHours();
    const hourlySlice = hourly.time.slice(nowIndex, nowIndex + 24);
    const tempsSlice = hourly.temperature_2m.slice(nowIndex, nowIndex + 24);
    const maxTemp = Math.max(...tempsSlice);
    const minTemp = Math.min(...tempsSlice);
    const tempRange = maxTemp - minTemp || 1;

    let hourlyHTML = hourlySlice.map((t, i) => {
        const idx = nowIndex + i;
        const code = hourly.weather_code[idx];
        const isDay = hourly.is_day[idx];
        const hTemp = Math.round(hourly.temperature_2m[idx]);
        const hInfo = parseWMOCode(code, isDay);
        const pct = Math.max(0, Math.min(100, ((hTemp - minTemp) / tempRange) * 100));
        const hourLabel = new Date(t).getHours().toString().padStart(2, '0') + ':00';

        return `<div class="flex flex-col items-center gap-2 min-w-[56px] glass-card p-3 rounded-2xl">
            <span class="text-[10px] text-zinc-400 font-medium">${hourLabel}</span>
            <span class="text-xl my-0.5">${hInfo.icon}</span>
            <span class="text-xs font-bold text-white">${hTemp}°</span>
            <div class="hour-bar w-full mt-1"><div class="hour-fill" style="width:${pct}%"></div></div>
        </div>`;
    }).join('');

    const dayNames = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    let dailyHTML = daily.time.slice(0, 5).map((d, i) => {
        const dt = new Date(d);
        const hi = Math.round(daily.temperature_2m_max[i]);
        const lo = Math.round(daily.temperature_2m_min[i]);
        const ci = parseWMOCode(daily.weather_code[i], 1);
        const dayName = i === 0 ? 'วันนี้' : dayNames[dt.getDay()];

        return `<div class="flex flex-col items-center gap-2 min-w-[60px] glass-card p-3 rounded-2xl">
            <span class="text-[10px] text-zinc-400 font-medium">${dayName}</span>
            <span class="text-2xl my-0.5">${ci.icon}</span>
            <span class="text-xs font-bold text-white">${hi}°</span>
            <span class="text-[10px] text-zinc-500">${lo}°</span>
        </div>`;
    }).join('');

    document.getElementById('content').innerHTML = `
    <div class="max-w-2xl mx-auto fade-up">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 mb-3">
                <img src="https://flagcdn.com/w40/${cc.toLowerCase()}.png" alt="" class="w-4 h-3 rounded-sm object-cover" onerror="this.style.display='none'">
                <span class="text-xs font-semibold text-zinc-300">${esc(city)}</span>
            </div>
            <p class="text-xs text-amber-400 font-medium mb-4 tracking-wide uppercase">${info.text}</p>

            <div class="inline-block mb-1">
                <span class="temp-big">${temp}°</span>
            </div>
            <p class="text-xs text-zinc-400 font-medium">รู้สึกเหมือน ${feels}°C</p>
        </div>

        <div class="glass-panel rounded-3xl p-6 mb-6 fade-up" style="animation-delay:.15s">
            <div class="detail-row"><span class="detail-label">ความชื้น</span><span class="detail-val">${hum}%</span></div>
            <div class="detail-row"><span class="detail-label">ความเร็วลม</span><span class="detail-val">${wind} km/h</span></div>
            <div class="detail-row"><span class="detail-label">ความกดอากาศ</span><span class="detail-val">${pressure} hPa</span></div>
            <div class="detail-row"><span class="detail-label">พระอาทิตย์ขึ้น</span><span class="detail-val">${sunrise}</span></div>
            <div class="detail-row"><span class="detail-label">พระอาทิตย์ตก</span><span class="detail-val">${sunset}</span></div>
            <div class="detail-row"><span class="detail-label">พิกัด</span><span class="detail-val font-mono text-[11px] text-amber-400/80">${lat.toFixed(2)}, ${lon.toFixed(2)}</span></div>
        </div>

        <div class="glass-panel rounded-3xl p-6 mb-6 fade-up" style="animation-delay:.25s">
            <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-4">24 ชั่วโมงข้างหน้า</h3>
            <div class="flex gap-2 overflow-x-auto pb-2" style="-webkit-overflow-scrolling:touch;scrollbar-width:none">${hourlyHTML}</div>
        </div>

        <div class="glass-panel rounded-3xl p-6 fade-up" style="animation-delay:.35s">
            <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-4">5 วันข้างหน้า</h3>
            <div class="flex gap-2 overflow-x-auto pb-2" style="-webkit-overflow-scrolling:touch;scrollbar-width:none">${dailyHTML}</div>
        </div>
    </div>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function errorHTML(msg) {
    return `<div class="flex flex-col items-center justify-center py-24 text-center fade-up">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" class="text-red-500/40 mb-4"><circle cx="20" cy="20" r="16"/><path d="M20 13v7M20 24v.01"/></svg>
        <p class="text-sm font-semibold text-zinc-400">${esc(msg)}</p>
    </div>`;
}

(async function init() {
    try {
        const ipRes = await fetch('https://ipapi.co/json/').then(r => r.json());
        if (ipRes && ipRes.latitude && ipRes.longitude) {
            lastLat = ipRes.latitude;
            lastLon = ipRes.longitude;
            lastCityName = ipRes.city || ipRes.region || 'ตำแหน่งปัจจุบัน';
            lastCountryCode = ipRes.country_code || 'TH';
        }
    } catch (e) {}

    await autoTriggerUpdate();
    nextUpdateSeconds = TOTAL_INTERVAL_SECONDS;
    updateTimerUI();
})();
</script>
</body>
</html>
