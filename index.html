<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Details - Light Mode</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc; /* พื้นหลังสีขาวอมเทาอ่อน สบายตา */
            color: #0f172a;
        }

        /* Glassmorphic White Card Styling */
        .white-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease-in-out;
        }

        .white-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border-color: #cbd5e1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-4xl w-full space-y-4">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4 text-blue-500"></i> รายละเอียดสภาพอากาศ (ธีมสีขาว)
        </h3>

        <!-- Weather Details Grid - White Theme -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            
            <!-- ความชื้น -->
            <div class="white-card rounded-2xl p-5 flex items-center gap-4">
                <div class="p-3.5 bg-blue-50 text-blue-600 rounded-xl border border-blue-100">
                    <i data-lucide="droplets" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="text-xs font-medium text-slate-400">ความชื้น</div>
                    <div class="text-xl font-bold text-slate-800">74 %</div>
                </div>
            </div>

            <!-- ความเร็วลม -->
            <div class="white-card rounded-2xl p-5 flex items-center gap-4">
                <div class="p-3.5 bg-teal-50 text-teal-600 rounded-xl border border-teal-100">
                    <i data-lucide="wind" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="text-xs font-medium text-slate-400">ความเร็วลม</div>
                    <div class="text-xl font-bold text-slate-800">4.5 km/h</div>
                </div>
            </div>

            <!-- ความกดอากาศ -->
            <div class="white-card rounded-2xl p-5 flex items-center gap-4">
                <div class="p-3.5 bg-purple-50 text-purple-600 rounded-xl border border-purple-100">
                    <i data-lucide="gauge" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="text-xs font-medium text-slate-400">ความกดอากาศ</div>
                    <div class="text-xl font-bold text-slate-800">1007 hPa</div>
                </div>
            </div>

            <!-- ดัชนี UV ปลอม ๆ -->
            <div class="white-card rounded-2xl p-5 flex items-center gap-4 border-amber-200 bg-amber-50/30">
                <div class="p-3.5 bg-amber-100 text-amber-600 rounded-xl border border-amber-200 animate-pulse">
                    <i data-lucide="sun-medium" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-xs font-medium text-slate-400">ดัชนี UV</span>
                        <span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-semibold">ปลอม</span>
                    </div>
                    <div class="text-xl font-bold text-amber-600">8.5 <span class="text-xs font-normal text-slate-500">(สูงมาก)</span></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
