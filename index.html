<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAF SHOP - หน้าแรก</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        :root {
            --primary-purple: #6c5ce7;
            --secondary-purple: #a29bfe;
            --bg-dark: #0f0c1b;
            --card-bg: #1e1b2e;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Hero Banner Section */
        .hero-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #2d1b4e, #1e1b2e);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .hero-content {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 280px;
        }

        .hero-image {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            object-fit: cover;
            border: 2px solid var(--secondary-purple);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .hero-text h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .hero-text h1 span {
            color: var(--secondary-purple);
        }

        .hero-text p {
            margin: 0;
            color: #b2bec3;
            font-size: 14px;
        }

        .btn {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .btn:hover {
            background-color: #5b4be2;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hero Banner พร้อมรูปภาพที่รวมเข้ามา -->
        <div class="hero-banner">
            <div class="hero-content">
                <!-- รูปภาพจาก Discord ที่คุณต้องการ -->
                <img src="https://media.discordapp.net/attachments/1537832458282860578/1537837948517617774/Gemini_Generated_Image_texhlatexhlatexh.jfif?ex=6a812772&is=6a7fd5f2&hm=c63cb2358c2e783451f7146b4f172ca0a6031fbdb32d7804c40051323bb2cc67&=&format=webp&width=1024&height=558" 
                     alt="DHAF SHOP Logo" 
                     class="hero-image">
                <div class="hero-text">
                    <h1>ยินดีต้อนรับสู่ <span id="welcomeName">DHAF SHOP</span></h1>
                    <p>ร้านค้าออนไลน์และบริการต่างๆ ยินดีต้อนรับทุกท่านครับ</p>
                </div>
            </div>
            <button class="btn" onclick="switchPage('topup')">เติมเงินซองอังเปา</button>
        </div>
    </div>

    <script>
        function switchPage(page) {
            // ฟังก์ชันตัวอย่างสำหรับการเปลี่ยนหน้าเว็บ
            console.log("Switching to page: " + page);
        }
    </script>

</body>
</html>
