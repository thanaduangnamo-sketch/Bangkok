<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บตัวอย่าง - My Awesome Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <header class="p-5 flex justify-between items-center max-w-5xl mx-auto w-full">
        <h1 class="text-2xl font-bold text-indigo-400">MyBrand</h1>
        <nav class="space-x-4">
            <a href="#about" class="hover:text-indigo-400 transition">เกี่ยวกับ</a>
            <a href="#contact" class="hover:text-indigo-400 transition">ติดต่อ</a>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto text-center px-5 py-20">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-500">
            ยินดีต้อนรับสู่เว็บไซต์ของเรา
        </h2>
        <p class="text-slate-300 text-lg mb-8 leading-relaxed">
            เว็บนี้สร้างด้วย HTML + Tailwind CSS พร้อมสำหรับการนำไป Deploy บน Render, Vercel หรือบริการ Cloud โฮสติ้งอื่นๆ ได้ทันที
        </p>
        
        <div class="flex justify-center gap-4">
            <button id="clickBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition transform hover:-translate-y-1">
                คลิกทดสอบระบบ
            </button>
        </div>

        <div id="resultBox" class="mt-8 p-4 rounded-lg bg-slate-800 text-indigo-300 hidden border border-slate-700">
            🎉 ยินดีด้วย! ระบบ JavaScript บนเว็บของคุณทำงานได้ปกติ
        </div>
    </main>

    <footer class="p-5 text-center text-slate-500 border-t border-slate-800">
        <p>© 2026 MyBrand. All rights reserved.</p>
    </footer>

    <script>
        const button = document.getElementById('clickBtn');
        const resultBox = document.getElementById('resultBox');

        button.addEventListener('click', () => {
            resultBox.classList.toggle('hidden');
        });
    </script>
</body>
</html>
