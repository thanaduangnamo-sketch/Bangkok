<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Tracker Pro & Earthquake Monitoring System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(39, 39, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .temp-huge {
            font-size: 5rem;
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-tab.active {
            color: #fbbf24;
            border-bottom: 2px solid #fbbf24;
        }
        .spin-active {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #fbbf24;
            animation: spin 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Navigation -->
    <header class="border-b border-white/10 sticky top-0 z-50 glass-panel">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚡</span>
                <span class="font-black text-lg tracking-wider text-white">WEATHER<span class="text-amber-400">PRO</span></span>
            </div>

            <nav class="flex gap-6 font-bold text-xs uppercase tracking-widest h-full">
                <button id="tab-weather" onclick="switchTab('weather')" class="nav-tab active px-2 flex items-center gap-2 transition-colors">
                    🌤️ สภาพอากาศ
                </button>
                <button id="tab-quake" onclick="switchTab('quake')" class="nav-tab text-zinc-400 hover:text-white px-2 flex items-center gap-2 transition-colors">
                    🌐 แผ่นดินไหว
                </button>
            </nav>

            <div class="hidden sm:flex items-center gap-4 text-xs font-mono">
                <div class="text-right">
                    <div id="clockDisplay" class="font-bold text-amber-400">00:00:00 น.</div>
                    <div id="dateDisplay" class="text-zinc-500 text-[10px]">--/--/----</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        
        <!-- Search & Control Bar -->
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
            <form onsubmit="doSearch(event)" class="w-full sm:w-96 relative">
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อเมือง เช่น กรุงเทพ, ชลบุรี..." 
                    class="w-full glass-card px-4 py-2.5 rounded-2xl text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400/50 transition-all pr-24">
                <button type="submit" id="searchBtn" class="absolute right-1 top-1 bottom-1 px-4 bg-amber-400 text-black font-bold text-xs rounded-xl hover:bg-amber-300 transition-colors">
                    ค้นหา
                </button>
            </form>

            <button onclick="manualRefresh()" class="w-full sm:w-auto glass-card px-4 py-2.5 rounded-2xl text-xs font-bold text-zinc-300 hover:text-white flex items-center justify-center gap-2 transition-colors">
                <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                อัปเดตข้อมูลตอนนี้
            </button>
        </div>

        <!-- TAB 1: WEATHER -->
        <section id="view-weather" class="tab-content active space-y-6">
            <!-- Quake Alert Banner (ถ้ามีเหตุการณ์เร่งด่วน) -->
            <div id="quakeAlertBanner" class="glass-panel p-4 rounded-2xl border-l-4 border-amber-400 text-xs">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-extrabold text-amber-400 tracking-wider uppercase flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> รายงานแผ่นดินไหวล่าสุด (USGS)
                    </span>
                    <span id="quakeLastUpdate" class="text-[10px] text-zinc-500 font-mono">กำลังโหลด...</span>
                </div>
                <div id="quakeContent" class="text-zinc-300 font-mono">กำลังดึงข้อมูลแผ่นดินไหว...</div>
            </div>

            <!-- Main Weather Display -->
            <div id="content">
                <div class="flex flex-col items-center justify-center py-28 gap-4">
                    <div class="spinner"></div>
                    <p class="text-xs text-zinc-400 font-mono tracking-widest uppercase">Loading Live Weather Data...</p>
                </div>
            </div>
        </section>

        <!-- TAB 2: EARTHQUAKE -->
        <section id="view-quake" class="tab-content">
            <div class="glass-panel p-6 sm:p-8 rounded-3xl space-y-4">
                <div class="flex justify-between items-center border-b border-white/5 pb-4">
                    <div>
                        <h2 class="text-lg font-black text-white">รายชื่อแผ่นดินไหวล่าสุดทั่วโลก (2.5+ M)</h2>
                        <p class="text-xs text-zinc-400">ข้อมูลแบบเรียลไทม์จาก United States Geological Survey (USGS)</p>
                    </div>
                </div>
                <div id="quakeFullList" class="space-y-3">
                    <div class="text-center py-10 text-xs text-zinc-500 font-mono">กำลังโหลดข้อมูลแผ่นดินไหว...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script>
        const DISCORD_UPDATE_WEBHOOK = "https://discord.com/api/webhooks/1542154970202374214/tQdo60ynkw5xbQPhxcIDLFOyoxhh57n0EBLPkOzmATkAWwOZ5-oo_DxMUOGiyUgS05r_";
        const DISCORD_ERROR_WEBHOOK = "https://discord.com/api/webhooks/1542155180869689495/ii9bDvTMISrEvxpbTskKZ-iOW_V7J-8RQnGb7FKQ9A_JZhwuNR33nG3td2Yw6Nv4V9lj";

        let lastLat = 13.08;
        let lastLon = 100.92;
        let lastCityName = 'แหลมฉบัง, ชลบุรี';
        let lastCountryCode = 'TH';

        let latestWeatherData = null;
        let lastWeatherSnapshot = ""; 

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.classList.remove('active');
                el.classList.add('text-zinc-400');
            });

            document.getElementById(`view-${tabName}`).classList.add('active');
            const targetTab = document.getElementById(`tab-${tabName}`);
            targetTab.classList.add('active');
            targetTab.classList.remove('text-zinc-400');
        }

        function formatThaiTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes} น.`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')} น.`;
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ⚡ Auto-Check สภาพอากาศทุกๆ 30 วินาที ⚡
        setInterval(async () => {
            await autoCheckForUpdates();
        }, 30000);

        async function autoCheckForUpdates() {
            await Promise.all([
                loadQuakeAlert(),
                fetchWeatherByCoords(lastLat, lastLon, lastCityName, lastCountryCode, false)
            ]);
        }

        async function sendDiscordError(errorTitle, errorMessage) {
            if (!DISCORD_ERROR_WEBHOOK) return;
            const now = new Date();
            
            const payload = {
                username: "System Error Logger",
                avatar_url: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                embeds: [{
                    title: `🚨 [ERROR DETECTED] ${errorTitle}`,
                    description: `\`\`\`javascript\n${errorMessage}\n\`\`\``,
                    color: 15548997,
                    fields: [
                        { name: "📍 พื้นที่", value: lastCityName, inline: true },
                        { name: "🕒 เวลา", value: `${now.toLocaleDateString('th-TH')} ${formatThaiTime(now)}`, inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(DISCORD_ERROR_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {}
        }

        async function sendDiscordUpdateNotification(isManual = false) {
            if (!latestWeatherData || !DISCORD_UPDATE_WEBHOOK) return;

            const cur = latestWeatherData.current;
            const daily = latestWeatherData.daily;
            const sunriseStr = formatThaiTime(new Date(daily.sunrise[0]));
            const sunsetStr = formatThaiTime(new Date(daily.sunset[0]));
            const uvVal = (cur.uv_index !== undefined && cur.uv_index !== null) ? cur.uv_index.toFixed(1) : '0.0';
            const tempVal = Math.round(cur.temperature_2m);
            const now = new Date();

            const currentSnapshot = `TEMP:${tempVal}|HUM:${cur.relative_humidity_2m}|WIND:${cur.wind_speed_10m}|PRESS:${Math.round(cur.surface_pressure)}|UV:${uvVal}`;

            const isFirstRun = (lastWeatherSnapshot === "");
            const hasChanged = (!isFirstRun && lastWeatherSnapshot !== currentSnapshot);

            if (!isFirstRun && !hasChanged && !isManual) return;
            
            lastWeatherSnapshot = currentSnapshot;

            let titleText = "📢 [UPDATE] รายงานสภาพอากาศประจำวัน";
            let embedColor = 3447003; 

            if (hasChanged) {
                titleText = "⚡ [ALERT] สภาพอากาศ มีการเปลี่ยนแปลง!";
                embedColor = 15548997;
            } else if (isManual) {
                titleText = "🔄 [MANUAL] ผู้ใช้กด Refresh ด้วยตัวเอง";
                embedColor = 1752220;
            }

            const payload = {
                username: "Weather Tracker Pro",
                avatar_url: "https://cdn-icons-png.flaticon.com/512/1163/1163661.png",
                embeds: [{
                    title: titleText,
                    description: `📍 **ตำแหน่ง:** ${lastCityName}\n🕒 **เวลาอัปเดต:** ${now.toLocaleDateString('th-TH')} เวลา ${formatThaiTime(now)}`,
                    color: embedColor,
                    fields: [
                        { name: "🌡️ อุณหภูมิ", value: `\`${tempVal} °C\``, inline: true },
                        { name: "💧 ความชื้น", value: `\`${cur.relative_humidity_2m}%\``, inline: true },
                        { name: "💨 ความเร็วลม", value: `\`${cur.wind_speed_10m} km/h\``, inline: true },
                        { name: "⏲️ ความกดอากาศ", value: `\`${Math.round(cur.surface_pressure)} hPa\``, inline: true },
                        { name: "☀️ ดัชนี UV (ปัจจุบัน)", value: `\`${uvVal}\``, inline: true },
                        { name: "🌅 พระอาทิตย์ขึ้น / ตก", value: `\`${sunriseStr} / ${sunsetStr}\``, inline: true }
                    ],
                    footer: { text: "Real-Time Instant Trigger System" },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(DISCORD_UPDATE_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                sendDiscordError("Webhook Send Failed", err.message || err.toString());
            }
        }

        async function loadQuakeAlert() {
            const quakeContent = document.getElementById('quakeContent');
            const quakeLastUpdate = document.getElementById('quakeLastUpdate');
            
            try {
                const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
                if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to fetch Quake data`);
                
                const data = await res.json();
                
                if (data.features && data.features.length > 0) {
                    const latest = data.features[0];
                    const mag = parseFloat(latest.properties.mag.toFixed(1));
                    const place = latest.properties.place || 'ไม่ระบุพื้นที่';
                    const depth = latest.geometry.coordinates[2];

                    let alertLevel = 'text-amber-400 font-extrabold';
                    if (mag >= 5.0) alertLevel = 'text-rose-400 font-black animate-pulse';

                    const now = new Date();
                    quakeLastUpdate.textContent = `อัปเดต: ${formatThaiTime(now)}`;
                    
                    quakeContent.innerHTML = `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <span class="font-bold text-white">ตำแหน่งล่าสุด:</span> <span class="text-zinc-300">${esc(place)}</span>
                            </div>
                            <div class="flex items-center gap-4 shrink-0 font-mono">
                                <span>ขนาด: <strong class="${alertLevel}">${mag} M</strong></span>
                                <span class="text-zinc-400">ลึก: ${depth} กม.</span>
                            </div>
                        </div>
                    `;

                    let listHTML = data.features.slice(0, 8).map(item => `
                        <div class="glass-card p-4 rounded-2xl flex justify-between items-center">
                            <div>
                                <div class="font-bold text-white">${esc(item.properties.place)}</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">ความลึก: ${item.geometry.coordinates[2]} กม. | เวลา: ${new Date(item.properties.time).toLocaleTimeString('th-TH')} น.</div>
                            </div>
                            <div class="text-base font-black ${item.properties.mag >= 5.0 ? 'text-rose-400' : 'text-amber-400'}">${item.properties.mag.toFixed(1)} M</div>
                        </div>
                    `).join('');
                    document.getElementById('quakeFullList').innerHTML = listHTML;
                }
            } catch (e) {
                sendDiscordError("Quake API Error", e.message || e.toString());
            }
        }

        function parseWMOCode(code, isDay = 1) {
            if (code === 0) return { icon: isDay ? '☀️' : '🌙', text: isDay ? 'ท้องฟ้าแจ่มใส' : 'ท้องฟ้าโปร่ง' };
            if (code >= 1 && code <= 3) return { icon: isDay ? '⛅' : '🌙', text: 'มีเมฆบางส่วน' };
            if (code >= 51 && code <= 65) return { icon: '🌧️', text: 'ฝนตก' };
            if (code >= 95) return { icon: '⛈️', text: 'พายุฝนฟ้าคะนอง' };
            return { icon: '🌤️', text: 'สภาพอากาศทั่วไป' };
        }

        async function fetchWeatherByCoords(lat, lon, cityName, countryCode, showLoader = true) {
            lastLat = lat; 
            lastLon = lon; 
            lastCityName = cityName; 
            lastCountryCode = countryCode;

            const contentDiv = document.getElementById('content');
            if (showLoader) {
                contentDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-28 gap-4">
                        <div class="spinner"></div>
                        <p class="text-xs text-zinc-400 font-mono tracking-widest uppercase">Loading Live Weather Data...</p>
                    </div>
                `;
            }

            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,surface_pressure,wind_speed_10m,uv_index&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
                const res = await fetch(url);
                
                if (!res.ok) throw new Error(`HTTP ${res.status}: Open-Meteo Load Failed`);

                const data = await res.json();
                latestWeatherData = data;
                renderWeatherUI(data, cityName, countryCode);
                await sendDiscordUpdateNotification(false);
            } catch (err) {
                sendDiscordError("Weather Fetch Error", err.message || err.toString());
            }
        }

        function renderWeatherUI(data, cityName, countryCode) {
            const cur = data.current;
            const daily = data.daily;
            const hourly = data.hourly;
            const info = parseWMOCode(cur.weather_code, cur.is_day);

            let hourlyItems = '';
            const nowHourIndex = new Date().getHours();
            for (let i = nowHourIndex; i < nowHourIndex + 12; i++) {
                if (!hourly.time[i]) break;
                const timeObj = new Date(hourly.time[i]);
                const hTimeStr = `${timeObj.getHours().toString().padStart(2, '0')}:00`;
                const hTemp = Math.round(hourly.temperature_2m[i]);
                const hInfo = parseWMOCode(hourly.weather_code[i], 1);

                hourlyItems += `
                    <div class="flex-shrink-0 w-24 glass-card p-4 rounded-2xl text-center space-y-2 border border-white/5">
                        <div class="text-[11px] text-zinc-400 font-mono font-bold">${hTimeStr}</div>
                        <div class="text-3xl my-1">${hInfo.icon}</div>
                        <div class="text-sm font-black text-white font-mono">${hTemp}°C</div>
                    </div>
                `;
            }

            let dailyItems = '';
            const daysArr = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
            for (let i = 0; i < 5; i++) {
                if (!daily.time[i]) break;
                const dObj = new Date(daily.time[i]);
                const dayLabel = i === 0 ? 'วันนี้' : daysArr[dObj.getDay()];
                const dMax = Math.round(daily.temperature_2m_max[i]);
                const dMin = Math.round(daily.temperature_2m_min[i]);
                const dInfo = parseWMOCode(daily.weather_code[i], 1);

                dailyItems += `
                    <div class="flex items-center justify-between py-3 border-b border-white/5 last:border-none">
                        <span class="text-xs font-bold text-zinc-300 w-14">${dayLabel}</span>
                        <span class="text-2xl text-center">${dInfo.icon}</span>
                        <div class="flex items-center gap-2.5 font-mono text-xs text-right">
                            <span class="text-white font-black">${dMax}°</span>
                            <span class="text-zinc-500 font-semibold">${dMin}°</span>
                        </div>
                    </div>
                `;
            }

            const sunriseStr = formatThaiTime(new Date(daily.sunrise[0]));
            const sunsetStr = formatThaiTime(new Date(daily.sunset[0]));
            const uvVal = (cur.uv_index !== undefined && cur.uv_index !== null) ? cur.uv_index.toFixed(1) : '0.0';

            const html = `
                <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 glass-panel p-8 sm:p-10 rounded-3xl flex flex-col justify-between relative overflow-hidden">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="inline-block px-3.5 py-1.5 rounded-full text-[10px] font-black tracking-widest text-amber-400 bg-amber-500/10 border border-amber-500/30 mb-4 uppercase">LIVE WEATHER REPORT</span>
                                <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight">${esc(cityName)}</h1>
                                <p class="text-sm text-zinc-300 font-medium mt-1.5">${info.text}</p>
                            </div>
                            <div class="text-6xl sm:text-7xl filter drop-shadow-lg">${info.icon}</div>
                        </div>

                        <div class="my-8">
                            <div class="temp-huge font-mono">${Math.round(cur.temperature_2m)}°</div>
                            <p class="text-xs text-zinc-400 font-medium mt-2">รู้สึกเหมือน ${Math.round(cur.apparent_temperature)}°C • สูงสุด ${Math.round(daily.temperature_2m_max[0])}°C / ต่ำสุด ${Math.round(daily.temperature_2m_min[0])}°C</p>
                        </div>

                        <div>
                            <h3 class="text-xs font-extrabold text-zinc-400 mb-4 tracking-wider uppercase">พยากรณ์รายชั่วโมง (12 ชั่วโมงข้างหน้า)</h3>
                            <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
                                ${hourlyItems}
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="glass-panel p-6 sm:p-7 rounded-3xl">
                            <h2 class="text-xs font-black text-amber-400 uppercase tracking-widest mb-4">รายละเอียดสภาพอากาศ</h2>
                            <div class="space-y-3 font-mono">
                                <div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-xs text-zinc-400 font-sans">ความชื้น</span><span class="text-sm font-bold text-white">${cur.relative_humidity_2m}%</span></div>
                                <div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-xs text-zinc-400 font-sans">ความเร็วลม</span><span class="text-sm font-bold text-white">${cur.wind_speed_10m} km/h</span></div>
                                <div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-xs text-zinc-400 font-sans">ความกดอากาศ</span><span class="text-sm font-bold text-white">${Math.round(cur.surface_pressure)} hPa</span></div>
                                <div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-xs text-zinc-400 font-sans">ดัชนี UV (ปัจจุบัน)</span><span class="text-sm font-bold text-amber-400">${uvVal}</span></div>
                                <div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-xs text-zinc-400 font-sans">พระอาทิตย์ขึ้น</span><span class="text-sm font-bold text-white">${sunriseStr}</span></div>
                                <div class="flex justify-between items-center py-2"><span class="text-xs text-zinc-400 font-sans">พระอาทิตย์ตก</span><span class="text-sm font-bold text-white">${sunsetStr}</span></div>
                            </div>
                        </div>

                        <div class="glass-panel p-6 sm:p-7 rounded-3xl">
                            <h2 class="text-xs font-black text-amber-400 uppercase tracking-widest mb-3">พยากรณ์ล่วงหน้า 5 วัน</h2>
                            ${dailyItems}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        async function doSearch(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            if (!query) return;

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;

            try {
                const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=th&format=json`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const loc = data.results[0];
                    let nameStr = loc.name;
                    if (loc.admin1 && loc.admin1 !== loc.name) nameStr += `, ${loc.admin1}`;

                    lastWeatherSnapshot = "";
                    await fetchWeatherByCoords(loc.latitude, loc.longitude, nameStr, loc.country_code);
                } else {
                    sendDiscordError("Search Failed", `ไม่พบสถานที่: "${query}"`);
                    alert('ไม่พบข้อมูลสถานที่ดังกล่าว');
                }
            } catch (err) {
                sendDiscordError("Search Error", err.message || err.toString());
                alert('เกิดข้อผิดพลาดในการค้นหา');
            } finally {
                btn.disabled = false;
            }
        }

        async function manualRefresh() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('spin-active');
            await autoCheckForUpdates();
            await sendDiscordUpdateNotification(true);
            setTimeout(() => icon.classList.remove('spin-active'), 500);
        }

        function esc(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        loadQuakeAlert();
        fetchWeatherByCoords(lastLat, lastLon, lastCityName, lastCountryCode);
    </script>
</body>
</html>
