<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO SCRIPT | Premium Executor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a102f, #ff0844);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white; 
      min-height: 100vh;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .glass { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-10 py-6">
    <div class="text-2xl font-black tracking-tighter italic">PRO<span class="text-[#ff0844]">SCRIPT</span></div>
    <div class="space-x-8 font-medium">
      <a href="#" onclick="showPage('home')" class="hover:text-pink-400 transition">หน้าหลัก</a>
      <a id="nav-btn" href="#" onclick="handleLogin()" class="px-6 py-2 bg-white text-black rounded-full font-bold hover:bg-[#ff0844] hover:text-white transition">เข้าสู่ระบบ</a>
    </div>
  </nav>

  <!-- หน้าหลัก -->
  <main id="home-page" class="px-10 py-32 text-center">
    <h1 class="text-6xl md:text-8xl font-black mb-6 leading-tight">ELITE SCRIPTS<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-red-500">FOR GAMERS</span></h1>
    <p class="text-gray-200 mb-12 max-w-xl mx-auto text-lg">ยกระดับการเล่นของคุณด้วยสคริปต์คุณภาพสูง อัปเดตใหม่ทุกวัน ปลอดภัย 100%</p>
    <button onclick="handleLogin()" class="px-12 py-5 bg-[#ff0844] rounded-2xl font-bold text-lg hover:scale-105 transition shadow-[0_0_30px_rgba(255,8,68,0.5)]">เริ่มต้นใช้งานทันที</button>
  </main>

  <!-- หน้าโปรไฟล์ -->
  <div id="profile-page" class="hidden px-10 py-20 text-center">
    <div class="glass max-w-md mx-auto p-10 rounded-3xl">
      <!-- รูปโปรไฟล์ดึงมาจาก Discord -->
      <img id="user-avatar" src="" class="w-24 h-24 rounded-full mx-auto mb-6 border-2 border-[#ff0844]">
      <!-- ชื่อดึงมาจาก Discord -->
      <h2 id="user-display" class="text-3xl font-bold">...</h2>
      <p class="text-gray-300 mb-8">Premium Member</p>
      <button onclick="handleLogout()" class="w-full py-3 bg-red-600 rounded-xl font-bold hover:bg-red-700 transition">ออกจากระบบ</button>
    </div>
  </div>

  <script>
    const CLIENT_ID = '1532644387639660627';
    const REDIRECT_URI = 'https://shop-github-io-phi.vercel.app/';

    function handleLogin() {
      // ใช้ response_type=token เพื่อรับ access_token โดยตรง
      window.location.href = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify`;
    }

    function showPage(page) {
      document.getElementById('home-page').classList.toggle('hidden', page !== 'home');
      document.getElementById('profile-page').classList.toggle('hidden', page !== 'profile');
    }

    // ฟังก์ชันดึงข้อมูลจาก Discord API
    async function fetchDiscordUser(token) {
      const response = await fetch('https://discord.com/api/users/@me', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await response.json();
      
      // แสดงผลข้อมูลที่ดึงมา
      document.getElementById('user-display').innerText = data.username;
      document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`;
      
      document.getElementById('nav-btn').innerText = "โปรไฟล์";
      document.getElementById('nav-btn').onclick = () => showPage('profile');
      showPage('profile');
    }

    // ตรวจสอบ Token บน URL
    window.onload = function() {
      const fragment = new URLSearchParams(window.location.hash.substring(1));
      const token = fragment.get('access_token');
      if (token) {
        fetchDiscordUser(token);
      }
    }

    function handleLogout() { window.location.href = "/"; }
  </script>
</body>
</html>
