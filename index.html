<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J Community - เติมเงิน</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      /* 💜 โทนสีหลัก (Default: Purple) */
      --bg-dark: #08030a;
      --card-bg: #110a17;
      --card-inner: #180e21;
      --primary-purple: #a855f7;
      --primary-purple-hover: #9333ea;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --discord-blue: #5865f2;
      --discord-blue-hover: #4752c4;
      --text-main: #ffffff;
      --text-muted: #a095b0;
      --border-color: #281838;
      --truemoney-color: #ff8c00;
      --green-accent: #28a745;
      --gold-color: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    body::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--purple-glow) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s ease;
    }

    /* Navbar Header */
    header {
      width: 100%;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5%;
      background: rgba(8, 3, 10, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-left-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.2rem;
      text-decoration: none;
      color: #fff;
    }

    .logo-img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 12px var(--purple-glow);
      border: 1px solid var(--purple-glow);
    }

    /* 🎨 เปลี่ยนธีมสี */
    .theme-picker-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 20px;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .color-dot:hover { transform: scale(1.2); }
    .color-dot.active {
      border-color: #ffffff;
      box-shadow: 0 0 8px currentColor;
    }

    .dot-purple { background-color: #a855f7; color: #a855f7; }
    .dot-blue   { background-color: #00b4d8; color: #00b4d8; }
    .dot-green  { background-color: #10b981; color: #10b981; }
    .dot-pink   { background-color: #ec4899; color: #ec4899; }
    .dot-orange { background-color: #f97316; color: #f97316; }

    /* เมนูเชื่อมโยง */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: 10px;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item:hover, .nav-item.active { color: #fff; }

    .btn-topup-nav {
      background: var(--primary-purple);
      border: 1px solid var(--purple-glow);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 12px var(--purple-glow);
    }

    .btn-login-discord {
      background: var(--discord-blue);
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-login-discord:hover { background: var(--discord-blue-hover); }

    .user-profile-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 5px 12px 5px 6px;
      border-radius: 30px;
    }

    .user-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--discord-blue);
      object-fit: cover;
    }

    .user-name-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    .user-balance-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(40, 167, 69, 0.15);
      border: 1px solid rgba(40, 167, 69, 0.3);
      color: #4cd964;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-logout-icon {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--purple-glow);
      color: var(--primary-purple);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 4px;
    }

    .btn-logout-icon:hover { background: var(--primary-purple); color: white; }

    /* Main Container */
    .topup-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .topup-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 20px var(--purple-glow);
    }

    .topup-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .topup-title {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .topup-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Tabs */
    .payment-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn i { width: 18px; height: 18px; }

    .tab-btn.active-tw {
      background: rgba(255, 140, 0, 0.15);
      border-color: var(--truemoney-color);
      color: #ffaa33;
    }

    .tab-btn.active-pp {
      background: rgba(0, 114, 206, 0.15);
      border-color: #0072ce;
      color: #33a0ff;
    }

    .tab-btn.active-code {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--primary-purple);
      color: var(--primary-purple);
    }

    /* Input & Button */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-field {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus { border-color: var(--primary-purple); }

    .btn-submit-topup {
      width: 100%;
      background: var(--primary-purple);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-submit-topup:hover { background: var(--primary-purple-hover); }

    .qr-box {
      text-align: center;
      background: white;
      padding: 16px;
      border-radius: 16px;
      width: 200px;
      margin: 0 auto 16px;
    }

    .qr-box img { width: 100%; display: block; }

    #statusMessage {
      margin-top: 16px;
      font-size: 0.9rem;
      text-align: center;
      min-height: 24px;
      font-weight: 500;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%; max-width: 460px;
      border-radius: 20px; padding: 28px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px var(--purple-glow);
      position: relative;
    }

    .close-btn {
      position: absolute; top: 18px; right: 20px;
      color: var(--text-muted); cursor: pointer;
    }
    .close-btn:hover { color: #fff; }

    /* Leaderboard */
    .leaderboard-list { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; }
    .leaderboard-item { display: flex; align-items: center; justify-content: space-between; background: var(--card-inner); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 12px; }
    .rank-user-info { display: flex; align-items: center; gap: 12px; }
    .rank-number { font-weight: 700; font-size: 1.1rem; width: 28px; text-align: center; }
    .rank-1 { color: #ffd700; } .rank-2 { color: #c0c0c0; } .rank-3 { color: #cd7f32; }
    .rank-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .rank-user-details { display: flex; flex-direction: column; }
    .rank-username { font-size: 0.95rem; font-weight: 600; color: #fff; }
    .rank-user-id { font-size: 0.75rem; color: var(--text-muted); }
    .rank-balance { font-weight: 700; font-size: 0.95rem; color: #4cd964; background: rgba(40, 167, 69, 0.12); border: 1px solid rgba(40, 167, 69, 0.25); padding: 4px 10px; border-radius: 20px; }
  </style>
</head>
<body>

  <!-- Navbar Header -->
  <header>
    <div class="nav-left-group">
      <a href="index.html" class="logo">
        <img class="logo-img" src="https://media.discordapp.net/attachments/1530928529657827411/1531541817697370213/ChatGPT_Image_26_.._2569_11_43_34.png" alt="Logo">
        <span>J Community</span>
      </a>

      <!-- 🎨 ปุ่มเปลี่ยนธีมสี (ทำงานทันทีเมื่อคลิก) -->
      <div class="theme-picker-bar">
        <div class="color-dot dot-purple active" onclick="changeTheme('purple')" title="สีม่วง"></div>
        <div class="color-dot dot-blue" onclick="changeTheme('blue')" title="สีฟ้า"></div>
        <div class="color-dot dot-green" onclick="changeTheme('green')" title="สีเขียว"></div>
        <div class="color-dot dot-pink" onclick="changeTheme('pink')" title="สีชมพู"></div>
        <div class="color-dot dot-orange" onclick="changeTheme('orange')" title="สีส้ม"></div>
      </div>

      <!-- ปุ่มเมนูหลัก (เชื่อมหน้า index.html) -->
      <div class="nav-links">
        <a class="nav-item" href="index.html"><i data-lucide="home" style="width:16px;"></i> หน้าหลัก</a>
        <a class="nav-item" href="index.html#shopSection"><i data-lucide="shopping-bag" style="width:16px;"></i> ร้านค้า</a>
        <a class="nav-item" href="javascript:void(0)" onclick="openLeaderboardModal()"><i data-lucide="trophy" style="width:16px; color: var(--gold-color);"></i> จัดอันดับ</a>
        
        <div class="btn-topup-nav" onclick="window.location.reload();">
          <i data-lucide="wallet" style="width:16px;"></i> เติมเงิน
        </div>
      </div>
    </div>

    <!-- ปุ่มเข้าสู่ระบบ / โปรไฟล์ -->
    <div>
      <a id="navLoginBtn" href="https://discord.com/oauth2/authorize?client_id=1507932932466282516&response_type=token&redirect_uri=https%3A%2F%2Fsk-six-beryl.vercel.app%2F&scope=identify" class="btn-login-discord">
        <i data-lucide="message-square" style="width:16px;"></i> เข้าสู่ระบบด้วย Discord
      </a>

      <div id="navProfileZone" class="user-profile-bar" style="display: none;">
        <img id="userAvatar" class="user-avatar-small" src="" alt="Avatar">
        <span id="userName" class="user-name-text">Loading...</span>

        <div class="user-balance-badge">
          <i data-lucide="coins" style="width:14px;"></i>
          <span id="userBalanceText">0</span> ฿
        </div>

        <button class="btn-logout-icon" onclick="logoutDiscord()" title="ออกจากระบบ">
          <i data-lucide="log-out" style="width:14px;"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Topup Container -->
  <div class="topup-container">
    <div class="topup-card">
      <div class="topup-header">
        <div class="topup-title">
          <i data-lucide="wallet" style="color: var(--primary-purple);"></i> เติมเงินเข้าระบบ
        </div>
        <p class="topup-subtitle">เลือกช่องทางการชำระเงินที่ต้องการได้เลยครับ</p>
      </div>

      <!-- ปุ่มเลือกสลับแท็บวิธีชำระเงิน -->
      <div class="payment-tabs">
        <button class="tab-btn active-tw" id="tabTW" onclick="switchTab('tw')">
          <i data-lucide="gift"></i> ซอง TrueMoney
        </button>
        <button class="tab-btn" id="tabPP" onclick="switchTab('pp')">
          <i data-lucide="qr-code"></i> PromptPay
        </button>
        <button class="tab-btn" id="tabCode" onclick="switchTab('code')">
          <i data-lucide="key-round"></i> Code ลับ
        </button>
      </div>

      <!-- 1. แท็บ TrueMoney Wallet -->
      <div id="viewTW">
        <div class="form-group">
          <label class="form-label">เบอร์ TrueMoney Wallet (เบอร์ผู้รับเงิน):</label>
          <input type="text" id="receiverPhone" class="input-field" placeholder="08xxxxxxxx" maxlength="10" />
        </div>
        <div class="form-group">
          <label class="form-label">ลิงก์ซองอั่งเปา TrueMoney Wallet:</label>
          <input type="text" id="voucherUrl" class="input-field" placeholder="https://gift.truemoney.com/v2/verify?v=..." />
        </div>
        <button class="btn-submit-topup" onclick="processVoucher()">
          <i data-lucide="check-circle" style="width:18px;"></i> ยืนยันการเติมเงิน
        </button>
      </div>

      <!-- 2. แท็บ PromptPay -->
      <div id="viewPP" style="display: none;">
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY_EXAMPLE" alt="PromptPay QR">
        </div>
        <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
          สแกน QR Code ด้วยแอปธนาคารเพื่อทำรายการเติมเงิน
        </p>
      </div>

      <!-- 3. แท็บ Code ลับ -->
      <div id="viewCode" style="display: none;">
        <div class="form-group">
          <label class="form-label">กรอก Code ลับเพื่อรับเงินเพิ่ม:</label>
          <input type="text" id="secretCodeInput" class="input-field" placeholder="กรอก Code ลับที่นี่..." style="text-transform: uppercase;" />
        </div>
        <button class="btn-submit-topup" onclick="processSecretCode()">
          <i data-lucide="sparkles" style="width:18px;"></i> แลก Code ลับ
        </button>
      </div>

      <div id="statusMessage"></div>
    </div>
  </div>

  <!-- Leaderboard Modal (หน้าต่างจัดอันดับ) -->
  <div class="modal-overlay" id="leaderboardModal" onclick="if(event.target === this) closeLeaderboardModal()">
    <div class="modal-card">
      <span class="close-btn" onclick="closeLeaderboardModal()"><i data-lucide="x"></i></span>
      <div style="text-align:center; font-size: 1.3rem; font-weight:700; color: var(--gold-color); margin-bottom: 20px;">
        <i data-lucide="trophy"></i> อันดับผู้ถือครองเงินสูงสุด
      </div>
      <div class="leaderboard-list" id="leaderboardContainer"></div>
    </div>
  </div>

  <script>
    // สร้าง Icon
    lucide.createIcons();

    // 1. ระบบจัดการธีมสี (ทำงานทันที)
    const themePalettes = {
      purple: { bgDark: "#08030a", cardBg: "#110a17", cardInner: "#180e21", primary: "#a855f7", primaryHover: "#9333ea", glow: "rgba(168, 85, 247, 0.4)", border: "#281838" },
      blue:   { bgDark: "#030a10", cardBg: "#0a131f", cardInner: "#0f1c2e", primary: "#00b4d8", primaryHover: "#0077b6", glow: "rgba(0, 180, 216, 0.4)",  border: "#122a47" },
      green:  { bgDark: "#030a06", cardBg: "#0a1a10", cardInner: "#0f2618", primary: "#10b981", primaryHover: "#059669", glow: "rgba(16, 185, 129, 0.4)", border: "#133a23" },
      pink:   { bgDark: "#0a0307", cardBg: "#1a0a14", cardInner: "#260f1e", primary: "#ec4899", primaryHover: "#db2777", glow: "rgba(236, 72, 153, 0.4)", border: "#3d132e" },
      orange: { bgDark: "#0a0603", cardBg: "#1f100a", cardInner: "#2b170e", primary: "#f97316", primaryHover: "#ea580c", glow: "rgba(249, 115, 22, 0.4)", border: "#422013" }
    };

    function changeTheme(themeName) {
      const palette = themePalettes[themeName];
      if (!palette) return;

      const root = document.documentElement;
      root.style.setProperty('--bg-dark', palette.bgDark);
      root.style.setProperty('--card-bg', palette.cardBg);
      root.style.setProperty('--card-inner', palette.cardInner);
      root.style.setProperty('--primary-purple', palette.primary);
      root.style.setProperty('--primary-purple-hover', palette.primaryHover);
      root.style.setProperty('--purple-glow', palette.glow);
      root.style.setProperty('--border-color', palette.border);

      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      const activeDot = document.querySelector(`.dot-${themeName}`);
      if (activeDot) activeDot.classList.add('active');

      localStorage.setItem('site_theme', themeName);
    }

    const savedTheme = localStorage.getItem('site_theme') || 'purple';
    changeTheme(savedTheme);

    // 2. ระบบสลับแท็บช่องทางชำระเงิน
    function switchTab(tab) {
      document.getElementById('viewTW').style.display = tab === 'tw' ? 'block' : 'none';
      document.getElementById('viewPP').style.display = tab === 'pp' ? 'block' : 'none';
      document.getElementById('viewCode').style.display = tab === 'code' ? 'block' : 'none';

      document.getElementById('tabTW').className = `tab-btn ${tab === 'tw' ? 'active-tw' : ''}`;
      document.getElementById('tabPP').className = `tab-btn ${tab === 'pp' ? 'active-pp' : ''}`;
      document.getElementById('tabCode').className = `tab-btn ${tab === 'code' ? 'active-code' : ''}`;
      document.getElementById('statusMessage').innerText = '';
    }

    // 3. ระบบผู้ใช้งานและการตรวจสอบล็อกอิน
    const TARGET_CODE = "CODE YPOPXDFSS TOKEBA";
    const MAX_QUOTA = 10;
    const REWARD_AMOUNT = 25;
    const ADMIN_CODES = { "ADMIN100": 100, "ADMIN1000": 1000 };

    let isLoggedIn = false;
    let currentUserId = null;
    let currentBalance = 0;

    function updateBalanceDisplay(amount) {
      currentBalance = amount;
      document.getElementById('userBalanceText').innerText = currentBalance.toLocaleString();
      if (currentUserId) {
        localStorage.setItem(`user_balance_${currentUserId}`, currentBalance);
      }
    }

    function checkDiscordLogin() {
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = fragment.get('access_token');

      if (accessToken) {
        window.history.replaceState({}, document.title, window.location.pathname);
        localStorage.setItem('discord_access_token', accessToken);
      }

      const token = localStorage.getItem('discord_access_token');
      if (!token) return;

      fetch('https://discord.com/api/users/@me', {
        headers: { authorization: `Bearer ${token}` }
      })
      .then(res => {
        if (!res.ok) throw new Error("Unauthorized");
        return res.json();
      })
      .then(user => {
        isLoggedIn = true;
        currentUserId = user.id;

        const avatarUrl = user.avatar
          ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
          : 'https://cdn.discordapp.com/embed/avatars/0.png';

        const userNameText = user.global_name || user.username;
        document.getElementById('userAvatar').src = avatarUrl;
        document.getElementById('userName').innerText = userNameText;

        document.getElementById('navLoginBtn').style.display = 'none';
        document.getElementById('navProfileZone').style.display = 'flex';

        // บันทึกโปรไฟล์ลงเครื่องไว้สำหรับระบบ Leaderboard
        localStorage.setItem(`user_profile_${currentUserId}`, JSON.stringify({
          name: userNameText,
          avatar: avatarUrl
        }));

        const savedBalance = localStorage.getItem(`user_balance_${currentUserId}`);
        updateBalanceDisplay(savedBalance ? parseFloat(savedBalance) : 0);
      })
      .catch(() => {
        logoutDiscord();
      });
    }

    // ปุ่มออกจากระบบ
    function logoutDiscord() {
      localStorage.removeItem('discord_access_token');
      isLoggedIn = false;
      currentUserId = null;
      document.getElementById('navLoginBtn').style.display = 'flex';
      document.getElementById('navProfileZone').style.display = 'none';
    }

    // 4. ระบบเปิด-ปิด Leaderboard Modal
    const leaderboardModal = document.getElementById('leaderboardModal');
    function openLeaderboardModal() {
      renderLeaderboard();
      leaderboardModal.classList.add('active');
    }
    function closeLeaderboardModal() { 
      leaderboardModal.classList.remove('active'); 
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboardContainer');
      const usersList = [];

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('user_profile_')) {
          const userId = key.replace('user_profile_', '');
          const profile = JSON.parse(localStorage.getItem(key));
          const balance = parseFloat(localStorage.getItem(`user_balance_${userId}`)) || 0;
          usersList.push({ id: userId, name: profile.name, avatar: profile.avatar, balance: balance });
        }
      }

      usersList.sort((a, b) => b.balance - a.balance);

      if (usersList.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">ยังไม่มีข้อมูลอันดับผู้ใช้งาน</div>`;
        return;
      }

      let html = '';
      usersList.forEach((user, index) => {
        let rankBadge = `${index + 1}`;
        let rankClass = '';
        if (index === 0) { rankBadge = '🥇'; rankClass = 'rank-1'; }
        else if (index === 1) { rankBadge = '🥈'; rankClass = 'rank-2'; }
        else if (index === 2) { rankBadge = '🥉'; rankClass = 'rank-3'; }

        html += `
          <div class="leaderboard-item">
            <div class="rank-user-info">
              <span class="rank-number ${rankClass}">${rankBadge}</span>
              <img src="${user.avatar}" class="rank-avatar" alt="Avatar">
              <div class="rank-user-details">
                <span class="rank-username">${user.name}</span>
                <span class="rank-user-id">ID: ${user.id}</span>
              </div>
            </div>
            <div class="rank-balance">${user.balance.toLocaleString()} ฿</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 5. ปุ่มแลก Code ลับ
    let usedCount = parseInt(localStorage.getItem('secret_code_used_count')) || 0;

    function processSecretCode() {
      const inputVal = document.getElementById('secretCodeInput').value.trim().toUpperCase().replace(/\s+/g, ' ');
      const statusMessage = document.getElementById('statusMessage');

      if (!isLoggedIn) {
        statusMessage.style.color = '#ff4d4d';
        statusMessage.innerText = '❌ กรุณาเข้าสู่ระบบด้วย Discord ก่อนครับ';
        return;
      }

      if (!inputVal) {
        statusMessage.style.color = '#ff4d4d';
        statusMessage.innerText = '❌ กรุณากรอก Code ลับก่อนครับ';
        return;
      }

      if (ADMIN_CODES[inputVal] !== undefined) {
        const added = ADMIN_CODES[inputVal];
        updateBalanceDisplay(currentBalance + added);
        statusMessage.style.color = '#28a745';
        statusMessage.innerText = `🎉 แลกรับสำเร็จ +${added} บาท`;
        document.getElementById('secretCodeInput').value = '';
        return;
      }

      if (usedCount >= MAX_QUOTA) {
        statusMessage.style.color = '#ff4d4d';
        statusMessage.innerText = '❌ โค้ดนี้ถูกใช้งานครบโควต้าแล้ว';
        return;
      }

      if (localStorage.getItem(`code_redeemed_${currentUserId}`) === 'true') {
        statusMessage.style.color = '#ffaa33';
        statusMessage.innerText = '⚠️ บัญชีนี้เคยใช้ Code ลับนี้ไปแล้วครับ';
        return;
      }

      if (inputVal === TARGET_CODE) {
        usedCount++;
        localStorage.setItem('secret_code_used_count', usedCount);
        localStorage.setItem(`code_redeemed_${currentUserId}`, 'true');

        updateBalanceDisplay(currentBalance + REWARD_AMOUNT);
        statusMessage.style.color = '#28a745';
        statusMessage.innerText = `🎉 แลกรับสำเร็จ +${REWARD_AMOUNT} บาท`;
        document.getElementById('secretCodeInput').value = '';
      } else {
        statusMessage.style.color = '#ff4d4d';
        statusMessage.innerText = '❌ Code ลับไม่ถูกต้อง';
      }
    }

    // 6. ปุ่มเติมเงิน TrueMoney
    function processVoucher() {
      const statusMessage = document.getElementById('statusMessage');
      const phone = document.getElementById('receiverPhone').value.trim();
      const voucherUrl = document.getElementById('voucherUrl').value.trim();

      if (!isLoggedIn) {
        statusMessage.style.color = '#ff4d4d';
        statusMessage.innerText = '❌ กรุณาเข้าสู่ระบบด้วย Discord ก่อนทำรายการ';
        return;
      }

      if (!phone || !voucherUrl) {
        statusMessage.style.color = '#ff4d4d';
        statusMessage.innerText = '❌ กรุณากรอกเบอร์โทรและลิงก์ซองอั่งเปาให้ครบถ้วน';
        return;
      }

      statusMessage.style.color = '#ffaa33';
      statusMessage.innerText = '⏳ กำลังส่งข้อมูลรายการ...';
      setTimeout(() => {
        statusMessage.style.color = '#28a745';
        statusMessage.innerText = '✅ ส่งข้อมูลการเติมเงินเรียบร้อยแล้ว';
      }, 1000);
    }

    // เริ่มต้นเช็กการล็อกอินทันทีที่โหลดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', checkDiscordLogin);
  </script>
</body>
</html>
