<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS SHOP - Official Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sukhumvit Set', sans-serif, Arial; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 420px; width: 90%; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .btn-discord { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #5865F2; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.2s; border: none; cursor: pointer; font-size: 1rem; }
        .btn-discord:hover { background: #4752C4; }
        #status-box { display: none; margin-top: 1rem; padding: 10px; border-radius: 8px; background: #334155; }
        .user-info { display: none; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 1rem; border: 3px solid #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>GPS SHOP</h1>
        <p>ยินดีต้อนรับสู่ระบบร้านค้า เข้าสู่ระบบเพื่อเริ่มใช้งาน</p>

        <!-- ปุ่มเข้าสู่ระบบหน้าหลัก -->
        <a id="login-btn" class="btn-discord" href="https://discord.com/oauth2/authorize?client_id=1532644387639660627&response_type=code&redirect_uri=https%3A%2F%2Fdhaf-shop.onrender.com%2F&scope=identify">
            เข้าสู่ระบบด้วย Discord
        </a>

        <!-- กล่องแสดงสถานะตอนยิง API -->
        <div id="status-box">กำลังเข้าสู่ระบบ...</div>

        <!-- หน้าแสดงโปรไฟล์เมื่อล็อกอินสำเร็จ -->
        <div id="user-info" class="user-info">
            <img id="user-avatar" class="avatar" src="" alt="User Avatar">
            <h2 id="user-name"></h2>
            <p id="user-id" style="font-size:0.8rem; margin-top:5px;"></p>
        </div>
    </div>

    <script>
      async function handleDiscordCallback() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        // กรณีเปิดหน้าเว็บเข้าปกติ (ไม่มี Code)
        if (!code) {
          console.log("เข้าสู่หน้าหลักปกติ");
          return;
        }

        // กรณีกลับมาจาก Discord (มี Code ใน URL)
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('status-box').style.display = 'block';

        try {
          const response = await fetch('/api/discord-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server ตอบกลับข้อผิดพลาด (${response.status}): ${errorText}`);
          }

          const responseText = await response.text();
          if (!responseText) {
            throw new Error("Server ส่งข้อมูลกลับมาเป็นค่าว่าง");
          }

          const userData = JSON.parse(responseText);
          
          // ล็อกอินสำเร็จ: แสดงข้อมูลผู้ใช้บนหน้าหลัก
          document.getElementById('status-box').style.display = 'none';
          document.getElementById('user-info').style.display = 'block';
          
          document.getElementById('user-name').innerText = `ยินดีต้อนรับ ${userData.username}`;
          document.getElementById('user-id').innerText = `ID: ${userData.id}`;
          
          if (userData.avatar) {
            document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`;
          } else {
            document.getElementById('user-avatar').src = 'https://cdn.discordapp.com/embed/avatars/0.png';
          }

          // ลบ ?code= ออกจาก URL เพื่อความสะอาดสวยงาม
          window.history.replaceState({}, document.title, window.location.pathname);

        } catch (error) {
          console.error("Discord Login Error:", error);
          document.getElementById('status-box').style.color = '#ef4444';
          document.getElementById('status-box').innerText = "เกิดข้อผิดพลาดในการล็อกอิน: " + error.message;
        }
      }

      window.addEventListener('DOMContentLoaded', handleDiscordCallback);
    </script>
</body>
</html>
