<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAF SHOP | ระบบจัดการการเงิน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07080d;
            --card-bg: rgba(20, 22, 30, 0.6);
            --border-glow: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b8e99;
            --primary-purple: #8b5cf6;
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --discord-blurple: #5865F2;
            --input-bg: rgba(255, 255, 255, 0.05);
            --success: #10b981;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans Thai', sans-serif; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(88, 101, 242, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 45%);
        }

        /* Navbar */
        .navbar {
            background: rgba(7, 8, 13, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-logo { font-size: 22px; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-menu { list-style: none; display: flex; gap: 35px; align-items: center; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.3s; }
        .nav-menu a:hover { color: var(--text-main); }
        .nav-right { display: flex; align-items: center; gap: 15px; }

        .btn-discord { background: var(--discord-blurple); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: all 0.2s; box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4); }
        .btn-discord:hover { background: #4752c4; transform: translateY(-2px); }

        .profile-dropdown { position: relative; display: none; }
        .profile-btn { background: var(--input-bg); border: 1px solid var(--border-glow); border-radius: 30px; padding: 5px 15px 5px 5px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.3s; }
        .profile-btn:hover { background: rgba(255,255,255,0.1); }
        .profile-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .profile-name { font-size: 14px; font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .dropdown-menu { position: absolute; top: 110%; right: 0; background: #15171f; border: 1px solid var(--border-glow); border-radius: 12px; width: 220px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; overflow: hidden; }
        .profile-dropdown.active .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-header { padding: 15px 20px; border-bottom: 1px solid var(--border-glow); margin-bottom: 5px; }
        .dropdown-header strong { display: block; font-size: 15px; margin-bottom: 2px; }
        .dropdown-header span { font-size: 13px; color: var(--text-muted); word-break: break-all; }
        .dropdown-item { padding: 12px 20px; display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text-main); font-size: 14px; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); }
        .dropdown-item.danger { color: var(--danger); }

        /* Main Content */
        .container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; }

        /* Balance Card */
        .balance-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .balance-label { color: var(--text-muted); font-size: 16px; margin-bottom: 15px; }
        .balance-amount { font-size: 56px; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }

        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-income { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-income:hover { background: rgba(16, 185, 129, 0.2); }
        .btn-expense { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-expense:hover { background: rgba(239, 68, 68, 0.2); }
        .btn-reset { background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border-glow); }

        /* History Table */
        .history-card { background: var(--card-bg); border: 1px solid var(--border-glow); border-radius: 24px; padding: 30px; overflow: hidden; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .history-title { font-size: 20px; font-weight: 600; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th { text-align: left; color: var(--text-muted); font-size: 13px; font-weight: 500; padding: 12px 15px; border-bottom: 1px solid var(--border-glow); }
        .history-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 15px; }
        .tag { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .tag-income { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .tag-expense { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #13151c; border: 1px solid var(--border-glow); border-radius: 20px; padding: 30px; width: 90%; max-width: 450px; }
        .modal-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .input-field { width: 100%; background: var(--input-bg); border: 1px solid var(--border-glow); border-radius: 10px; padding: 14px 16px; color: var(--text-main); font-size: 15px; font-family: inherit; outline: none; }
        .input-field:focus { border-color: var(--primary-purple); }
        .btn-submit { width: 100%; padding: 14px; background: var(--primary-gradient); border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        .loading-spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            DHAF SHOP
        </div>
        <ul class="nav-menu">
            <li><a href="#">หน้าหลัก</a></li>
            <li><a href="#">สถิติ</a></li>
            <li><a href="#">เกี่ยวกับเรา</a></li>
        </ul>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="container">
        <!-- แสดงยอดเงิน -->
        <div class="balance-card">
            <div class="balance-label">ยอดเงินคงเหลือในระบบ</div>
            <div class="balance-amount" id="balanceAmount">0.00 ฿</div>
            <div class="balance-actions">
                <button class="btn btn-income" onclick="openModal('income')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    เติมเงิน / รายรับ
                </button>
                <button class="btn btn-expense" onclick="openModal('expense')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                    ซื้อของ / รายจ่าย
                </button>
                <button class="btn btn-reset" onclick="resetData()">รีเซ็ตยอด</button>
            </div>
        </div>

        <!-- ประวัติธุรกรรม -->
        <div class="history-card">
            <div class="history-header">
                <h2 class="history-title">ประวัติการรับ-จ่าย</h2>
            </div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>รายละเอียด</th>
                        <th>ประเภท</th>
                        <th>วันที่</th>
                        <th style="text-align: right;">จำนวนเงิน</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- ข้อมูลจะถูกใส่โดย JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal ฟอร์มรับ-จ่าย -->
    <div class="modal-overlay" id="transactionModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">เพิ่มรายการ</h3>
            <form onsubmit="event.preventDefault(); saveTransaction();">
                <div class="input-group">
                    <label class="input-label">รายละเอียด</label>
                    <input type="text" id="transDesc" class="input-field" placeholder="เช่น เติมเงินเข้าระบบ, ซื้อสินค้า" required>
                </div>
                <div class="input-group">
                    <label class="input-label">จำนวนเงิน (บาท)</label>
                    <input type="number" id="transAmount" class="input-field" placeholder="0.00" min="1" step="0.01" required>
                </div>
                <button type="submit" class="btn-submit">บันทึก</button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ระบบจัดการข้อมูล (LocalStorage - บันทึกตลอดแม้รีเว็บ)
        // ==========================================
        let balance = parseFloat(localStorage.getItem('dhaf_balance')) || 0;
        let transactions = JSON.parse(localStorage.getItem('dhaf_transactions')) || [];
        let currentModalType = 'income';

        function saveData() {
            localStorage.setItem('dhaf_balance', balance);
            localStorage.setItem('dhaf_transactions', JSON.stringify(transactions));
        }

        function updateFinanceUI() {
            // อัปเดตยอดเงิน
            document.getElementById('balanceAmount').innerText = balance.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ฿';

            // อัปเดตตารางประวัติ
            const tbody = document.getElementById('historyBody');
            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">ยังไม่มีรายการธุรกรรม</td></tr>`;
                return;
            }

            tbody.innerHTML = transactions.map(t => `
                <tr>
                    <td>${t.desc}</td>
                    <td><span class="tag ${t.type === 'income' ? 'tag-income' : 'tag-expense'}">${t.type === 'income' ? 'รายรับ' : 'รายจ่าย'}</span></td>
                    <td>${t.date}</td>
                    <td style="text-align: right; color: ${t.type === 'income' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">
                        ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ฿
                    </td>
                </tr>
            `).join('');
        }

        function openModal(type) {
            currentModalType = type;
            document.getElementById('modalTitle').innerText = type === 'income' ? 'บันทึกการรับเงิน' : 'บันทึกการจ่ายเงิน';
            document.getElementById('transDesc').value = '';
            document.getElementById('transAmount').value = '';
            document.getElementById('transactionModal').classList.add('active');
        }

        function saveTransaction() {
            const desc = document.getElementById('transDesc').value;
            const amount = parseFloat(document.getElementById('transAmount').value);
            
            if (isNaN(amount) || amount <= 0) {
                alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
                return;
            }

            // ระบบเช็คว่ามีตังไหม (ถ้าเป็นรายจ่าย และเงินไม่พอ จะห้ามซื้อ)
            if (currentModalType === 'expense' && amount > balance) {
                alert(`ยอดเงินของคุณไม่เพียงพอ! คงเหลือ ${balance.toLocaleString('th-TH')} ฿`);
                return;
            }

            const transaction = {
                desc: desc,
                amount: amount,
                type: currentModalType,
                date: new Date().toLocaleDateString('th-TH', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'})
            };

            transactions.unshift(transaction); // เพิ่มรายการใหม่ไว้บนสุด
            
            // อัปเดตยอดเงิน
            if (currentModalType === 'income') {
                balance += amount;
            } else {
                balance -= amount;
            }

            saveData();
            updateFinanceUI();
            document.getElementById('transactionModal').classList.remove('active');
        }

        function resetData() {
            if (confirm('คุณต้องการรีเซ็ตยอดเงินและล้างประวัติทั้งหมดหรือไม่?')) {
                balance = 0;
                transactions = [];
                saveData();
                updateFinanceUI();
            }
        }

        // ==========================================
        // 2. ระบบล็อกอิน Discord (ดึงโปรไฟล์และชื่อจริง)
        // ==========================================
        const CLIENT_ID = "1532644387639660627";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        // ใช้ scope=identify เท่านั้น เพื่อให้ตรงกับการอนุญาตใน Discord และแก้ Error 401
        const DISCORD_OAUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify&prompt=consent`;

        let discordUser = null;

        function checkDiscordAuth() {
            const hash = window.location.hash.substring(1);
            if (!hash) return false;

            const params = new URLSearchParams(hash);
            const token = params.get('access_token');
            
            if (token) {
                window.history.replaceState({}, document.title, REDIRECT_URI);
                fetchDiscordUser(token);
                return true;
            }
            return false;
        }

        async function fetchDiscordUser(token) {
            document.getElementById('navRight').innerHTML = `<div style="width: 100px; display: flex; justify-content: center;"><div class="loading-spinner"></div></div>`;

            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                discordUser = {
                    id: data.id,
                    username: data.username,
                    global_name: data.global_name || data.username,
                    avatar: data.avatar 
                        ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=128`
                        : `https://cdn.discordapp.com/embed/avatars/${data.discriminator % 5}.png`
                };

                updateNavUI();

            } catch (error) {
                console.error('เกิดข้อผิดพลาดในการดึงข้อมูล Discord:', error);
                updateNavUI();
                alert("เกิดข้อผิดพลาดในการดึงข้อมูล Discord กรุณาลองล็อกอินใหม่อีกครั้ง");
            }
        }

        function updateNavUI() {
            const navRight = document.getElementById('navRight');

            if (discordUser) {
                navRight.innerHTML = `
                    <div class="profile-dropdown" id="profileDropdown" style="display: block;">
                        <div class="profile-btn" onclick="toggleDropdown()">
                            <img src="${discordUser.avatar}" alt="Avatar" class="profile-avatar">
                            <span class="profile-name">${discordUser.global_name}</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-header">
                                <strong>${discordUser.global_name}</strong>
                                <span>@${discordUser.username}</span>
                            </div>
                            <a href="#" class="dropdown-item" onclick="closeDropdown()">โปรไฟล์ของฉัน</a>
                            <a href="#" class="dropdown-item" onclick="closeDropdown()">ตั้งค่าบัญชี</a>
                            <button class="dropdown-item danger" onclick="handleLogout()">ออกจากระบบ</button>
                        </div>
                    </div>
                `;
            } else {
                navRight.innerHTML = `
                    <button class="btn-discord" onclick="loginDiscord()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        เข้าสู่ระบบด้วย Discord
                    </button>
                `;
            }
        }

        function loginDiscord() { window.location.href = DISCORD_OAUTH_URL; }
        function handleLogout() { discordUser = null; updateNavUI(); }
        function toggleDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown) dropdown.classList.toggle('active');
        }
        function closeDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown) dropdown.classList.remove('active');
        }
        window.onclick = function(event) {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown && !event.target.closest('.profile-dropdown')) closeDropdown();
        }

        // ==========================================
        // เริ่มการทำงานของเว็บไซต์
        // ==========================================
        const isReturningFromDiscord = checkDiscordAuth();
        if (!isReturningFromDiscord) {
            updateNavUI();
        }
        updateFinanceUI(); // โหลดยอดเงินและประวัติจาก Memory ทันทีที่เปิดเว็บ
    </script>

</body>
</html>
