<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHERPRO - Universal Responsive Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #080c14;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* แสงออร่าพื้นหลังโทนเข้ม หรูหรา */
        .bg-glow-top {
            position: fixed;
            top: -20vw;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(30, 58, 138, 0.2) 0%, rgba(15, 23, 42, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Glassmorphism Panel สไตล์คลีน */
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card-sm {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        .glass-card-sm:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex flex-col items-center justify-center relative overflow-x-hidden">

    <!-- Ambient Glow Background -->
    <div class="bg-glow-top"></div>

    <div class="w-full max-w-5xl space-y-5 relative z-10">
        
        <!-- Header Bar -->
        <header class="glass-card rounded-2xl md:rounded-3xl p-4 md:p-5 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
            <div class="flex items-center gap-3.5 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 md:p-3 bg-blue-600/20 text-blue-400 rounded-2xl border border-blue-500/30">
                        <i data-lucide="cloud-sun" class="w-6 h-6 md:w-7 md:h-7"></i>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white flex items-center gap-1.5">
                            WEATHER<span class="text-blue-400">PRO</span>
                        </h1>
                        <p class="text-xs text-slate-400">รายงานสภาพอากาศเรียลไทม์</p>
                    </div>
                </div>

                <!-- Clock Mobile Only -->
                <div class="text-right sm:hidden">
                    <div id="clock-mobile" class="text-xs font-bold text-slate-200">00:00:00 น.</div>
                    <div id="date-mobile" class="text-[10px] text-slate-400">--/--/----</div>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div class="text-right hidden sm:block">
                    <div id="clock-desktop" class="text-sm md:text-base font-bold text-slate-200">00:00:00 น.</div>
                    <div id="date-desktop" class="text-xs text-slate-400">--/--/----</div>
                </div>

                <button onclick="requestLocationPermission()" title="ค้นหาตำแหน่งปัจจุบัน" class="p-2.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded-xl md:rounded-2xl border border-blue-500/30 active:scale-95 transition-all flex items-center gap-2 text-xs font-medium">
                    <i data-lucide="crosshair" class="w-4 h-4"></i>
                    <span class="hidden md:inline">ตำแหน่งของฉัน</span>
                </button>

                <button onclick="refreshData()" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl md:rounded-2xl border border-slate-700 active:scale-95 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Push Notification Bar -->
        <div class="glass-card rounded-2xl md:rounded-3xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md border-l-4 border-l-blue-500">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </div>
                <div>
                    <h4 class="text-xs md:text-sm font-semibold text-white">การแจ้งเตือนสภาพอากาศ</h4>
                    <p class="text-[11px] md:text-xs text-slate-400">เปิดรับการแจ้งเตือนด่วนผ่านเบราว์เซอร์มือถือและคอมพิวเตอร์</p>
                </div>
            </div>
            <button onclick="enablePushNotification()" id="btn-notify" class="w-full sm:w-auto px-4 py-2 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium text-xs rounded-xl md:rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                <i data-lucide="smartphone" class="w-4 h-4"></i>
                <span>เปิดแจ้งเตือน</span>
            </button>
        </div>

        <!-- Main Display Card -->
        <main class="space-y-5">
            <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div class="space-y-2">
                        <button onclick="requestLocationPermission()" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 text-xs font-medium border border-blue-500/20 transition-all">
                            <i data-lucide="map-pin" class="w-4 h-4 animate-pulse"></i>
                            <span id="location-name">กำลังค้นหาตำแหน่ง...</span>
                        </button>
                        <h2 id="weather-condition" class="text-3xl md:text-4xl font-extrabold text-white">กำลังโหลด...</h2>
                        <p class="text-slate-400 text-xs md:text-sm" id="feels-like">รู้สึกเหมือน --°C</p>
                    </div>

                    <div class="flex items-center gap-5 bg-slate-900/60 p-4 md:p-5 rounded-2xl md:rounded-3xl border border-white/5 shadow-inner self-stretch md:self-auto justify-between md:justify-start">
                        <div id="weather-icon" class="text-blue-400">
                            <i data-lucide="cloud-sun" class="w-16 h-16 md:w-20 md:h-20"></i>
                        </div>
                        <div class="text-6xl md:text-7xl font-black text-white tracking-tighter" id="current-temp">--°</div>
                    </div>
                </div>

                <!-- Hourly Forecast Bar -->
                <div class="mt-8 pt-6 border-t border-slate-800">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="clock" class="w-4 h-4 text-blue-400"></i> พยากรณ์ 12 ชั่วโมงข้างหน้า
                        </h3>
                    </div>

                    <div id="hourly-container" class="flex gap-3 overflow-x-auto scrollbar-none pb-2"></div>
                </div>

            </div>

            <!-- Weather Details Grid (2 Col บนมือถือ / 4 Col บนคอม) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3.5 md:gap-4">
                
                <div class="glass-card-sm rounded-2xl md:rounded-3xl p-4 md:p-5 flex items-center gap-3.5 shadow-md">
                    <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl md:rounded-2xl border border-blue-500/20">
                        <i data-lucide="droplets" class="w-5 h-5 md:w-6 md:h-6"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">ความชื้น</div>
                        <div id="humidity" class="text-base md:text-xl font-bold text-white">-- %</div>
                    </div>
                </div>

                <div class="glass-card-sm rounded-2xl md:rounded-3xl p-4 md:p-5 flex items-center gap-3.5 shadow-md">
                    <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl md:rounded-2xl border border-emerald-500/20">
                        <i data-lucide="wind" class="w-5 h-5 md:w-6 md:h-6"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">ความเร็วลม</div>
                        <div id="wind-speed" class="text-base md:text-xl font-bold text-white">-- km/h</div>
                    </div>
                </div>

                <div class="glass-card-sm rounded-2xl md:rounded-3xl p-4 md:p-5 flex items-center gap-3.5 shadow-md">
                    <div class="p-3 bg-purple-500/10 text-purple-400 rounded-xl md:rounded-2xl border border-purple-500/20">
                        <i data-lucide="gauge" class="w-5 h-5 md:w-6 md:h-6"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">ความกดอากาศ</div>
                        <div id="pressure" class="text-base md:text-xl font-bold text-white">-- hPa</div>
                    </div>
                </div>

                <div class="glass-card-sm rounded-2xl md:rounded-3xl p-4 md:p-5 flex items-center gap-3.5 shadow-md">
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl md:rounded-2xl border border-amber-500/20">
                        <i data-lucide="sun-medium" class="w-5 h-5 md:w-6 md:h-6"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">ดัชนี UV</div>
                        <div id="uv-index" class="text-base md:text-xl font-bold text-white">0.0</div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // พิกัดเริ่มต้นสำรอง
        let currentLat = 13.08;
        let currentLon = 100.92;

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH') + ' น.';
            const dateStr = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
            
            document.getElementById('clock-mobile').innerText = timeStr;
            document.getElementById('date-mobile').innerText = dateStr;
            document.getElementById('clock-desktop').innerText = timeStr;
            document.getElementById('date-desktop').innerText = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ฟังก์ชันขอสิทธิ์เข้าถึงพิกัด GPS
        function requestLocationPermission() {
            document.getElementById('location-name').innerText = "กำลังระบุตำแหน่ง...";
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        await getCityName(currentLat, currentLon);
                        fetchWeatherData(currentLat, currentLon);
                    },
                    (error) => {
                        console.warn("User denied location or error:", error.message);
                        document.getElementById('location-name').innerText = "แหลมฉบัง, ชลบุรี (เริ่มต้น)";
                        fetchWeatherData(currentLat, currentLon);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById('location-name').innerText = "แหลมฉบัง, ชลบุรี (เริ่มต้น)";
                fetchWeatherData(currentLat, currentLon);
            }
        }

        // แปลงพิกัดเป็นชื่อเมือง
        async function getCityName(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=th`);
                const data = await res.json();
                const address = data.address;
                const city = address.city || address.town || address.subdistrict || address.county || address.province || "ตำแหน่งปัจจุบัน";
                const state = address.state || "";
                document.getElementById('location-name').innerText = state ? `${city}, ${state}` : city;
            } catch (err) {
                document.getElementById('location-name').innerText = `พิกัด ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
            }
        }

        function enablePushNotification() {
            if (!("Notification" in window)) return alert("เบราว์เซอร์ไม่รองรับการแจ้งเตือน");
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("WEATHERPRO", { 
                        body: "เปิดการแจ้งเตือนสภาพอากาศเรียบร้อยแล้ว!" 
                    });
                    const btn = document.getElementById('btn-notify');
                    btn.className = "w-full sm:w-auto px-4 py-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium text-xs rounded-xl md:rounded-2xl flex items-center justify-center gap-2";
                    btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i><span>เปิดการแจ้งเตือนแล้ว</span>`;
                    lucide.createIcons();
                } else {
                    alert("ถูกปฏิเสธสิทธิ์การแจ้งเตือน");
                }
            });
        }

        function updateUVIndex() {
            const hour = new Date().getHours();
            const uvElem = document.getElementById('uv-index');
            
            if (hour >= 18 || hour < 6) {
                uvElem.innerHTML = `<span class="text-slate-300">0.0</span>`;
            } else if (hour >= 10 && hour <= 14) {
                uvElem.innerHTML = `<span class="text-amber-400">8.5</span>`;
            } else {
                uvElem.innerHTML = `<span class="text-yellow-400">3.2</span>`;
            }
        }

        async function fetchWeatherData(lat = currentLat, lon = currentLon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=auto`);
                const data = await res.json();
                const cur = data.current;
                
                document.getElementById('current-temp').innerText = `${Math.round(cur.temperature_2m)}°`;
                document.getElementById('feels-like').innerText = `รู้สึกเหมือน ${Math.round(cur.apparent_temperature)}°C`;
                document.getElementById('humidity').innerText = `${cur.relative_humidity_2m}%`;
                document.getElementById('wind-speed').innerText = `${cur.wind_speed_10m} km/h`;
                document.getElementById('pressure').innerText = `${Math.round(cur.surface_pressure)} hPa`;
                document.getElementById('weather-condition').innerText = getWeatherText(cur.weather_code);

                updateUVIndex();

                const hourlyContainer = document.getElementById('hourly-container');
                hourlyContainer.innerHTML = '';
                const currentHour = new Date().getHours();

                for (let i = currentHour; i < currentHour + 12; i++) {
                    const hourFormatted = `${String(i % 24).padStart(2, '0')}:00`;
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const item = document.createElement('div');
                    item.className = 'glass-card-sm flex-shrink-0 w-16 md:w-20 py-3 md:py-3.5 rounded-2xl text-center space-y-2';
                    item.innerHTML = `
                        <div class="text-[10px] md:text-xs text-slate-400 font-medium">${hourFormatted}</div>
                        <div class="text-blue-400 flex justify-center"><i data-lucide="${(i%24 >= 18 || i%24 < 6) ? 'moon' : 'sun'}" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                        <div class="text-xs md:text-sm font-bold text-white">${temp}°</div>
                    `;
                    hourlyContainer.appendChild(item);
                }
                lucide.createIcons();
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        function refreshData() {
            fetchWeatherData(currentLat, currentLon);
        }

        function getWeatherText(code) {
            const codes = { 0: 'ท้องฟ้าแจ่มใส', 1: 'มีเมฆบางส่วน', 2: 'มีเมฆเป็นส่วนมาก', 3: 'ท้องฟ้ามืดครึ้ม', 61: 'ฝนตกเล็กน้อย', 63: 'ฝนตกปานกลาง', 95: 'พายุฝนฟ้าคะนอง' };
            return codes[code] || 'มีเมฆบางส่วน';
        }

        // ขอสิทธิ์ระบุตำแหน่งอัตโนมัติเมื่อโหลดหน้าเว็บ
        window.addEventListener('load', () => {
            requestLocationPermission();
        });
    </script>
</body>
</html>
