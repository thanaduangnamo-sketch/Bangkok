<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับ</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Box -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.06)] border border-gray-100 p-8 text-center">
        
        <!-- Tab Navigation Bar -->
        <div class="flex border-b border-gray-100 mb-10">
            <button class="w-1/2 py-3 font-medium text-gray-400 text-sm">
                เข้าสู่ระบบ
            </button>
            <button class="w-1/2 py-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">
                สมัครสมาชิก
            </button>
        </div>

        <!-- Main Content inside Card -->
        <div class="py-6">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-600 mb-4 leading-tight">
                ยินดีต้อนรับสู่<br>แพลตฟอร์มของคุณ
            </h1>
            
            <p class="text-gray-500 text-sm mb-8">
                เพื่อเริ่มต้นการใช้งาน คลิกปุ่มด้านล่างนี้
            </p>

            <button onclick="alert('กำลังเริ่มต้นใช้งาน...')" class="w-full bg-[#4F46E5] hover:bg-indigo-700 text-white font-medium py-3.5 rounded-xl shadow-md transition duration-200 transform active:scale-95">
                เริ่มต้น
            </button>
        </div>

    </div>

</body>
</html>
