<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>GPS SHOP - Discord Login</title>
</head>
<body>

    <h1>กำลังเข้าสู่ระบบ...</h1>

    <!-- วางสคริปต์ไว้ด้านล่างสุดของ body -->
    <script>
      async function handleDiscordCallback() {
        // 1. ดึง URL Parameters เพื่อเอา code ที่ Discord ส่งมา
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (!code) {
          console.log("ไม่พบ Discord Code ใน URL");
          return;
        }

        try {
          // 2. ยิง API ไปที่ Backend (เปลี่ยน /api/discord-login เป็น URL API จริงของคุณ)
          const response = await fetch('/api/discord-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
          });

          // 3. ตรวจสอบว่า HTTP status OK หรือไม่
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server ตอบกลับข้อผิดพลาด (${response.status}): ${errorText}`);
          }

          // 4. อ่านข้อมูลเป็น Text ก่อน เพื่อป้องกันปัญหา JSON ค่าว่าง
          const responseText = await response.text();
          if (!responseText) {
            throw new Error("Server ส่งข้อมูลกลับมาเป็นค่าว่าง");
          }

          // 5. แปลงเป็น JSON และใช้งานข้อมูลผู้ใช้
          const userData = JSON.parse(responseText);
          console.log("ล็อกอินสำเร็จ! ข้อมูลผู้ใช้:", userData);
          alert(`ยินดีต้อนรับ ${userData.username}!`);

          // (ตัวอย่าง) บันทึกข้อมูลลง LocalStorage แล้วย้ายหน้า
          localStorage.setItem('user', JSON.stringify(userData));
          // window.location.href = '/dashboard.html';

        } catch (error) {
          console.error("Discord Login Error:", error);
          alert("การล็อกอินล้มเหลว: " + error.message);
        }
      }

      // เรียกทำงานทันทีเมื่อโหลดหน้าเว็บ
      window.addEventListener('DOMContentLoaded', handleDiscordCallback);
    </script>
</body>
</html>
