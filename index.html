<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAF SHOP | Secure Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-glow: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --discord-blurple: #5865F2;
            --discord-hover: #4752c4;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            overflow: hidden;
        }

        /* Ambient Glow Background Animation */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.05));
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }
        @keyframes float {
            0% { transform: translate(-50px, -50px) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Modern Glassmorphism Modal */
        .auth-modal-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .auth-modal-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 32px;
            padding: 42px 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: modalPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-icon-wrapper {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .login-btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 22px;
        }

        .btn-auth {
            width: 100%;
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid var(--border-glow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .btn-discord {
            background: var(--discord-blurple);
            color: white;
            border: none;
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.25);
        }
        .btn-discord:hover {
            background: var(--discord-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(88, 101, 242, 0.35);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin: 20px 0;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-glow);
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }
        .input-field:focus {
            border-color: var(--border-focus);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.4);
        }

        .security-badge {
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>

    <div class="auth-modal-overlay">
        <div class="auth-modal-card">
            <div class="modal-icon-wrapper">
                🛡️
            </div>
            <div class="modal-title">ยืนยันตัวตนก่อนเข้าสู่ระบบ</div>
            <p class="modal-subtitle">ระบบความปลอดภัย: ทุกบัญชีเริ่มต้นด้วยยอดเงิน 0.00 ฿</p>
            
            <div class="login-btn-group">
                <button class="btn-auth btn-discord" onclick="loginDiscord()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.010c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    เข้าสู่ระบบด้วย Discord
                </button>
            </div>

            <div class="divider">หรือใช้อีเมลยืนยันตัวตน</div>

            <form id="emailForm" onsubmit="event.preventDefault(); verifyEmail();">
                <div class="input-group">
                    <label class="input-label">อีเมลของคุณ</label>
                    <input type="email" id="userEmailInput" class="input-field" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn-submit">ยืนยันและเข้าสู่เว็บไซต์</button>
            </form>

            <div class="security-badge">
                🔒 ป้องกันบอทและยืนยันความเป็นมนุษย์แบบปลอดภัย
            </div>
        </div>
    </div>

    <script>
        const DISCORD_CLIENT_ID = "1532644387639660627";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const DISCORD_OAUTH_URL = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify&prompt=consent`;

        function loginDiscord() {
            window.location.href = DISCORD_OAUTH_URL;
        }

        function verifyEmail() {
            const emailInput = document.getElementById('userEmailInput');
            if(!emailInput || !emailInput.value.trim()) return;
            
            // กำหนดให้ทุกคนเริ่มต้นที่ 0 บาท
            const defaultBalance = 0.00;
            localStorage.setItem('dhaf_balance', defaultBalance);
            localStorage.setItem('dhaf_user_identity', JSON.stringify({ 
                name: emailInput.value.split('@')[0], 
                avatar: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg' 
            }));
            
            alert('ยืนยันตัวตนสำเร็จ! ยอดเงินเริ่มต้นของคุณคือ 0.00 ฿');
            window.location.reload();
        }
    </script>
</body>
</html>
