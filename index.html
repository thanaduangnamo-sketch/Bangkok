<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO SCRIPT | Bot Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    body { 
      background: #0a0a0c; 
      color: #00ff41; 
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .terminal {
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
    }
    .terminal-header {
      background: #1a1a1a;
      padding: 8px 16px;
      font-size: 12px;
      color: #888;
    }
    .terminal-body {
      padding: 16px;
      height: 400px;
      overflow-y: auto;
      font-size: 14px;
    }
  </style>
</head>
<body class="p-8">

  <nav class="flex justify-between items-center mb-8">
    <div class="text-2xl font-black text-white">PRO<span class="text-green-500">BOT</span> DASHBOARD</div>
    <div class="space-x-4">
      <button onclick="runBot()" class="bg-green-600 px-6 py-2 rounded font-bold text-black hover:bg-green-500 transition">START BOT</button>
      <button onclick="stopBot()" class="bg-red-600 px-6 py-2 rounded font-bold text-black hover:bg-red-500 transition">STOP BOT</button>
    </div>
  </nav>

  <div class="terminal flex-grow">
    <div class="terminal-header">C:\Windows\System32\node.exe - DiscordBotController.js</div>
    <div id="terminal-output" class="terminal-body">
      <div>> บอทพร้อมทำงาน... กดปุ่ม START เพื่อเริ่มต้น</div>
    </div>
  </div>

  <script>
    const output = document.getElementById('terminal-output');

    function log(message) {
      const line = document.createElement('div');
      line.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function runBot() {
      log("กำลังเชื่อมต่อ Discord API...");
      setTimeout(() => log("สถานะ: เชื่อมต่อสำเร็จ!"), 1000);
      setTimeout(() => log("บอทกำลังออนไลน์ในเซิร์ฟเวอร์..."), 2000);
      setTimeout(() => log("บอทเปิดใช้งานฟังก์ชัน: [Auto-Moderation, Music, Ticket]"), 3000);
    }

    function stopBot() {
      log("กำลังหยุดการทำงานของบอท...");
      setTimeout(() => log("บอทออฟไลน์แล้ว"), 1000);
    }
  </script>
</body>
</html>
