<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J Community Shop</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0304;
      --card-bg: #140a0c;
      --card-inner: #1c0e11;
      --primary-red: #ff2a4b;
      --primary-red-hover: #e01f3e;
      --discord-blue: #5865f2;
      --discord-blue-hover: #4752c4;
      --text-main: #ffffff;
      --text-muted: #99888c;
      --border-color: #2a181c;
      --truemoney-color: #ff8c00;
      --promptpay-color: #00427a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Background */
    body::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 42, 75, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Navbar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: rgba(10, 3, 4, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .logo-icon {
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, #ff2a4b, #800015);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255, 42, 75, 0.4);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      text-decoration: none;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
    }

    /* ปุ่มเติมเงิน */
    .btn-topup-nav {
      background: rgba(255, 42, 75, 0.15);
      border: 1px solid rgba(255, 42, 75, 0.4);
      color: var(--primary-red);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-topup-nav:hover {
      background: var(--primary-red);
      color: white;
      box-shadow: 0 0 15px rgba(255, 42, 75, 0.4);
    }

    /* ปุ่มล็อกอินปกติ */
    .btn-login-discord {
      background: var(--discord-blue);
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
      transition: all 0.2s;
    }

    .btn-login-discord:hover {
      background: var(--discord-blue-hover);
    }

    /* โปรไฟล์ Discord บน Navbar */
    .user-profile-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px 6px 8px;
      border-radius: 30px;
    }

    .user-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--discord-blue);
      object-fit: cover;
    }

    .user-name-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    .btn-logout-icon {
      background: rgba(255, 42, 75, 0.15);
      border: 1px solid rgba(255, 42, 75, 0.3);
      color: var(--primary-red);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 4px;
    }

    .btn-logout-icon:hover {
      background: var(--primary-red);
      color: white;
    }

    /* Hero Section */
    .hero-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .badge {
      background: rgba(255, 42, 75, 0.1);
      border: 1px solid rgba(255, 42, 75, 0.2);
      color: var(--primary-red);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .hero-title span {
      color: var(--primary-red);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .btn-main-cta {
      background: var(--discord-blue);
      color: white;
      text-decoration: none;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 30px rgba(88, 101, 242, 0.5);
      transition: all 0.3s ease;
    }

    .btn-main-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(88, 101, 242, 0.7);
      background: var(--discord-blue-hover);
    }

    /* Modal Background */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Topup Modal Window */
    .topup-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 42, 75, 0.1);
      position: relative;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .topup-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .topup-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .topup-title {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Payment Tabs */
    .payment-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active-tw {
      background: rgba(255, 140, 0, 0.15);
      border-color: var(--truemoney-color);
      color: #ffaa33;
    }

    .tab-btn.active-pp {
      background: rgba(0, 66, 122, 0.3);
      border-color: #0072ce;
      color: #33a0ff;
    }

    /* Input & Forms */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-field {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-red);
    }

    .btn-submit-topup {
      width: 100%;
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-topup:hover {
      background: var(--primary-red-hover);
    }

    .qr-box {
      text-align: center;
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 180px;
      margin: 0 auto 15px;
    }

    .qr-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    #statusMessage {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo">
      <div class="logo-icon">J</div>
      <span>J Community</span>
    </div>

    <div class="nav-links">
      <a class="nav-item active" href="#"><i data-lucide="home" style="width:16px; height:16px;"></i> หน้าหลัก</a>
      <!-- ปุ่มเติมเงินบน แถบบน -->
      <button class="btn-topup-nav" onclick="openTopupModal()">
        <i data-lucide="wallet" style="width:16px; height:16px;"></i> เติมเงิน
      </button>
    </div>

    <!-- โซนปุ่มล็อกอิน / แสดงโปรไฟล์บน Navbar -->
    <div id="authNavZone">
      <a id="navLoginBtn" href="https://discord.com/oauth2/authorize?client_id=1507932932466282516&response_type=token&redirect_uri=https%3A%2F%2Fsk-six-beryl.vercel.app%2F&scope=identify" class="btn-login-discord">
        <i data-lucide="message-square" style="width:16px; height:16px;"></i> เข้าสู่ระบบด้วย Discord
      </a>

      <div id="navProfileZone" class="user-profile-bar" style="display: none;">
        <img id="userAvatar" class="user-avatar-small" src="" alt="Avatar">
        <span id="userName" class="user-name-text">Loading...</span>
        <button class="btn-logout-icon" onclick="logoutDiscord()" title="ออกจากระบบ">
          <i data-lucide="log-out" style="width:14px; height:14px;"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-container">
    <div class="badge">
      <i data-lucide="sparkles" style="width:14px; height:14px;"></i> ยินดีต้อนรับ
    </div>
    <h1 class="hero-title">J Community <span>Shop</span></h1>
    <p class="hero-subtitle" id="heroSubtitle">ร้านของเรา — เข้าสู่ระบบด้วย Discord เพื่อเริ่มใช้งาน</p>

    <a id="heroCtaBtn" href="https://discord.com/oauth2/authorize?client_id=1507932932466282516&response_type=token&redirect_uri=https%3A%2F%2Fsk-six-beryl.vercel.app%2F&scope=identify" class="btn-main-cta">
      <i data-lucide="message-square" style="width:20px; height:20px;"></i> เข้าสู่ระบบด้วย Discord
    </a>
  </main>

  <!-- Topup Modal Window -->
  <div class="modal-overlay" id="topupModal">
    <div class="topup-card">
      <span class="close-btn" onclick="closeTopupModal()"><i data-lucide="x"></i></span>

      <div class="topup-header">
        <div class="topup-title">
          <i data-lucide="credit-card" style="color: var(--primary-red);"></i> เติมเงินเข้าระบบ
        </div>
      </div>

      <!-- Payment Method Tabs -->
      <div class="payment-tabs">
        <button class="tab-btn active-tw" id="tabTW" onclick="switchTab('tw')">
          <i data-lucide="gift" style="width:16px;"></i> ซอง TrueMoney
        </button>
        <button class="tab-btn" id="tabPP" onclick="switchTab('pp')">
          <i data-lucide="qr-code" style="width:16px;"></i> สแกน PromptPay
        </button>
      </div>

      <!-- 1. TrueMoney Voucher Form -->
      <div id="viewTW">
        <div class="form-group">
          <label class="form-label">กรอกลิงก์ซองอั่งเปา TrueMoney Wallet:</label>
          <input type="text" id="voucherUrl" class="input-field" placeholder="https://gift.truemoney.com/v2/verify?v=..." />
        </div>
        <button class="btn-submit-topup" onclick="processVoucher()">
          <i data-lucide="check-circle" style="width:18px;"></i> ยืนยันการเติมเงิน
        </button>
      </div>

      <!-- 2. PromptPay QR View -->
      <div id="viewPP" style="display: none;">
        <div class="qr-box">
          <!-- สามารถใส่ QR Code PromptPay จริงของคุณได้ที่นี่ -->
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY_EXAMPLE" alt="PromptPay QR">
        </div>
        <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
          สแกน QR Code ด้วยแอปธนาคารเพื่อทำรายการ
        </p>
      </div>

      <div id="statusMessage"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Modal Control
    const topupModal = document.getElementById('topupModal');
    function openTopupModal() { topupModal.classList.add('active'); }
    function closeTopupModal() { topupModal.classList.remove('active'); }

    topupModal.addEventListener('click', (e) => {
      if (e.target === topupModal) closeTopupModal();
    });

    // Tab Switcher
    function switchTab(type) {
      const tabTW = document.getElementById('tabTW');
      const tabPP = document.getElementById('tabPP');
      const viewTW = document.getElementById('viewTW');
      const viewPP = document.getElementById('viewPP');
      const statusMessage = document.getElementById('statusMessage');

      statusMessage.innerText = '';

      if (type === 'tw') {
        tabTW.className = 'tab-btn active-tw';
        tabPP.className = 'tab-btn';
        viewTW.style.display = 'block';
        viewPP.style.display = 'none';
      } else {
        tabTW.className = 'tab-btn';
        tabPP.className = 'tab-btn active-pp';
        viewTW.style.display = 'none';
        viewPP.style.display = 'block';
      }
    }

    // Process TrueMoney Voucher Link
    async function processVoucher() {
      const voucherInput = document.getElementById('voucherUrl').value.trim();
      const statusMessage = document.getElementById('statusMessage');

      if (!voucherInput) {
        statusMessage.style.color = '#ff2a4b';
        statusMessage.innerText = '❌ กรุณากรอกลิงก์ซองอั่งเปา';
        return;
      }

      statusMessage.style.color = '#ffaa33';
      statusMessage.innerText = '⏳ กำลังตรวจสอบซองอั่งเปา...';

      try {
        // ตัวอย่างการตัดเอา Code Voucher จากลิงก์
        const voucherCode = voucherInput.split('v=')[1] || voucherInput;

        /*
          💡 ตรงนี้คือจุดเชื่อมต่อระบบ Backend จริงของคุณ:
          ตัวอย่างยิง request ไปยัง API เติมเงินของคุณ เช่น:
          
          const res = await fetch('/api/topup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ voucher: voucherCode, token: localStorage.getItem('discord_token') })
          });
        */

        // ตัวอย่างการจำลองผลลัพธ์
        setTimeout(() => {
          statusMessage.style.color = '#28a745';
          statusMessage.innerText = '✅ เติมเงินสำเร็จเรียบร้อยแล้ว!';
          document.getElementById('voucherUrl').value = '';
        }, 1200);

      } catch (err) {
        statusMessage.style.color = '#ff2a4b';
        statusMessage.innerText = '❌ ไม่สามารถทำรายการได้ กรุณาลองใหม่อีกครั้ง';
      }
    }

    // Discord Login Check
    const navLoginBtn = document.getElementById('navLoginBtn');
    const navProfileZone = document.getElementById('navProfileZone');
    const heroCtaBtn = document.getElementById('heroCtaBtn');
    const heroSubtitle = document.getElementById('heroSubtitle');

    async function checkDiscordLogin() {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      let token = hashParams.get('access_token');

      if (token) {
        localStorage.setItem('discord_token', token);
        window.location.hash = '';
      } else {
        token = localStorage.getItem('discord_token');
      }

      if (token) {
        try {
          const response = await fetch('https://discord.com/api/v10/users/@me', {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (!response.ok) throw new Error('Token expired');

          const userData = await response.json();
          
          navLoginBtn.style.display = 'none';
          navProfileZone.style.display = 'flex';

          const avatarUrl = userData.avatar
            ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`
            : 'https://cdn.discordapp.com/embed/avatars/0.png';

          document.getElementById('userAvatar').src = avatarUrl;
          document.getElementById('userName').innerText = userData.global_name || userData.username;

          heroSubtitle.innerText = `ยินดีต้อนรับคุณ ${userData.global_name || userData.username} เข้าสู่ระบบแล้ว!`;
          heroCtaBtn.style.display = 'none';

          lucide.createIcons();

        } catch (err) {
          console.error('Login Error:', err);
          logoutDiscord();
        }
      }
    }

    function logoutDiscord() {
      localStorage.removeItem('discord_token');
      window.location.href = window.location.origin + window.location.pathname;
    }

    checkDiscordLogin();
  </script>
</body>
</html>
