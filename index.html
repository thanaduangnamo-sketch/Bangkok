<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J Community Shop</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0304;
      --card-bg: #140a0c;
      --input-bg: #221215;
      --primary-red: #ff2a4b;
      --primary-red-hover: #e01f3e;
      --discord-blue: #5865f2;
      --discord-blue-hover: #4752c4;
      --text-main: #ffffff;
      --text-muted: #99888c;
      --border-color: #2a181c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Radial Glow Background */
    body::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 42, 75, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Navbar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: rgba(10, 3, 4, 0.8);
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .logo-icon {
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, #ff2a4b, #800015);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255, 42, 75, 0.4);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-login-nav {
      background: #1c0d10;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-login-nav:hover {
      background: #281317;
    }

    .btn-register-nav {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 0 15px rgba(255, 42, 75, 0.4);
      transition: all 0.2s;
    }

    .btn-register-nav:hover {
      background: var(--primary-red-hover);
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.6);
    }

    /* Main Content (Landing View) */
    .hero-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .badge {
      background: rgba(255, 42, 75, 0.1);
      border: 1px solid rgba(255, 42, 75, 0.2);
      color: var(--primary-red);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .hero-title span {
      color: var(--primary-red);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .btn-main-cta {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 35px rgba(255, 42, 75, 0.5);
      transition: all 0.3s ease;
    }

    .btn-main-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 45px rgba(255, 42, 75, 0.7);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Auth Card Window */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 30px 28px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 75, 0.08);
      position: relative;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .auth-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .card-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-logo-icon {
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #ff2a4b, #99001a);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 auto 12px;
      box-shadow: 0 0 25px rgba(255, 42, 75, 0.5);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* Tab Switcher */
    .tab-container {
      display: flex;
      background: #0f0708;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-red);
      color: white;
      box-shadow: 0 0 15px rgba(255, 42, 75, 0.4);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary-red);
    }

    .form-input::placeholder {
      color: #665558;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.4);
      margin-top: 5px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-red-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Discord Button */
    .btn-discord {
      width: 100%;
      background: var(--discord-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .btn-discord:hover {
      background: var(--discord-blue-hover);
    }

    .card-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--primary-red);
      text-decoration: none;
      font-weight: 600;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo">
      <div class="logo-icon">J</div>
      <span>J Community</span>
    </div>
    <div class="nav-links">
      <i data-lucide="home" style="width:16px; height:16px;"></i> หน้าหลัก
    </div>
    <div class="nav-buttons">
      <button class="btn-login-nav" onclick="openModal('login')">
        <i data-lucide="log-in" style="width:16px; height:16px;"></i> เข้าสู่ระบบ
      </button>
      <button class="btn-register-nav" onclick="openModal('register')">
        <i data-lucide="user-plus" style="width:16px; height:16px;"></i> สมัคร
      </button>
    </div>
  </header>

  <!-- Hero / Landing Section -->
  <main class="hero-container">
    <div class="badge">
      <i data-lucide="sparkles" style="width:14px; height:14px;"></i> ยินดีต้อนรับ
    </div>
    <h1 class="hero-title">J Community <span>Shop</span></h1>
    <p class="hero-subtitle">ร้านของเรา — เข้าสู่ระบบเพื่อเริ่มใช้งาน</p>
    <button class="btn-main-cta" onclick="openModal('login')">
      <i data-lucide="shopping-bag" style="width:20px; height:20px;"></i> เข้าสู่ระบบ / สมัครสมาชิก
    </button>
  </main>

  <!-- Login/Register Modal Pop-up -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <span class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></span>

      <div class="card-header">
        <div class="card-logo-icon">J</div>
        <div class="card-title">J Community</div>
      </div>

      <!-- Tab Switcher -->
      <div class="tab-container">
        <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">
          <i data-lucide="log-in" style="width:16px; height:16px;"></i> เข้าสู่ระบบ
        </button>
        <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">
          <i data-lucide="user-plus" style="width:16px; height:16px;"></i> สมัครสมาชิก
        </button>
      </div>

      <!-- Form Content -->
      <form id="authForm" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label>อีเมล</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" class="form-input" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>รหัสผ่าน</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" class="form-input" placeholder="อย่างน้อย 6 ตัวอักษร" required>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <i data-lucide="log-in" style="width:18px; height:18px;"></i> เข้าสู่ระบบ
        </button>
      </form>

      <div class="divider">
        <span>หรือ</span>
      </div>

      <button class="btn-discord">
        <i data-lucide="message-square" style="width:18px; height:18px;"></i> เข้าสู่ระบบด้วย Discord
      </button>

      <div class="card-footer" id="cardFooter">
        ยังไม่มีบัญชี? <a href="#" onclick="switchTab('register')">สมัครสมาชิก</a>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const modal = document.getElementById('authModal');
    const tabLoginBtn = document.getElementById('tabLoginBtn');
    const tabRegisterBtn = document.getElementById('tabRegisterBtn');
    const submitBtn = document.getElementById('submitBtn');
    const cardFooter = document.getElementById('cardFooter');

    function openModal(mode = 'login') {
      modal.classList.add('active');
      switchTab(mode);
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    // Close when clicking outside card
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    function switchTab(mode) {
      if (mode === 'login') {
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
        submitBtn.innerHTML = `<i data-lucide="log-in" style="width:18px; height:18px;"></i> เข้าสู่ระบบ`;
        cardFooter.innerHTML = `ยังไม่มีบัญชี? <a href="#" onclick="switchTab('register')">สมัครสมาชิก</a>`;
      } else {
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
        submitBtn.innerHTML = `<i data-lucide="user-plus" style="width:18px; height:18px;"></i> สมัครสมาชิก`;
        cardFooter.innerHTML = `มีบัญชีอยู่แล้ว? <a href="#" onclick="switchTab('login')">เข้าสู่ระบบ</a>`;
      }
      lucide.createIcons(); // Refresh icons
    }
  </script>
</body>
</html>
