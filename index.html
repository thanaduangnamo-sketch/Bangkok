<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J Community</title>
    <!-- โหลดฟอนต์ Google Fonts (Kanit) เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #0f172a; /* พื้นหลังโทนเข้ม */
            color: #ffffff;
        }

        /* แถบบน (OS Top Bar) */
        .os-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 2rem;
            background: rgba(30, 41, 59, 0.7); /* กระจกใสแบบ OS Modern */
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* โลโก้ J Community */
        .brand-logo {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        /* กลุ่มเมนูนำทาง */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #cbd5e1;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        /* Effect ตอนเอาเมาส์ชี้เมนู */
        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ปุ่มเข้าสู่ระบบแบบพิเศษ */
        .btn-login {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff !important;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8) !important;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.5);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- OS Top Navbar -->
    <nav class="os-navbar">
        <div class="brand-logo">
            𝗝 𝗖𝗼𝗺𝗺𝘂𝗻𝗶𝘁𝘆
        </div>
        
        <ul class="nav-links">
            <li><a href="#">หน้าแรก</a></li>
            <li><a href="#">ร้านค้า</a></li>
            <li><a href="#">เติมเงิน</a></li>
            <li><a href="#" class="btn-login">เข้าสู่ระบบ</a></li>
        </ul>
    </nav>

</body>
</html>
