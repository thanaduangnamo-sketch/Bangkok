<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าเติมเงิน - Top Up</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Sukhumvit / Kanit จาก Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl shadow-indigo-500/10">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
        เติมเงินเข้าบัญชี
      </h1>
      <p class="text-xs text-slate-400 mt-1">สแกน QR Code ผ่านแอปธนาคารได้ทุกธนาคาร</p>
    </div>

    <!-- Step 1: เลือกจำนวนเงิน -->
    <div class="mb-6">
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
        1. เลือกจำนวนเงิน
      </label>
      <div class="grid grid-cols-3 gap-2">
        <button class="py-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-indigo-500 hover:bg-indigo-500/10 transition text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          ฿50
        </button>
        <button class="py-2.5 rounded-xl border border-indigo-500 bg-indigo-500/20 text-indigo-300 text-sm font-medium focus:ring-2 focus:ring-indigo-500">
          ฿100
        </button>
        <button class="py-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-indigo-500 hover:bg-indigo-500/10 transition text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          ฿300
        </button>
        <button class="py-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-indigo-500 hover:bg-indigo-500/10 transition text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          ฿500
        </button>
        <button class="py-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-indigo-500 hover:bg-indigo-500/10 transition text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          ฿1,000
        </button>
        <button class="py-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-indigo-500 hover:bg-indigo-500/10 transition text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          ระบุเอง
        </button>
      </div>
    </div>

    <!-- Step 2: แสดง QR Code และยอดเงิน -->
    <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-5 text-center relative overflow-hidden mb-6">
      <!-- Glow Decor -->
      <div class="absolute -top-12 -right-12 w-24 h-24 bg-indigo-500/20 rounded-full blur-2xl"></div>
      
      <p class="text-xs text-slate-400 mb-1">ยอดที่ต้องชำระ</p>
      <div class="text-3xl font-extrabold text-white mb-4">
        ฿100.<span class="text-indigo-400 text-xl">00</span>
      </div>

      <!-- Container ใส่ QR Code -->
      <div class="bg-white p-3 rounded-2xl inline-block shadow-lg shadow-black/50 mb-3">
        <!-- คุณสามารถใช้ tag <img> หรือ JS Render สแกนสร้าง QR Code ตรงนี้ได้ -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://yourwebsite.com" alt="PromptPay QR Code" class="w-44 h-44 rounded-lg">
      </div>

      <div class="flex items-center justify-center gap-2 text-xs text-emerald-400 bg-emerald-500/10 py-1.5 px-3 rounded-full w-fit mx-auto border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        พร้อมพย์ (PromptPay) อัตโนมัติ
      </div>
    </div>

    <!-- Step 3: หมายเหตุและสถานะ -->
    <div class="space-y-3">
      <button class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 font-semibold rounded-xl transition duration-200 shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
        <span>ตรวจสอบสถานะการชำระเงิน</span>
      </button>

      <p class="text-[11px] text-center text-slate-500">
        ระบบจะปรับยอดให้อัตโนมัติภายใน 1-3 นาที หลังการโอนเงินสำเร็จ
      </p>
    </div>

  </div>

</body>
</html>
