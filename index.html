<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J Community Shop</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0304;
      --card-bg: #140a0c;
      --input-bg: #221215;
      --primary-red: #ff2a4b;
      --primary-red-hover: #e01f3e;
      --discord-blue: #5865f2;
      --discord-blue-hover: #4752c4;
      --text-main: #ffffff;
      --text-muted: #99888c;
      --border-color: #2a181c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow Effect */
    body::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 42, 75, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header / Navbar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: rgba(10, 3, 4, 0.8);
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .logo-icon {
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, #ff2a4b, #800015);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255, 42, 75, 0.4);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-login-nav {
      background: var(--primary-red);
      color: var(--text-main);
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(255, 42, 75, 0.4);
      transition: all 0.2s;
    }

    .btn-login-nav:hover {
      background: var(--primary-red-hover);
    }

    /* Hero / Landing Section */
    .hero-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .badge {
      background: rgba(255, 42, 75, 0.1);
      border: 1px solid rgba(255, 42, 75, 0.2);
      color: var(--primary-red);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .hero-title span {
      color: var(--primary-red);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .btn-main-cta {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 35px rgba(255, 42, 75, 0.5);
      transition: all 0.3s ease;
    }

    .btn-main-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 45px rgba(255, 42, 75, 0.7);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Auth Card Window */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 75, 0.08);
      position: relative;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .auth-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .card-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-logo-icon {
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #ff2a4b, #99001a);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 auto 12px;
      box-shadow: 0 0 25px rgba(255, 42, 75, 0.5);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* Form UI */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary-red);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.4);
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-red-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin: 22px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Discord Button */
    .btn-discord {
      width: 100%;
      background: var(--discord-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-discord:hover {
      background: var(--discord-blue-hover);
    }

    /* Profile View (Discord Logged In) */
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 10px 0;
    }

    .user-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 3px solid var(--discord-blue);
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
      object-fit: cover;
    }

    .user-name {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .discord-badge {
      background: rgba(88, 101, 242, 0.15);
      border: 1px solid rgba(88, 101, 242, 0.3);
      color: #7289da;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout {
      width: 100%;
      background: #2a181c;
      color: var(--primary-red);
      border: 1px solid var(--border-color);
      padding: 11px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(255, 42, 75, 0.15);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo">
      <div class="logo-icon">J</div>
      <span>J Community</span>
    </div>
    <div class="nav-links">
      <i data-lucide="home" style="width:16px; height:16px;"></i> หน้าหลัก
    </div>
    <div class="nav-buttons">
      <button class="btn-login-nav" id="navLoginBtn" onclick="openModal()">
        <i data-lucide="log-in" style="width:16px; height:16px;"></i> เข้าสู่ระบบ
      </button>
    </div>
  </header>

  <!-- Hero Landing Section -->
  <main class="hero-container">
    <div class="badge">
      <i data-lucide="sparkles" style="width:14px; height:14px;"></i> ยินดีต้อนรับ
    </div>
    <h1 class="hero-title">J Community <span>Shop</span></h1>
    <p class="hero-subtitle">ร้านของเรา — เข้าสู่ระบบเพื่อเริ่มใช้งาน</p>
    <button class="btn-main-cta" id="mainCtaBtn" onclick="openModal()">
      <i data-lucide="shopping-bag" style="width:20px; height:20px;"></i> เข้าสู่ระบบ
    </button>
  </main>

  <!-- Login & Profile Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <span class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></span>

      <!-- 1. Form เข้าสู่ระบบปกติ -->
      <div id="loginView">
        <div class="card-header">
          <div class="card-logo-icon">J</div>
          <div class="card-title">J Community</div>
        </div>

        <form onsubmit="event.preventDefault();">
          <div class="form-group">
            <label>ชื่ออีเมลย่อของคุณ</label>
            <div class="input-wrapper">
              <i data-lucide="mail" class="input-icon"></i>
              <input type="text" class="form-input" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="form-group">
            <label>รหัสผ่าน</label>
            <div class="input-wrapper">
              <i data-lucide="lock" class="input-icon"></i>
              <input type="password" class="form-input" placeholder="อย่างน้อย 6 ตัวอักษร" required>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <i data-lucide="log-in" style="width:18px; height:18px;"></i> เข้าสู่ระบบ
          </button>
        </form>

        <div class="divider">
          <span>หรือ</span>
        </div>

        <!-- ปรับเปลี่ยนลิงก์เป็น response_type=token เพื่อให้ดึง API Direct ได้ -->
        <a href="https://discord.com/oauth2/authorize?client_id=1507932932466282516&response_type=token&redirect_uri=https%3A%2F%2Fsk-mz85xpjrz-thanaduangnamo-sketchs-projects.vercel.app%2F&scope=identify" class="btn-discord">
          <i data-lucide="message-square" style="width:18px; height:18px;"></i> เข้าสู่ระบบด้วย Discord
        </a>
      </div>

      <!-- 2. Profile เมื่อล็อกอิน Discord สำเร็จ -->
      <div id="profileView" style="display: none;">
        <div class="profile-container">
          <img id="discordAvatar" class="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord Avatar">
          <div class="user-name" id="discordUsername">กำลังโหลด...</div>
          <div class="discord-badge">
            <i data-lucide="check-circle" style="width:14px; height:14px;"></i> เชื่อมต่อ Discord แล้ว
          </div>
        </div>

        <button class="btn-logout" onclick="logoutDiscord()">
          <i data-lucide="log-out" style="width:16px; height:16px;"></i> ออกจากระบบ
        </button>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    const modal = document.getElementById('authModal');
    const loginView = document.getElementById('loginView');
    const profileView = document.getElementById('profileView');
    const navLoginBtn = document.getElementById('navLoginBtn');
    const mainCtaBtn = document.getElementById('mainCtaBtn');

    function openModal() { modal.classList.add('active'); }
    function closeModal() { modal.classList.remove('active'); }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    async function checkDiscordLogin() {
      // 1. ตรวจหา Token จาก URL Hash (ที่ส่งกลับมาจาก Discord)
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      let token = hashParams.get('access_token');

      if (token) {
        localStorage.setItem('discord_token', token);
        window.location.hash = ''; // ล้าง Token จากแถบ URL เพื่อความปลอดภัย
      } else {
        token = localStorage.getItem('discord_token');
      }

      // 2. ถ้านำ Token ไปร้องขอ API Discord สำเร็จ ให้เปลี่ยนมุมมองเป็นหน้าโปรไฟล์
      if (token) {
        try {
          const response = await fetch('https://discord.com/api/v10/users/@me', {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (!response.ok) throw new Error('Token หมดอายุ');

          const userData = await response.json();
          renderProfile(userData.global_name || userData.username, userData.id, userData.avatar);
          openModal(); // เปิด Modal หน้าโปรไฟล์ขึ้นมาอัตโนมัติ

        } catch (err) {
          console.error('Login Failed:', err);
          logoutDiscord();
        }
      }
    }

    function renderProfile(username, id, avatar) {
      loginView.style.display = 'none';
      profileView.style.display = 'block';

      const avatarUrl = (id && avatar) 
        ? `https://cdn.discordapp.com/avatars/${id}/${avatar}.png`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';

      document.getElementById('discordAvatar').src = avatarUrl;
      document.getElementById('discordUsername').innerText = username;

      navLoginBtn.innerHTML = `<i data-lucide="user" style="width:16px; height:16px;"></i> โปรไฟล์`;
      mainCtaBtn.innerHTML = `<i data-lucide="user" style="width:20px; height:20px;"></i> ดูโปรไฟล์ของคุณ`;
      lucide.createIcons();
    }

    function logoutDiscord() {
      localStorage.removeItem('discord_token');
      window.location.href = window.location.origin + window.location.pathname;
    }

    checkDiscordLogin();
  </script>
</body>
</html>
