<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Web Platform</title>
  <style>
    :root { 
      --primary: #6366f1; 
      --discord-blurple: #5865F2; 
      --bg-color: #ffffff; 
      --text-main: #111827; 
      --text-muted: #4b5563; 
      --border-color: #e5e7eb; 
    }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
    }
    
    .navbar { 
      display: flex; 
      justify-content: center; 
      gap: 8px; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(12px); 
      border: 1px solid var(--border-color); 
      padding: 8px 16px; 
      margin-top: 24px; 
      border-radius: 99px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
      position: sticky; 
      top: 20px; 
      z-index: 1000; 
    }
    
    .navbar a { 
      color: var(--text-muted); 
      padding: 8px 18px; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 500; 
      border-radius: 99px; 
      cursor: pointer; 
      transition: 0.25s; 
    }
    
    .navbar a:hover, .navbar a.active { 
      background: var(--primary); 
      color: white; 
    }
    
    .container { 
      width: 100%; 
      max-width: 500px; 
      padding: 40px 20px; 
      box-sizing: border-box; 
    }
    
    .card { 
      background: #ffffff; 
      border: 1px solid var(--border-color); 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
      text-align: center; 
    }
    
    #register, #login { 
      max-width: 400px; 
      margin: 0 auto; 
    }
    
    .user-badge { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      background: #f8fafc; 
      border: 1px solid var(--border-color); 
      padding: 12px 16px; 
      border-radius: 14px; 
      margin-bottom: 20px; 
      text-align: left; 
    }
    
    .user-avatar { 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 2px solid var(--primary); 
    }
    
    .user-info .name { 
      font-weight: 600; 
      font-size: 14px; 
      color: var(--text-main); 
      margin: 0; 
    }
    
    .user-info .sub { 
      font-size: 12px; 
      color: var(--text-muted); 
      margin: 0; 
    }

    input, select { 
      width: 100%; 
      padding: 10px; 
      margin-bottom: 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      box-sizing: border-box; 
      font-size: 14px; 
      outline: none;
    }
    
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    button { 
      width: 100%; 
      padding: 12px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-bottom: 10px; 
      transition: background 0.2s;
    }

    button:hover {
      background: #4f46e5;
    }
    
    .btn-discord { 
      background: var(--discord-blurple); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      text-decoration: none;
      color: white;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 14px;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    
    .btn-discord:hover { 
      background: #4752c4; 
    }

    .hidden { 
      display: none !important; 
    }
    
    h1 { 
      font-size: 22px; 
      margin-bottom: 15px; 
    }
    
    .divider { 
      font-size: 12px; 
      color: var(--text-muted); 
      margin: 10px 0; 
    }

    .switch-auth {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 15px;
    }

    .switch-auth span {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .switch-auth span:hover {
      color: #4f46e5;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a onclick="showPage('home', this)" class="active">หน้าหลัก</a>
    <a onclick="alert('หน้าซื้อของยังใช้งานไม่ได้')">หน้าซื้อของ</a>
    <a onclick="showPage('register', this)">สมัครบัญชี</a>
    <a onclick="showPage('login', this)">ล็อกอิน</a>
  </div>

  <div class="container">
    <div id="home" class="card">
      <div id="user-display" class="user-badge hidden">
        <img id="user-avatar-img" class="user-avatar" src="" alt="Avatar">
        <div class="user-info">
          <p class="name" id="display-name">ชื่อผู้ใช้</p>
          <p class="sub" id="display-sub">อีเมล</p>
        </div>
      </div>
      <h1>ยินดีต้อนรับ</h1>
      <p style="font-size: 14px; color: var(--text-muted);">ระบบเว็บแอปพลิเคชันที่มีความเร็วสูง ปลอดภัย และทันสมัย (GitHub Pages)</p>
    </div>
    
    <div id="register" class="card hidden">
      <h1>สมัครสมาชิก</h1>
      <input type="text" id="reg-fullname" placeholder="ชื่อ-นามสกุล">
      <input type="text" id="reg-username" placeholder="ชื่อผู้ใช้งาน">
      <input type="email" id="reg-email" placeholder="อีเมล">
      <input type="tel" id="reg-phone" placeholder="เบอร์โทรศัพท์">
      <select id="reg-gender">
        <option value="">เลือกเพศ</option>
        <option value="Male">ชาย</option>
        <option value="Female">หญิง</option>
        <option value="Other">อื่นๆ</option>
      </select>
      <button onclick="registerUser()">ยืนยันการสมัคร</button>

      <div class="switch-auth">
        มีบัญชีแล้วหรอ? <span onclick="switchToLogin()">กดตรงนี้</span>
      </div>
    </div>

    <div id="login" class="card hidden">
      <h1>เข้าสู่ระบบ</h1>
      <input type="text" placeholder="ชื่อผู้ใช้หรืออีเมล">
      <input type="password" placeholder="รหัสผ่าน">
      <button onclick="alert('ระบบล็อกอินปกติยังไม่เปิดใช้งาน')">เข้าสู่ระบบ</button>
      
      <div class="divider">หรือ</div>
      
      <a class="btn-discord" href="https://discord.com/oauth2/authorize?client_id=1532644387639660627&response_type=code&redirect_uri=https%3A%2F%2Fthanaduangnamo-sketch.github.io%2Fshop.github.io%2F&scope=identify">
        <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        ล็อกอินผ่าน Discord
      </a>
    </div>
  </div>

  <script>
    function showPage(pageId, element) {
      document.getElementById('home').classList.add('hidden');
      document.getElementById('register').classList.add('hidden');
      document.getElementById('login').classList.add('hidden');
      document.getElementById(pageId).classList.remove('hidden');
      document.querySelectorAll('.navbar a').forEach(a => a.classList.remove('active'));
      if(element) element.classList.add('active');
    }

    function switchToLogin() {
      let loginNavbarBtn = document.querySelectorAll('.navbar a')[3]; 
      showPage('login', loginNavbarBtn);
    }

    function maskEmail(email) {
      if (!email) return "";
      let parts = email.split('@');
      return parts[0].substring(0, 2) + '*****@' + parts[1];
    }

    function registerUser() {
      let data = {
        fullname: document.getElementById('reg-fullname').value,
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        phone: document.getElementById('reg-phone').value,
        gender: document.getElementById('reg-gender').value
      };

      if(!data.fullname || !data.username || !data.email) {
        alert('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน');
        return;
      }

      alert('สมัครสมาชิกสำเร็จ!');
      document.getElementById('display-name').innerText = data.username;
      document.getElementById('display-sub').innerText = maskEmail(data.email);
      document.getElementById('user-avatar-img').src = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png";
      document.getElementById('user-display').classList.remove('hidden');
      showPage('home', document.querySelector('.navbar a'));
    }
  </script>
</body>
</html>
