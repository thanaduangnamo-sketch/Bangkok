<!-- ================= เริ่มต้นส่วน Navbar ด้านบน ================= -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* สไตล์เฉพาะส่วน Navbar */
    .top-navbar {
        background-color: #99262b; /* โทนสีแดงเข้มตามภาพ */
        height: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 30px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        position: sticky;
        top: 0;
        z-index: 1000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* เมนูฝั่งซ้าย */
    .nav-left-menu {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .nav-item-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0.9;
        transition: all 0.2s;
    }

    .nav-item-link:hover {
        opacity: 1;
        transform: translateY(-1px);
    }

    /* เมนูฝั่งขวา */
    .nav-right-menu {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    /* ช่องค้นหาสินค้าทรงแคปซูล */
    .nav-search-box {
        position: relative;
        display: flex;
        align-items: center;
    }

    .nav-search-box input {
        background-color: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50px;
        padding: 8px 16px 8px 38px;
        color: #ffffff;
        font-size: 0.9rem;
        outline: none;
        width: 180px;
        transition: all 0.3s;
    }

    .nav-search-box input::placeholder {
        color: #d1d5db;
    }

    .nav-search-box input:focus {
        width: 210px;
        background-color: rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.4);
    }

    .nav-search-box i {
        position: absolute;
        left: 14px;
        color: #d1d5db;
        font-size: 0.9rem;
        pointer-events: none;
    }

    /* ปุ่มเข้าสู่ระบบ */
    .nav-btn-login {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        padding: 8px 10px;
        transition: opacity 0.2s;
    }

    .nav-btn-login:hover {
        opacity: 0.8;
    }

    /* ปุ่มสมัครสมาชิก */
    .nav-btn-register {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        background-color: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 18px;
        border-radius: 8px;
        transition: all 0.3s;
    }

    .nav-btn-register:hover {
        background-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
    }
</style>

<!-- โครงสร้าง Navbar -->
<nav class="top-navbar">
    <!-- เมนูฝั่งซ้าย -->
    <div class="nav-left-menu">
        <a href="#" class="nav-item-link">
            <i class="fa-solid fa-house"></i> หน้าแรก
        </a>
        <a href="#" class="nav-item-link">
            <i class="fa-solid fa-box-open"></i> สินค้าทั้งหมด
        </a>
        <a href="#" class="nav-item-link">
            <i class="fa-solid fa-credit-card"></i> เติมเงิน
        </a>
        <a href="#" class="nav-item-link">
            <i class="fa-solid fa-headset"></i> ติดต่อเรา
        </a>
    </div>

    <!-- เมนูฝั่งขวา -->
    <div class="nav-right-menu">
        <div class="nav-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="ค้นหาสินค้า">
        </div>
        <a href="#" class="nav-btn-login">เข้าสู่ระบบ</a>
        <a href="#" class="nav-btn-register">สมัครสมาชิก</a>
    </div>
</nav>
<!-- ================= สิ้นสุดส่วน Navbar ด้านบน ================= -->
