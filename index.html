<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Verification | ระบบยืนยันตัวตน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a102f, #5865F2);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .glass { 
      background: rgba(18, 18, 26, 0.75); 
      backdrop-filter: blur(25px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="p-6">

  <!-- กล่องหลักสำหรับยืนยันตัวตน (หน้าแรก) -->
  <div id="auth-card" class="glass max-w-md w-full p-8 rounded-3xl text-center">
    <div class="w-20 h-20 bg-[#5865F2]/20 border border-[#5865F2]/40 rounded-full mx-auto mb-6 flex items-center justify-center text-3xl">
      🛡️
    </div>
    <h1 class="text-3xl font-black mb-2">VERIFICATION</h1>
    <p class="text-gray-400 mb-8 text-sm">กรุณายยืนยันตัวตนผ่านบัญชี Discord ของคุณเพื่อเข้าใช้งานระบบและรับยศ</p>
    
    <button onclick="loginDiscord()" class="w-full py-4 bg-[#5865F2] hover:bg-[#4752C4] transition-all rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg shadow-[#5865F2]/30 text-white">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      ยืนยันตัวตนผ่าน Discord
    </button>
  </div>

  <!-- กล่องแสดงผลหลังยืนยันตัวตนสำเร็จ (ซ่อนไว้ก่อน) -->
  <div id="success-card" class="glass max-w-md w-full p-8 rounded-3xl text-center hidden">
    <div class="relative w-28 h-28 mx-auto mb-6">
      <img id="user-avatar" src="" class="w-28 h-28 rounded-full border-4 border-emerald-500 object-cover shadow-xl">
      <div class="absolute bottom-0 right-0 bg-emerald-500 text-black p-1.5 rounded-full text-xs font-bold">✔</div>
    </div>
    
    <h2 class="text-xs tracking-widest text-emerald-400 font-bold uppercase mb-1">ยืนยันตัวตนสำเร็จ</h2>
    <h3 id="user-display" class="text-2xl font-black mb-1 text-white">...</h3>
    <p id="user-id" class="text-xs text-gray-400 mb-6 code-font">ID: ...</p>
    
    <div class="bg-white/5 border border-white/10 rounded-2xl p-4 mb-6 text-sm text-gray-300">
      ระบบได้บันทึกการยืนยันตัวตนของคุณเรียบร้อยแล้ว คุณสามารถปิดหน้านี้หรือกลับเข้า Discord ได้เลยครับ
    </div>

    <button onclick="logout()" class="w-full py-3 bg-red-600/20 border border-red-500/30 hover:bg-red-600 text-red-300 hover:text-white transition-all rounded-xl font-bold text-sm">
      ออกจากระบบ / ยกเลิก
    </button>
  </div>

  <script>
    // ตั้งค่า Client ID ของ Discord บอทของคุณที่นี่
    const CLIENT_ID = '1532644387639660627';
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    function loginDiscord() {
      // ใช้ response_type=token เพื่อดึง Access Token กลับมาอ่านข้อมูลผู้ใช้ฝั่งหน้าเว็บโดยตรง
      const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
      window.location.href = authUrl;
    }

    // ฟังก์ชันดึงข้อมูลผู้ใช้จาก Discord API
    async function fetchUserData(accessToken) {
      try {
        const response = await fetch('https://discord.com/api/users/@me', {
          headers: {
            authorization: `Bearer ${accessToken}`,
          },
        });
        const data = await response.json();
        
        if (data.id) {
          // แสดงข้อมูลบนหน้าเว็บ
          document.getElementById('user-display').innerText = data.username;
          document.getElementById('user-id').innerText = `Discord ID: ${data.id}`;
          
          // ตรวจสอบรูปโปรไฟล์ (Avatar) ว่ามีหรือไม่ ถ้าไม่มีใช้รูป default
          let avatarUrl = `https://cdn.discordapp.com/embed/avatars/0.png`;
          if (data.avatar) {
            const isAnimated = data.avatar.startsWith('a_');
            const ext = isAnimated ? 'gif' : 'png';
            avatarUrl = `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.${ext}`;
          }
          document.getElementById('user-avatar').src = avatarUrl;

          // สลับหน้าจอ
          document.getElementById('auth-card').classList.add('hidden');
          document.getElementById('success-card').classList.remove('hidden');
        }
      } catch (error) {
        console.error('Error fetching user data:', error);
      }
    }

    // ตรวจสอบ Hash Token ใน URL เมื่อโหลดหน้าเว็บเสร็จ
    window.onload = function() {
      const fragment = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = fragment.get('access_token');
      
      if (accessToken) {
        // บันทึก Token ไว้ใน Session Storage และเคลียร์ URL ให้สะอาด
        sessionStorage.setItem('discord_token', accessToken);
        window.history.replaceState({}, document.title, window.location.pathname);
        fetchUserData(accessToken);
      } else {
        // เช็คว่าเคยล็อกอินไว้ไหม
        const savedToken = sessionStorage.getItem('discord_token');
        if (savedToken) {
          fetchUserData(savedToken);
        }
      }
    }

    function logout() {
      sessionStorage.removeItem('discord_token');
      window.location.href = REDIRECT_URI;
    }
  </script>
</body>
</html>
