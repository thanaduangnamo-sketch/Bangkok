<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ / สมัครสมาชิก</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        
        <!-- Tab Switches -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="loginTabBtn" onclick="switchTab('login')" class="w-1/2 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">
                เข้าสู่ระบบ
            </button>
            <button id="registerTabBtn" onclick="switchTab('register')" class="w-1/2 py-3 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition">
                สมัครสมาชิก
            </button>
        </div>

        <!-- Form 1: Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล / ชื่อผู้ใช้</label>
                <input type="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center text-gray-500">
                    <input type="checkbox" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2"> จดจำฉันไว้
                </label>
                <a href="#" class="text-indigo-600 hover:underline">ลืมรหัสผ่าน?</a>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Form 2: Register (Hidden by default) -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" required placeholder="สมชาย สายลุย" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                <input type="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                <input type="password" required placeholder="อย่างน้อย 8 ตัวอักษร" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่าน</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                ยืนยันการสมัครสมาชิก
            </button>
        </form>

    </div>

    <!-- JavaScript สลับ Tab และจัดการ Form -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "w-1/2 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                registerTabBtn.className = "w-1/2 py-3 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "w-1/2 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                loginTabBtn.className = "w-1/2 py-3 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            alert('ส่งข้อมูลเข้าสู่ระบบเรียบร้อยแล้ว');
        }

        function handleRegister(e) {
            e.preventDefault();
            alert('ส่งข้อมูลสมัครสมาชิกเรียบร้อยแล้ว');
        }
    </script>
</body>
</html>
