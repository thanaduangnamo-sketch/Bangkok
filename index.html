<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J Community - หน้าหลัก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #08030a;
      --card-bg: #110a17;
      --card-inner: #180e21;
      --primary-purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --text-main: #ffffff;
      --text-muted: #a095b0;
      --border-color: #281838;
      --discord-blue: #5865f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 5%; background: rgba(8, 3, 10, 0.85);
      border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px);
    }

    .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; cursor: pointer; }
    .logo img { width: 38px; height: 38px; border-radius: 10px; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-item { color: var(--text-muted); cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .nav-item:hover, .nav-item.active { color: #fff; }

    .btn-topup {
      background: var(--primary-purple); color: white; padding: 8px 18px;
      border-radius: 20px; text-decoration: none; font-weight: 600;
      box-shadow: 0 0 12px var(--purple-glow); display: flex; align-items: center; gap: 6px;
    }

    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .hero-section { text-align: center; padding: 60px 0; }
    .hero-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
    .hero-subtitle { color: var(--text-muted); font-size: 1.1rem; }

    .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; text-align: center; }
    .product-title { font-size: 1.2rem; margin: 10px 0; }
    .product-price { color: #4cd964; font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; }
    .btn-buy { background: var(--primary-purple); color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='index.html'">
      <img src="https://media.discordapp.net/attachments/1530928529657827411/1531541817697370213/ChatGPT_Image_26_.._2569_11_43_34.png" alt="Logo">
      <span>J Community</span>
    </div>

    <div class="nav-links">
      <a class="nav-item active" href="index.html"><i data-lucide="home" style="width:16px;"></i> หน้าหลัก</a>
      <a class="nav-item" href="#shopSection"><i data-lucide="shopping-bag" style="width:16px;"></i> ร้านค้า</a>
      
      <!-- ปุ่มวาร์ปไปหน้าเติมเงิน -->
      <a class="btn-topup" href="topup.html">
        <i data-lucide="wallet" style="width:16px;"></i> เติมเงิน
      </a>
    </div>
  </header>

  <div class="container">
    <div class="hero-section">
      <h1 class="hero-title">ยินดีต้อนรับสู่ J Community</h1>
      <p class="hero-subtitle">เลือกร้านค้าเพื่อสั่งซื้อสินค้าและบริการได้ที่นี่</p>
    </div>

    <!-- ส่วนร้านค้า -->
    <div id="shopSection">
      <h2 style="font-size: 1.8rem; margin-bottom: 20px;"><i data-lucide="shopping-bag" style="color: var(--primary-purple);"></i> สินค้าแนะนำ</h2>
      
      <div class="shop-grid">
        <div class="product-card">
          <div class="product-title">VIP Membership (30 วัน)</div>
          <div class="product-price">150 ฿</div>
          <button class="btn-buy" onclick="alert('สั่งซื้อสำเร็จ!')">ซื้อสินค้า</button>
        </div>
        <div class="product-card">
          <div class="product-title">ยศ Discord พิเศษ</div>
          <div class="product-price">50 ฿</div>
          <button class="btn-buy" onclick="alert('สั่งซื้อสำเร็จ!')">ซื้อสินค้า</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
