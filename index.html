<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อแอดมิน - J Community</title>
    <!-- โหลด FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f8fafc;
            /* พื้นหลังโทนสีขาว-ฟ้าพาสเทล นุ่มสบายตา */
            background-image: 
                radial-gradient(circle at 10% 20%, #e0f2fe 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, #f1f5f9 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* การ์ดฟอร์มติดต่อโทนสีขาวคลีน */
        .contact-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 40px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon-badge {
            width: 60px;
            height: 60px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 15px auto;
        }

        .title {
            font-size: 1.6rem;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group label i {
            color: #0284c7;
            margin-right: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #1e293b;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .input-field:focus {
            background-color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 110px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.35);
            background: linear-gradient(135deg, #0369a1, #075985);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .footer-credit {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="header-section">
            <div class="icon-badge">
                <i class="fa-solid fa-headset"></i>
            </div>
            <h1 class="title">ติดต่อแอดมิน</h1>
            <p class="subtitle">กรอกข้อมูลด้านล่างเพื่อส่งข้อความถึงทีมงาน</p>
        </div>

        <form id="contactForm" onsubmit="sendToDiscord(event)">
            <!-- 1. ชื่อผู้ติดต่อ -->
            <div class="input-group">
                <label for="username"><i class="fa-solid fa-user"></i> ชื่อผู้ใช้งาน</label>
                <input type="text" id="username" class="input-field" placeholder="กรอกชื่อของคุณ" required>
            </div>

            <!-- 2. ชื่อดิสคอร์ด -->
            <div class="input-group">
                <label for="discordName"><i class="fa-brands fa-discord"></i> ชื่อ Discord (เช่น user#1234 หรือ username)</label>
                <input type="text" id="discordName" class="input-field" placeholder="กรอกชื่อ Discord ของคุณ" required>
            </div>

            <!-- 3. เหตุผลการติดต่อ -->
            <div class="input-group">
                <label for="reason"><i class="fa-solid fa-pen-to-square"></i> เหตุผลการติดต่อ</label>
                <textarea id="reason" class="input-field" placeholder="อธิบายรายละเอียดหรือเรื่องที่ต้องการให้แอดมินช่วยเหลือ..." required></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> ส่งข้อความถึงแอดมิน
            </button>
        </form>
    </div>

    <div class="footer-credit">
        © 2026 J Community. All rights reserved.
    </div>

    <script>
        async function sendToDiscord(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const username = document.getElementById('username').value.trim();
            const discordName = document.getElementById('discordName').value.trim();
            const reason = document.getElementById('reason').value.trim();

            // Webhook URL ของคุณ
            const webhookURL = "https://discord.com/api/webhooks/1530587240072351784/6mJI8leO4RdEoqs9uQVeL8NdwwMN0wNsN6-yLaSBybKW5X2HfRDVAWIYbsiAsMCRSFOe";

            // ปิดการกดปุ่มชั่วคราวกันกดซ้ำ
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';

            // รูปแบบข้อความสวยงามที่จะยิงเข้า Discord (Embed)
            const payload = {
                username: "J Community Contact Bot",
                avatar_url: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
                embeds: [
                    {
                        title: "📩 มีรายการติดต่อแอดมินใหม่!",
                        color: 148008, // โทนสีฟ้าใส
                        fields: [
                            {
                                name: "👤 ชื่อผู้ส่ง:",
                                value: username,
                                inline: true
                            },
                            {
                                name: "💬 Discord:",
                                value: discordName,
                                inline: true
                            },
                            {
                                name: "📝 เหตุผลการติดต่อ:",
                                value: reason,
                                inline: false
                            }
                        ],
                        footer: {
                            text: "J Community Admin System • วันที่ " + new Date().toLocaleString('th-TH')
                        }
                    }
                ]
            };

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("✅ ส่งข้อความถึงแอดมินเรียบร้อยแล้ว! ทีมงานจะติดต่อกลับโดยเร็วที่สุดครับ");
                    document.getElementById('contactForm').reset();
                } else {
                    alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ต");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ส่งข้อความถึงแอดมิน';
            }
        }
    </script>
</body>
</html>
