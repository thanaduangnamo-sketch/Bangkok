<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าหลักร้าน</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Prompt', sans-serif; background: #0f0c29; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    .navbar { width: 90%; max-width: 1000px; display: flex; justify-content: space-between; padding: 20px; background: #1a1a2e; border-radius: 15px; margin-top: 20px; }
    .nav-links { display: flex; gap: 15px; }
    .nav-links a { color: #aaa; text-decoration: none; cursor: pointer; padding: 5px 15px; border-radius: 8px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: #ff0844; background: rgba(255,8,68,0.1); }

    .container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
    .card { width: 90%; max-width: 400px; background: #1a1a2e; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #333; }
    .btn { display: block; width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 10px; font-family: 'Prompt'; cursor: pointer; color: white; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div style="font-weight: 700;">MY SHOP</div>
    <div class="nav-links">
      <a id="nav-home" class="active" onclick="showPage('home', this)">หน้าหลัก</a>
      <a id="nav-login" onclick="showPage('login', this)">สมัครบัญชี</a>
    </div>
  </nav>

  <div class="container">
    <!-- หน้าหลัก -->
    <div class="card" id="home">
      <h1>ยินดีต้อนรับ</h1>
      <p style="color: #888; margin: 20px 0;">ระบบร้านค้าพร้อมใช้งานแล้ว</p>
    </div>

    <!-- หน้าล็อกอิน -->
    <div class="card hidden" id="login">
      <h2>เข้าสู่ระบบ</h2>
      <button onclick="window.location.href='https://discord.com/oauth2/authorize?client_id=1532644387639660627&response_type=code&redirect_uri=https%3A%2F%2Fshop-github-io-phi.vercel.app%2F&scope=email'" style="background: #5865F2;" class="btn">ล็อกอินผ่าน Discord</button>
    </div>

    <!-- หน้าโปรไฟล์ -->
    <div class="card hidden" id="profile">
      <h2>ข้อมูลสมาชิก</h2>
      <p id="user-display" style="margin: 20px 0; color: #ff0844; font-weight: bold;"></p>
      <button onclick="handleLogout()" style="background: #444;" class="btn">ออกจากระบบ</button>
    </div>
  </div>

  <script>
    function showPage(pageId, element) {
      // ซ่อนทุกหน้า
      document.getElementById('home').classList.add('hidden');
      document.getElementById('login').classList.add('hidden');
      document.getElementById('profile').classList.add('hidden');
      
      // แสดงหน้าที่เลือก
      document.getElementById(pageId).classList.remove('hidden');
      
      // ปรับเมนู active
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
      if (element) element.classList.add('active');
    }

    function handleLogout() {
      // รีเซ็ตปุ่มเมนู
      let navLogin = document.getElementById('nav-login');
      navLogin.innerText = "สมัครบัญชี";
      navLogin.onclick = function() { showPage('login', this); };
      
      showPage('home', document.getElementById('nav-home'));
      window.history.replaceState({}, document.title, "/");
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('code')) {
        const username = "Discord User";
        document.getElementById('user-display').innerText = username;
        
        let navLogin = document.getElementById('nav-login');
        navLogin.innerText = username; // เปลี่ยนชื่อบนเมนู
        navLogin.onclick = function() { showPage('profile', this); };
        
        showPage('profile', navLogin);
      }
    }
  </script>
</body>
</html>
