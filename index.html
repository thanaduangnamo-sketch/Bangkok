<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO SCRIPT STORE | แจกสคริปต์เทพ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Kanit', sans-serif; background: #0a0a0c; color: #fff; min-height: 100vh; }

    /* Navbar */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(20, 20, 25, 0.9); border-bottom: 2px solid #ff0844; }
    .logo { font-size: 24px; font-weight: 700; color: #ff0844; }
    .nav-links a { margin-left: 20px; color: #fff; text-decoration: none; cursor: pointer; transition: 0.3s; }
    .nav-links a:hover { color: #ff0844; }

    /* Hero Section */
    .hero { text-align: center; padding: 80px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://wallpaperaccess.com/full/1368817.jpg'); background-size: cover; }
    .hero h1 { font-size: 48px; margin-bottom: 10px; }
    .btn-main { padding: 15px 30px; background: #ff0844; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 18px; }

    /* Shop Grid */
    .shop-section { padding: 50px 5%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #16161a; padding: 20px; border-radius: 10px; border: 1px solid #333; text-align: center; }
    .card h3 { color: #ff0844; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">PRO SCRIPT SHOP</div>
    <div class="nav-links">
      <a onclick="showPage('home')">หน้าหลัก</a>
      <a id="nav-user" onclick="handleLoginFlow()">สมัคร/ล็อกอิน</a>
    </div>
  </nav>

  <!-- หน้าหลัก -->
  <div id="home-page">
    <section class="hero">
      <h1>แจกสคริปต์โปรคุณภาพสูง</h1>
      <p>รวมสคริปต์ที่แรงที่สุดในตอนนี้ ใช้งานง่าย ไม่โดนแบน</p>
      <br>
      <button class="btn-main" onclick="handleLoginFlow()">เริ่มใช้งานสคริปต์</button>
    </section>

    <section class="shop-section">
      <h2>รายการสินค้า</h2>
      <div class="grid">
        <div class="card"><h3>Script A</h3><p>ราคา: 50 บาท</p></div>
        <div class="card"><h3>Script B</h3><p>ราคา: 100 บาท</p></div>
        <div class="card"><h3>Script C</h3><p>ราคา: 150 บาท</p></div>
      </div>
    </section>
  </div>

  <!-- หน้าโปรไฟล์ -->
  <div id="profile-page" class="hidden" style="text-align: center; padding: 100px;">
    <h2>ข้อมูลสมาชิก</h2>
    <p id="user-name" style="font-size: 24px; color: #ff0844; margin: 20px;"></p>
    <button onclick="handleLogout()" style="padding: 10px 20px; background: #444; border:none; color:white; cursor:pointer;">ออกจากระบบ</button>
  </div>

  <script>
    function handleLoginFlow() {
      // วาปไป Discord ทันทีเมื่อกดสมัคร/ล็อกอิน
      window.location.href = "https://discord.com/oauth2/authorize?client_id=1532644387639660627&response_type=code&redirect_uri=https%3A%2F%2Fshop-github-io-phi.vercel.app%2F&scope=email";
    }

    function showPage(page) {
      document.getElementById('home-page').classList.toggle('hidden', page !== 'home');
      document.getElementById('profile-page').classList.toggle('hidden', page !== 'profile');
    }

    function handleLogout() {
      window.location.href = "/";
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('code')) {
        document.getElementById('user-name').innerText = "ยินดีต้อนรับ: Discord User";
        document.getElementById('nav-user').innerText = "โปรไฟล์";
        document.getElementById('nav-user').onclick = function() { showPage('profile'); };
        showPage('profile');
      }
    }
  </script>
</body>
</html>
