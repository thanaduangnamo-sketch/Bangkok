<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceApp | Discord Auth Real Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07080d;
            --card-bg: rgba(20, 22, 30, 0.6);
            --border-glow: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b8e99;
            --primary-purple: #8b5cf6;
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --discord-blurple: #5865F2;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans Thai', sans-serif; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(88, 101, 242, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 45%);
        }

        /* Navbar */
        .navbar {
            background: rgba(7, 8, 13, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-logo { font-size: 22px; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-menu { list-style: none; display: flex; gap: 35px; align-items: center; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.3s; }
        .nav-menu a:hover { color: var(--text-main); }
        .nav-right { display: flex; align-items: center; gap: 15px; }

        /* ปุ่มล็อกอินดิส */
        .btn-discord {
            background: var(--discord-blurple); color: white; padding: 10px 20px; border-radius: 8px;
            font-weight: 600; font-size: 14px; border: none; cursor: pointer; display: flex; align-items: center;
            gap: 8px; text-decoration: none; transition: all 0.2s; box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4);
        }
        .btn-discord:hover { background: #4752c4; transform: translateY(-2px); }

        /* โปรไฟล์ดิสจริง */
        .profile-dropdown { position: relative; display: none; }
        .profile-btn {
            background: var(--input-bg); border: 1px solid var(--border-glow); border-radius: 30px;
            padding: 5px 15px 5px 5px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.3s;
        }
        .profile-btn:hover { background: rgba(255,255,255,0.1); }
        .profile-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .profile-name { font-size: 14px; font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .dropdown-menu {
            position: absolute; top: 110%; right: 0; background: #15171f; border: 1px solid var(--border-glow);
            border-radius: 12px; width: 220px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; overflow: hidden;
        }
        .profile-dropdown.active .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-header { padding: 15px 20px; border-bottom: 1px solid var(--border-glow); margin-bottom: 5px; }
        .dropdown-header strong { display: block; font-size: 15px; margin-bottom: 2px; }
        .dropdown-header span { font-size: 13px; color: var(--text-muted); word-break: break-all; }
        .dropdown-item { padding: 12px 20px; display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text-main); font-size: 14px; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); }
        .dropdown-item.danger { color: #ef4444; }

        /* Hero Section */
        .hero { max-width: 1200px; margin: 0 auto; padding: 100px 20px; text-align: center; position: relative; }
        .hero::before { content: ''; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%); z-index: -1; filter: blur(40px); }
        .hero-badge { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #10b981; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-bottom: 25px; display: inline-block; }
        .hero h1 { font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -2px; margin-bottom: 24px; background: linear-gradient(180deg, #ffffff 0%, #999999 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 19px; color: var(--text-muted); max-width: 600px; margin: 0 auto 40px; line-height: 1.6; }
        .hero-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

        .btn-primary { background: var(--primary-gradient); color: white; padding: 16px 32px; border-radius: 12px; font-weight: 600; font-size: 16px; border: none; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3); display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(139, 92, 246, 0.5); }
        .btn-secondary { background: var(--input-bg); border: 1px solid var(--border-glow); color: var(--text-main); padding: 16px 32px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* Loading state */
        .loading-spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            FinanceApp
        </div>
        
        <ul class="nav-menu">
            <li><a href="#">หน้าหลัก</a></li>
            <li><a href="#">สถิติ</a></li>
            <li><a href="#">เกี่ยวกับเรา</a></li>
        </ul>

        <div class="nav-right" id="navRight">
            <!-- ปุ่มล็อกอินหรือข้อมูลโปรไฟล์จะถูกใส่ที่นี่ -->
        </div>
    </nav>

    <section class="hero">
        <div class="hero-badge">🚀 ระบบทันสมัย ล็อกอินง่ายด้วย Discord</div>
        <h1>จัดการการเงิน<br>อย่างชาญฉลาด</h1>
        <p>บันทึกการใช้จ่าย วิเคราะห์รายงาน และจัดการคลังทรัพย์ของคุณได้ทุกที่ทุกเวลา ด้วยระบบที่ปลอดภัยและทันสมัยที่สุด</p>
        
        <div class="hero-actions" id="heroActions">
            <!-- ปุ่มด้านล่างหัวข้อใหญ่ -->
        </div>
    </section>

    <script>
        // 1. ตั้งค่า OAuth2 (ใช้ Implicit Grant เพื่อดึงข้อมูลจริงแบบ Frontend-only)
        const CLIENT_ID = "1532644387639660627";
        const REDIRECT_URI = window.location.origin + window.location.pathname; // ดึง URL ปัจจุบันเองอัตโนมัติ
        const DISCORD_OAUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify`;

        let discordUser = null;

        // 2. ฟังก์ชันตรวจสอบ Token ใน URL (หลังจาก Discord Redirect กลับมา)
        function checkDiscordAuth() {
            const hash = window.location.hash;
            if (hash.includes('access_token')) {
                // ดึง Token ออกจาก URL
                const token = hash.match(/access_token=(.*)&/)[1];
                // เคลียร์ URL ให้สะอาด (เพื่อความปลอดภัย)
                history.replaceState(null, null, window.location.pathname);
                
                // เรียก API ดึงข้อมูลดิสจริง
                fetchDiscordUser(token);
                return true;
            }
            return false;
        }

        // 3. ฟังก์ชันเรียก API Discord เพื่อดึงชื่อและรูปจริง
        async function fetchDiscordUser(token) {
            // แสดงสถานะกำลังโหลด
            document.getElementById('navRight').innerHTML = `<div style="width: 100px; display: flex; justify-content: center;"><div class="loading-spinner"></div></div>`;

            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error('Unauthorized');
                
                const data = await response.json();
                
                // เซฟข้อมูลจริงลงตัวแปร
                discordUser = {
                    id: data.id,
                    username: data.username,
                    global_name: data.global_name || data.username,
                    avatar: data.avatar 
                        ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=128`
                        : `https://cdn.discordapp.com/embed/avatars/${data.discriminator % 5}.png` // รูปดิสเริ่มต้นถ้าไม่มี
                };

                updateUI(); // อัปเดตหน้าจอให้แสดงโปรไฟล์จริง

            } catch (error) {
                console.error('Failed to fetch Discord user:', error);
                document.getElementById('navRight').innerHTML = `<button class="btn-discord" onclick="loginDiscord()">ลองใหม่อีกครั้ง</button>`;
            }
        }

        // 4. ฟังก์ชันอัปเดต UI
        function updateUI() {
            const navRight = document.getElementById('navRight');
            const heroActions = document.getElementById('heroActions');

            if (discordUser) {
                // --- แสดงโปรไฟล์ดิสจริง ---
                navRight.innerHTML = `
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-btn" onclick="toggleDropdown()">
                            <img src="${discordUser.avatar}" alt="Avatar" class="profile-avatar">
                            <span class="profile-name">${discordUser.global_name}</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-header">
                                <strong>${discordUser.global_name}</strong>
                                <span>@${discordUser.username}</span>
                            </div>
                            <a href="#" class="dropdown-item" onclick="closeDropdown()">โปรไฟล์ของฉัน</a>
                            <a href="#" class="dropdown-item" onclick="closeDropdown()">ตั้งค่าบัญชี</a>
                            <button class="dropdown-item danger" onclick="handleLogout()">ออกจากระบบ</button>
                        </div>
                    </div>
                `;

                heroActions.innerHTML = `
                    <button class="btn-primary" onclick="alert('เปิดฟอร์มเพิ่มรายการ!')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        เพิ่มรายการใช้จ่าย
                    </button>
                    <button class="btn-secondary" onclick="alert('ไปหน้าสถิติ')">ดูสถิติของฉัน</button>
                `;
            } else {
                // --- แสดงปุ่มล็อกอินดิส ---
                navRight.innerHTML = `
                    <button class="btn-discord" onclick="loginDiscord()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        เข้าสู่ระบบด้วย Discord
                    </button>
                `;

                heroActions.innerHTML = `
                    <button class="btn-discord" onclick="loginDiscord()" style="padding: 16px 32px; font-size: 16px; border-radius: 12px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        เข้าสู่ระบบเพื่อเริ่มใช้งาน
                    </button>
                `;
            }
        }

        // 5. ฟังก์ชันเปิดลิงก์ Discord
        function loginDiscord() {
            window.location.href = DISCORD_OAUTH_URL;
        }

        // 6. ฟังก์ชันออกจากระบบ
        function handleLogout() {
            discordUser = null;
            // ล้าง Token ทิ้ง (ถ้าเก็บไว้ใน localStorage ก็ต้องล้างด้วย)
            updateUI();
            alert('ออกจากระบบสำเร็จ');
        }

        // 7. ฟังก์ชันเปิด/ปิด เมนู Dropdown
        function toggleDropdown() {
            document.getElementById('profileDropdown').classList.toggle('active');
        }
        function closeDropdown() {
            document.getElementById('profileDropdown').classList.remove('active');
        }

        // ปิดเมนูถ้าคลิกข้างนอก
        window.onclick = function(event) {
            if (!event.target.closest('.profile-dropdown')) {
                closeDropdown();
            }
        }

        // --- เริ่มการทำงาน ---
        // ตรวจสอบทันทีเมื่อโหลดเว็บว่ากลับมาจาก Discord หรือไม่
        const isReturningFromDiscord = checkDiscordAuth();
        
        if (!isReturningFromDiscord) {
            // ถ้ายังไม่ได้ล็อกอิน แสดงปุ่มล็อกอิน
            updateUI();
        }
    </script>

</body>
</html>
