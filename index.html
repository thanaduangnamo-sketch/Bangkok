<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Shop - ร้านค้าออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #FAFAFA; } </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-black">

    <!-- NAVBAR -->
    <header class="w-full bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center font-extrabold text-white text-sm">GPS</div>
                <span class="text-xl font-extrabold">GPS SHOP</span>
            </div>

            <div id="authContainer">
                <button id="openAuthBtn" onclick="toggleAuthModal(true)" class="bg-black hover:bg-gray-800 text-white font-semibold px-6 py-2.5 rounded-xl transition text-sm">
                    เข้าสู่ระบบ / สมัครสมาชิก
                </button>

                <div id="userProfile" class="hidden flex items-center gap-3 bg-white border border-gray-200 p-1.5 pl-3 rounded-2xl shadow-sm">
                    <div id="emailAvatar" class="w-9 h-9 bg-black text-white rounded-xl flex items-center justify-center font-bold uppercase">U</div>
                    <div class="text-left">
                        <p id="displayEmail" class="text-sm font-bold leading-tight max-w-[150px] truncate">user@email.com</p>
                        <span class="text-[10px] font-semibold text-emerald-600">● เข้าสู่ระบบแล้ว</span>
                    </div>
                    <button onclick="logout()" class="ml-2 text-xs text-red-500 bg-red-50 hover:bg-red-100 font-medium px-3 py-2 rounded-xl transition">
                        ออกจากระบบ
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- AUTH MODAL WITH OTP -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-gray-100 w-full max-w-md p-8 relative">
            <button onclick="toggleAuthModal(false)" class="absolute top-5 right-5 text-gray-400 hover:text-black font-bold text-xl">✕</button>

            <!-- Step 1: กรอกอีเมล -->
            <div id="stepEmail">
                <h3 class="text-2xl font-bold mb-2">เข้าสู่ระบบด้วย OTP</h3>
                <p class="text-xs text-gray-500 mb-6">กรอกอีเมลเพื่อรับรหัสยืนยัน 6 หลัก</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">อีเมลของคุณ</label>
                        <input type="email" id="targetEmail" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black text-sm">
                    </div>
                    <button onclick="sendOTP()" id="sendBtn" class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3.5 rounded-xl transition">
                        ขอรับรหัส OTP
                    </button>
                </div>
            </div>

            <!-- Step 2: กรอกรหัส OTP 6 หลัก -->
            <div id="stepOTP" class="hidden">
                <h3 class="text-2xl font-bold mb-2">ยืนยันรหัส OTP</h3>
                <p class="text-xs text-gray-500 mb-6">รหัสถูกส่งไปที่ <span id="sentEmailText" class="font-bold text-black"></span></p>
                
                <!-- ช่องใส่เลข 6 ช่อง -->
                <div class="flex justify-between gap-2 mb-6" id="otpInputs">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 text-center text-xl font-bold border border-gray-200 rounded-xl focus:border-black focus:outline-none">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 text-center text-xl font-bold border border-gray-200 rounded-xl focus:border-black focus:outline-none">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 text-center text-xl font-bold border border-gray-200 rounded-xl focus:border-black focus:outline-none">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 text-center text-xl font-bold border border-gray-200 rounded-xl focus:border-black focus:outline-none">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 text-center text-xl font-bold border border-gray-200 rounded-xl focus:border-black focus:outline-none">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 text-center text-xl font-bold border border-gray-200 rounded-xl focus:border-black focus:outline-none">
                </div>

                <button onclick="verifyOTP()" id="verifyBtn" class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3.5 rounded-xl transition mb-3">
                    ยืนยันตัวตน
                </button>
                <button onclick="resetModal()" class="w-full text-xs text-gray-400 hover:text-black">
                    เปลี่ยนอีเมล / ย้อนกลับ
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleAuthModal(show) {
            document.getElementById('authModal').classList.toggle('hidden', !show);
            if(!show) resetModal();
        }

        function resetModal() {
            document.getElementById('stepEmail').classList.remove('hidden');
            document.getElementById('stepOTP').classList.add('hidden');
            document.querySelectorAll('.otp-box').forEach(input => input.value = '');
        }

        // Logic ย้ายโฟกัสช่องกรอก OTP ตัวถัดไปอัตโนมัติ
        const otpInputs = document.querySelectorAll('.otp-box');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // ฟังก์ชันกดส่ง OTP ไป API
        async function sendOTP() {
            const email = document.getElementById('targetEmail').value;
            if (!email) return alert('กรุณากรอกอีเมล');

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.innerText = 'กำลังส่ง OTP...';
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('sentEmailText').innerText = email;
                    document.getElementById('stepEmail').classList.add('hidden');
                    document.getElementById('stepOTP').classList.remove('hidden');
                    otpInputs[0].focus();
                } else {
                    alert(data.message || 'เกิดข้อผิดพลาด');
                }
            } catch (err) {
                alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
            } finally {
                sendBtn.innerText = 'ขอรับรหัส OTP';
                sendBtn.disabled = false;
            }
        }

        // ฟังก์ชันส่ง OTP 6 หลักไปตรวจที่ API
        async function verifyOTP() {
            const email = document.getElementById('targetEmail').value;
            let otp = '';
            otpInputs.forEach(input => otp += input.value);

            if (otp.length !== 6) return alert('กรุณากรอก OTP ให้ครบ 6 หลัก');

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.innerText = 'กำลังตรวจสอบ...';
            verifyBtn.disabled = true;

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user_email', email);
                    updateProfileUI(email);
                    toggleAuthModal(false);
                } else {
                    alert(data.message || 'รหัส OTP ไม่ถูกต้อง');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการตรวจสอบ');
            } finally {
                verifyBtn.innerText = 'ยืนยันตัวตน';
                verifyBtn.disabled = false;
            }
        }

        function updateProfileUI(email) {
            document.getElementById('openAuthBtn').classList.add('hidden');
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('emailAvatar').innerText = email.charAt(0).toUpperCase();
            document.getElementById('displayEmail').innerText = email;
        }

        function logout() {
            localStorage.removeItem('user_email');
            location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('user_email');
            if (savedEmail) updateProfileUI(savedEmail);
        });
    </script>
</body>
</html>
