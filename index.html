<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAF SHOP | Login</title>
    <style>
        :root { --bg: #060911; --card: #0c101d; --text: #ffffff; --primary: #8b5cf6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: var(--card); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #222; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #161b2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .checkbox { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="login-card" id="loginBox">
    <h2 style="text-align: center;">เข้าสู่ระบบ</h2>
    <input type="email" id="email" placeholder="อีเมล">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <label class="checkbox">
        <input type="checkbox" id="rememberMe"> จดจำการเข้าสู่ระบบ
    </label>
    <button onclick="handleLogin()">เข้าสู่ระบบ</button>
</div>

<div id="dashboard" style="display: none; text-align: center;">
    <h1>ยินดีต้อนรับกลับมา!</h1>
    <p id="userEmailDisplay"></p>
    <button onclick="logout()" style="background: #ef4444; width: auto;">ออกจากระบบ</button>
</div>

<script>
    // ตรวจสอบสถานะการล็อกอิน
    window.onload = () => {
        const savedUser = localStorage.getItem('dhaf_user');
        if (savedUser) {
            showDashboard(JSON.parse(savedUser).email);
        }
    };

    function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const remember = document.getElementById('rememberMe').checked;

        if (email && password) {
            const userData = { email: email };
            if (remember) {
                localStorage.setItem('dhaf_user', JSON.stringify(userData));
            } else {
                sessionStorage.setItem('dhaf_user', JSON.stringify(userData));
            }
            showDashboard(email);
        } else {
            alert('กรุณากรอกอีเมลและรหัสผ่าน');
        }
    }

    function showDashboard(email) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('userEmailDisplay').innerText = "ผู้ใช้งาน: " + email;
    }

    function logout() {
        localStorage.removeItem('dhaf_user');
        sessionStorage.removeItem('dhaf_user');
        location.reload();
    }
</script>
</body>
</html>
