<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J Community</title>
    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* แถบบน (OS Top Bar) */
        .os-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
            padding: 0 2rem;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .brand-logo::before {
            content: '';
            display: inline-block;
            width: 100px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            width: 10px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1rem;
            align-items: center;
        }

        /* ปุ่มเมนู */
        .nav-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .nav-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ปุ่มสร้างบัญชี (แบบเส้นขอบ) */
        .btn-register {
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }

        .btn-register:hover {
            background: rgba(56, 189, 248, 0.1);
            color: #ffffff;
        }

        /* ปุ่มเข้าสู่ระบบ (แบบปุ่มทึบ) */
        .btn-login {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-1px);
        }

        /* ส่วนแสดงเนื้อหาแต่ละหน้า */
        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .page-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .page-section.active {
            display: block;
        }

        /* กล่องฟอร์ม (Login/Register) */
        .auth-card {
            max-width: 400px;
            margin: 2rem auto;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: #38bdf8;
        }

        /* ปุ่ม Google Login */
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            color: #1f2937;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-bottom: 1.5rem;
        }

        .btn-google:hover {
            background: #f3f4f6;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        /* เส้นแบ่ง OR */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #334155;
        }

        .divider span {
            padding: 0 10px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- OS Top Navbar -->
    <nav class="os-navbar">
        <div class="brand-logo" onclick="switchPage('home')">
            𝗝 𝗖𝗼𝗺𝗺𝘂𝗻𝗶𝘁𝘆
        </div>
        
        <div class="nav-links">
            <button class="nav-btn" onclick="switchPage('home')">หน้าแรก</button>
            <button class="nav-btn" onclick="switchPage('shop')">ร้านค้า</button>
            <button class="nav-btn" onclick="switchPage('topup')">เติมเงิน</button>
            <button class="nav-btn btn-register" onclick="switchPage('register')">สร้างบัญชี</button>
            <button class="nav-btn btn-login" onclick="switchPage('login')">เข้าสู่ระบบ</button>
        </div>
    </nav>

    <!-- Content Sections -->
    <div class="main-container">
        
        <!-- หน้าหลัก -->
        <div id="home" class="page-section active">
            <h1>ยินดีต้อนรับสู่ 𝗝 𝗖𝗼𝗺𝗺𝘂𝗻𝗶𝘁𝘆</h1>
            <p style="color: #94a3b8; margin-top: 10px;">เลือกสมัครสมาชิกด้วย Google หรือบัญชีปกติได้ทันที</p>
        </div>

        <!-- หน้าร้านค้า -->
        <div id="shop" class="page-section">
            <h1>🛒 ร้านค้า</h1>
            <p style="color: #94a3b8; margin-top: 10px;">รายการสินค้าทั้งหมดจะแสดงที่นี่</p>
        </div>

        <!-- หน้าเติมเงิน -->
        <div id="topup" class="page-section">
            <h1>💳 เติมเงิน</h1>
            <p style="color: #94a3b8; margin-top: 10px;">เลือกช่องทางการเติมเงินของคุณ</p>
        </div>

        <!-- หน้าสร้างบัญชี -->
        <div id="register" class="page-section">
            <div class="auth-card">
                <h2>✨ สร้างบัญชีใหม่</h2>
                
                <!-- ปุ่ม Google Register -->
                <button class="btn-google" onclick="handleGoogleAuth()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                    สมัครด้วย Google
                </button>

                <div class="divider"><span>หรือใช้อีเมลสมัคร</span></div>

                <form onsubmit="event.preventDefault(); alert('สมัครสมาชิกด้วยอีเมลสำเร็จ!');">
                    <div class="form-group">
                        <label>ชื่อผู้ใช้ (Username)</label>
                        <input type="text" placeholder="ตั้งชื่อผู้ใช้..." required>
                    </div>
                    <div class="form-group">
                        <label>อีเมล (Email)</label>
                        <input type="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>รหัสผ่าน (Password)</label>
                        <input type="password" placeholder="อย่างน้อย 6 ตัวอักษร" required>
                    </div>
                    <button type="submit" class="submit-btn">ยืนยันสมัครสมาชิก</button>
                </form>
            </div>
        </div>

        <!-- หน้าเข้าสู่ระบบ -->
        <div id="login" class="page-section">
            <div class="auth-card">
                <h2>🔑 เข้าสู่ระบบ</h2>
                
                <!-- ปุ่ม Google Login -->
                <button class="btn-google" onclick="handleGoogleAuth()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                    เข้าสู่ระบบด้วย Google
                </button>

                <div class="divider"><span>หรือใช้อีเมลเข้าสู่ระบบ</span></div>

                <form onsubmit="event.preventDefault(); alert('เข้าสู่ระบบสำเร็จ!');">
                    <div class="form-group">
                        <label>ชื่อผู้ใช้ / อีเมล</label>
                        <input type="text" placeholder="กรอกชื่อผู้ใช้ หรือ อีเมล" required>
                    </div>
                    <div class="form-group">
                        <label>รหัสผ่าน</label>
                        <input type="password" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                    <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        // ฟังก์ชันสลับหน้า
        function switchPage(pageId) {
            const sections = document.querySelectorAll('.page-section');
            sections.forEach(section => {
                section.classList.remove('active');
            });

            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active');
            }
        }

        // ฟังก์ชันจำลองการทำงานเมื่อกดปุ่ม Google
        function handleGoogleAuth() {
            alert('กำลังเชื่อมต่อระบบยืนยันตัวตนผ่าน Google...');
            // เมื่อเชื่อมกับ Backend ในอนาคต ให้ใส่ Client ID จาก Google Cloud Console ตรงนี้ครับ
        }
    </script>

</body>
</html>
